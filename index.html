        g.beginPath(); g.moveTo(-24, -36); g.lineTo(-24, -26); g.stroke();
        // 座垫
        g.fillStyle = '#4a4a52';
        g.beginPath(); g.roundRect ? g.roundRect(2, -24, 14, 7, 3.5) : g.rect(2, -24, 14, 7); g.fill();
        // 前灯
        g.fillStyle = '#fff8c0';
        g.beginPath(); g.arc(14, -13, 2.6, 0, 6.283); g.fill();
      } else if (vid === 'bike') {
        g.fillStyle = '#2e2622';
        g.beginPath(); g.arc(15, -7, 7, 0, 6.283); g.fill();
        g.beginPath(); g.arc(-15, -7, 7, 0, 6.283); g.fill();
        g.fillStyle = '#fff'; g.beginPath(); g.arc(15, -7, 2.6, 0, 6.283); g.fill();
        g.beginPath(); g.arc(-15, -7, 2.6, 0, 6.283); g.fill();
        // 车架
        g.strokeStyle = accent; g.lineWidth = 3.6; g.lineCap = 'round';
        g.beginPath();
        g.moveTo(-15, -8); g.lineTo(-4, -22); g.lineTo(15, -8);
        g.moveTo(-4, -22); g.lineTo(4, -16);
        g.moveTo(-4, -22); g.quadraticCurveTo(2, -30, -6, -33);
        g.stroke();
        g.strokeStyle = '#6a7078'; g.lineWidth = 2.6;
        g.beginPath(); g.moveTo(-6, -33); g.lineTo(-14, -31); g.stroke();
        // 座垫
        g.fillStyle = '#3a3a42';
        g.beginPath(); g.roundRect ? g.roundRect(-8, -26, 11, 5, 2.5) : g.rect(-8, -26, 11, 5); g.fill();
        // 辐条感
        g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 1.1;
        for (let i = 0; i < 3; i++) {
          const a = i * 2.09 + runL * 0.5;
          g.beginPath(); g.moveTo(15, -7); g.lineTo(15 + Math.cos(a) * 6, -7 + Math.sin(a) * 6); g.stroke();
          g.beginPath(); g.moveTo(-15, -7); g.lineTo(-15 + Math.cos(a + 1) * 6, -7 + Math.sin(a + 1) * 6); g.stroke();
        }
      } else if (vid === 'kick') {
        g.fillStyle = '#2e2622';
        g.beginPath(); g.arc(11, -6, 5.5, 0, 6.283); g.fill();
        g.beginPath(); g.arc(-11, -6, 5.5, 0, 6.283); g.fill();
        g.fillStyle = '#fff'; g.beginPath(); g.arc(11, -6, 2, 0, 6.283); g.fill();
        g.beginPath(); g.arc(-11, -6, 2, 0, 6.283); g.fill();
        // 踏板
        g.fillStyle = '#fff';
        g.beginPath(); g.roundRect ? g.roundRect(-18, -12, 38, 7, 3.5) : g.rect(-18, -12, 38, 7); g.fill();
        g.fillStyle = accent;
        g.beginPath(); g.roundRect ? g.roundRect(-17, -11.5, 30, 5, 2.5) : g.rect(-17, -11.5, 30, 5); g.fill();
        // 立杆
        g.strokeStyle = '#8a9099'; g.lineWidth = 4; g.lineCap = 'round';
        g.beginPath(); g.moveTo(-15, -10); g.quadraticCurveTo(-22, -18, -26, -34); g.stroke();
        // 车把横
        g.strokeStyle = '#3a3a42'; g.lineWidth = 3.4;
        g.beginPath(); g.moveTo(-24, -36); g.lineTo(-30, -35); g.stroke();
      } else if (vid === 'board') {
        g.strokeStyle = '#2e2622'; g.lineWidth = 5; g.lineCap = 'round';
        g.beginPath();
        g.moveTo(-19, -6); g.quadraticCurveTo(0, 2, 19, -6);
        g.stroke();
        g.strokeStyle = accent; g.lineWidth = 2.8;
        g.beginPath();
        g.moveTo(-18, -7); g.quadraticCurveTo(0, 0.5, 18, -7);
        g.stroke();
        g.fillStyle = '#2e2622';
        g.beginPath(); g.ellipse(-12, -3, 2.6, 2.2, 0, 0, 6.283); g.fill();
        g.beginPath(); g.ellipse(12, -3, 2.6, 2.2, 0, 0, 6.283); g.fill();
        g.fillStyle = '#fff';
        g.beginPath(); g.arc(-12, -3, 0.9, 0, 6.283); g.fill();
        g.beginPath(); g.arc(12, -3, 0.9, 0, 6.283); g.fill();
      } else if (vid === 'sled') {
        // 冰刀滑轨
        g.strokeStyle = '#2e2622'; g.lineWidth = 3; g.lineCap = 'round';
        g.beginPath(); g.moveTo(-18, -2); g.quadraticCurveTo(0, 4, 18, -2); g.stroke();
        g.strokeStyle = accent; g.lineWidth = 2;
        g.beginPath(); g.moveTo(-17, -3); g.quadraticCurveTo(0, 2.4, 17, -3); g.stroke();
        // 车身
        g.fillStyle = '#fff';
        g.beginPath(); g.roundRect ? g.roundRect(-15, -20, 32, 12, 6) : g.rect(-15, -20, 32, 12); g.fill();
        g.fillStyle = accent;
        g.beginPath(); g.roundRect ? g.roundRect(-13, -18.5, 26, 8, 4) : g.rect(-13, -18.5, 26, 8); g.fill();
        // 靠背
        g.fillStyle = accent;
        g.beginPath(); g.roundRect ? g.roundRect(-14, -34, 7, 15, 3) : g.rect(-14, -34, 7, 15); g.fill();
        // 横杠装饰
        g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath(); g.moveTo(-11, -15); g.lineTo(11, -15); g.stroke();
      }
    }
    // 在 (x, groundY) 画载具；flip 朝向，vid，accent 主色，t 时间
    ART.drawVehicle = function (vid, g, x, groundY, flip, accent, t) {
      g.save();
      g.translate(x, groundY);
      g.scale(flip, 1);
      g.__vt = t;
      drawVehicleShape(g, vid, accent);
      g.restore();
    };

    /* =========================================================================
     * 9. 渲染
     * ====================================================================== */
    function cameraOffsetY() {
      // 让地面基准线落在「视口底部 - pad」处
      return GROUND_BASE - (view.h - view.pad);
    }

    // 带穿戴的宠物绘制（意见②）：游戏内所有宠物立绘统一走这里，
    // 自动套上已穿戴的帽子/眼镜/围巾。room 小屋里换装立即生效。
    function drawPetWithEq(id, g, x, y, s, flip, t, run) {
      ART.drawPet(id, g, x, y, s, flip, t, run, save.eq);
    }

    /* 全屏菜单态：这些界面是"模态面板"，底下的游戏世界/关卡 HUD 没有信息价值，
     * 画出来只会跟面板内容抢视觉（工坊 5 行卡片曾被 HUD 和关卡宠物糊成一团）。
     * 统一在这里判定，HUD、虚拟按键、遮罩浓度都读它，避免三处各判一遍。 */
    function isMenuState(s) {
      return s === 'cover' || s === 'scores' || s === 'achievements' || s === 'daily' ||
             s === 'bag' || s === 'sign' || s === 'chest' || s === 'quest' ||
             s === 'freeItem' || s === 'garage';
    }

    function render() {
      const w = view.w, h = view.h;
      ctx.clearRect(0, 0, w, h);
      if (state === 'room') {
        // 意见②：小屋场景独立渲染（不画 HUD / 虚拟按键 / 游戏世界）
        drawRoom(w, h);
        drawParticles();
        drawOverlayButtons();
        drawToast();
        drawVignette(w, h);
        return;
      }
      drawSky(w, h);
      drawParallax();
      drawTerrain();
      drawStars();
      drawGoal();
      drawHazards();
      drawPlayer();
      drawParticles();
      drawFloaters();
      if (screenFlash > 0) {
        ctx.fillStyle = 'rgba(255,80,80,' + (screenFlash / 0.18 * 0.35).toFixed(3) + ')';
        ctx.fillRect(0, 0, w, h);
      }
      drawHUD();
      drawTouchControls();
      drawOverlay();
      drawToast();
      drawVignette(w, h);
    }
    // 暗角（2.5D 精致化）：屏幕边缘轻微压暗，聚焦画面中心，提升质感
    function drawVignette(w, h) {
      const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.36, w / 2, h / 2, Math.max(w, h) * 0.74);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(18,10,36,0.30)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }

    function drawSky(w, h) {
      if (!sky) {
        sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, theme.sky1);
        sky.addColorStop(0.62, theme.sky2);
        sky.addColorStop(1, theme.dark ? '#120c1c' : theme.sky2);
      }
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      if (!theme.dark) {
        // 明亮主题：太阳（右上）+ 卡通云
        const sunX = view.portrait ? w * 0.5 : w - 130, sunY = 84;
        // 2.5D：太阳 radial 光晕（大而柔和的光斑，非生硬圆盘）
        const halo = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 90);
        halo.addColorStop(0, 'rgba(255,240,170,0.75)');
        halo.addColorStop(0.4, 'rgba(255,235,150,0.35)');
        halo.addColorStop(1, 'rgba(255,235,150,0)');
        ctx.fillStyle = halo;
        ctx.fillRect(sunX - 92, sunY - 92, 184, 184);
        ctx.fillStyle = '#ffe58a';
        ctx.beginPath(); ctx.arc(sunX, sunY, 36, 0, 6.283); ctx.fill();
        ctx.fillStyle = '#fff3c4';
        ctx.beginPath(); ctx.arc(sunX - 8, sunY - 9, 22, 0, 6.283); ctx.fill();
        // 太阳脸（微笑）
        ctx.strokeStyle = '#f0a830'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(sunX, sunY + 2, 16, 0.25, 2.9); ctx.stroke();
        // 卡通云（视差漂移）
        for (let i = 0; i < 4; i++) {
          const sp = 0.05 + i * 0.02;
          const cwx = ((i * 260 - timeAcc * 22 * (1 + i * 0.35)) % (w + 240) + w + 240) % (w + 240) - 120;
          const cwy = 46 + (i % 3) * 42;
          ctx.fillStyle = 'rgba(255,255,255,0.82)';
          ctx.beginPath(); ctx.arc(cwx, cwy, 20, 0, 6.283); ctx.fill();
          ctx.beginPath(); ctx.arc(cwx + 20, cwy - 8, 16, 0, 6.283); ctx.fill();
          ctx.beginPath(); ctx.arc(cwx + 40, cwy, 18, 0, 6.283); ctx.fill();
          ctx.fillStyle = 'rgba(240,248,255,0.9)';
          ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cwx - 18, cwy, 74, 12, 6) : ctx.rect(cwx - 18, cwy, 74, 12); ctx.fill();
        }
      } else {
        // 暗色主题：星空闪烁
        for (let i = 0; i < 22; i++) {
          const sx2 = ((i * 97 + timeAcc * 3) % w + w) % w;
          const sy2 = (i * 53) % (h * 0.5);
          const tw = 0.5 + 0.5 * Math.sin(timeAcc * 2 + i);
          ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + tw * 0.5).toFixed(2) + ')';
          ctx.beginPath(); ctx.arc(sx2, sy2, i % 3 === 0 ? 1.8 : 1.1, 0, 6.283); ctx.fill();
        }
      }

      // 深渊（地面以下）
      const gy = GROUND_BASE - cameraOffsetY();
      if (gy < h) {
        const g2 = ctx.createLinearGradient(0, gy + 60, 0, h);
        g2.addColorStop(0, theme.deep);
        g2.addColorStop(1, theme.dark ? '#0a0714' : '#1b2733');
        ctx.fillStyle = g2;
        ctx.fillRect(0, gy + 60, w, h - gy - 60);
      }
    }

    function drawParallax() {
      const cy = cameraOffsetY();
      ctx.save();
      for (const b of backdrop) {
        const sx = b.x - cameraX * b.p;
        const sy = b.y - cy * b.p * 0.5 + view.h * 0.12;
        // 水平循环（跨度见 buildBackdrop：普通=关卡长度，无尽=固定跨度）
        const span = backdropSpan;
        let mx = ((sx % span) + span) % span - 200;
        if (mx < -80 || mx > view.w + 80) continue;
        if (sy < -80 || sy > view.h + 80) continue;
        ctx.globalAlpha = b.a;
        ctx.fillStyle = theme.dark ? '#ffffff' : theme.decor === 'snow' ? '#ffffff' : theme.edge;
        drawDecorShape(mx, sy, b.r, b.k);
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function drawDecorShape(x, y, r, k) {
      const kind = theme.decor;
      if (kind === 'flower' || kind === 'snow' || kind === 'lava') {
        ctx.beginPath(); ctx.arc(x, y, r * 0.5, 0, 6.283); ctx.fill();
        if (k > 0.6) { ctx.beginPath(); ctx.arc(x + r * 0.4, y - r * 0.3, r * 0.3, 0, 6.283); ctx.fill(); }
      } else if (kind === 'cactus') {
        ctx.fillRect(x - r * 0.12, y - r, r * 0.24, r);
        ctx.fillRect(x + r * 0.12, y - r * 0.7, r * 0.3, r * 0.18);
      } else if (kind === 'candy') {
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x + r * 0.5, y - r); ctx.lineTo(x + r, y);
        ctx.fill();
      } else if (kind === 'building') {
        ctx.fillRect(x - r * 0.4, y - r * 1.6, r * 0.8, r * 1.6);
        ctx.save();
        ctx.globalAlpha *= 0.5;
        ctx.fillStyle = '#ffe9a8';
        for (let rr = 0; rr < 3; rr++) {
          for (let cc = 0; cc < 2; cc++) {
            if ((rr + cc + Math.floor(k * 10)) % 2 === 0)
              ctx.fillRect(x - r * 0.26 + cc * r * 0.3, y - r * 1.4 + rr * r * 0.42, r * 0.14, r * 0.2);
          }
        }
        ctx.restore();
      }
    }

    function drawTerrain() {
      const cy = cameraOffsetY();
      for (const s of platforms) {
        const sx = s.x - cameraX;
        const sy = s.y - cy;
        if (sx + s.w < -60 || sx > view.w + 60) continue;
        const bottom = Math.min(s.y + s.h, ABYSS_Y + 400);
        ctx.fillStyle = theme.deep;
        ctx.fillRect(sx, sy, s.w, bottom - s.y);
        // 草皮：上层浅色 + 圆润顶
        ctx.fillStyle = theme.ground;
        ctx.fillRect(sx, sy, s.w, 16);
        ctx.fillStyle = theme.edge;
        ctx.fillRect(sx, sy, s.w, 5);
        // 草皮顶部圆润高光
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fillRect(sx + 3, sy, s.w - 6, 2.4);
        // 侧面描边，增强平台边界可读性
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.fillRect(sx, sy + 14, 4, Math.min(bottom - s.y, 120));
        ctx.fillRect(sx + s.w - 4, sy + 14, 4, Math.min(bottom - s.y, 120));
        // 草丛可爱装饰（小圆点/小花，世界坐标循环）
        if (theme.decor === 'flower' || theme.decor === 'candy' || theme.decor === 'snow') {
          const seg = Math.floor((s.x + 10) / 46);
          for (let j = 0; j < Math.floor(s.w / 46); j++) {
            const hx = sx + 20 + j * 46 + (seg % 2) * 14;
            const hh = 6 + ((j + seg) % 3) * 2.5;
            ctx.fillStyle = theme.decor === 'snow' ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.32)';
            ctx.beginPath(); ctx.ellipse(hx, sy - hh + 6, 2.6, hh, 0, 0, 6.283); ctx.fill();
            if (theme.decor !== 'snow' && j % 3 === 0) {
              ctx.fillStyle = '#ffffff';
              ctx.beginPath(); ctx.arc(hx, sy - hh - 1, 2.6, 0, 6.283); ctx.fill();
              ctx.fillStyle = j % 2 ? '#ffb7c5' : '#ffe58a';
              ctx.beginPath(); ctx.arc(hx, sy - hh - 1, 1.5, 0, 6.283); ctx.fill();
            }
          }
        }
      }
    }

    function drawStars() {
      const cy = cameraOffsetY();
      for (const s of stars) {
        if (s.taken) continue;
        const sx = s.x - cameraX;
        if (sx < -50 || sx > view.w + 50) continue;
        const bob = Math.sin(s.bob + timeAcc * 3) * 6;
        const sy = s.y - cy + bob;
        // 金色光环
        ctx.save();
        const pulse = 1 + Math.sin(s.bob * 1.3 + timeAcc * 4) * 0.12;
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#ffe082';
        ctx.beginPath(); ctx.arc(sx, sy, 17 * pulse, 0, 6.283); ctx.fill();
        ctx.globalAlpha = 1;
        // 手绘星星（外描白边）
        ART.star(ctx, sx, sy, 13 * pulse, '#ffd24a', 'rgba(255,255,255,0.9)');
        ctx.fillStyle = '#fff8e1';
        ctx.beginPath(); ctx.arc(sx - 3, sy - 3.5, 3, 0, 6.283); ctx.fill();
        ctx.restore();
      }
    }

    function drawGoal() {
      if (!goal) return;
      const cy = cameraOffsetY();
      const sx = goal.x - cameraX, sy = goal.y - cy;
      if (sx < -160 || sx > view.w + 160) return;
      ctx.save();
      // 光柱
      const g = ctx.createLinearGradient(sx + 26, sy - 130, sx + 26, sy + 90);
      g.addColorStop(0, 'rgba(255,215,90,0)');
      g.addColorStop(1, 'rgba(255,215,90,0.5)');
      ctx.fillStyle = g;
      ctx.fillRect(sx - 22, sy - 130, 96, 220);
      // 地面光环
      ctx.fillStyle = 'rgba(255,215,90,0.3)';
      ctx.beginPath(); ctx.ellipse(sx + 26, sy + 74, 42, 12, 0, 0, 6.283); ctx.fill();
      const bob = Math.sin(timeAcc * 3.4) * 5;
      const gx = sx + 26, gy = sy + 30 + bob;
      // 手绘礼物盒：白描边底
      ctx.fillStyle = '#ffffff';
      roundRect(gx - 27, gy - 19, 54, 42, 8); ctx.fill();
      ctx.fillStyle = '#e5484d';
      roundRect(gx - 24, gy - 16, 48, 36, 6); ctx.fill();
      // 盒盖（浅一档）
      ctx.fillStyle = '#f2545a';
      roundRect(gx - 26, gy - 19, 52, 12, 6); ctx.fill();
      // 金色丝带（竖 + 横 + 蝴蝶结）
      ctx.fillStyle = '#ffd24a';
      ctx.fillRect(gx - 5, gy - 18, 10, 36);
      ctx.fillRect(gx - 24, gy - 12, 48, 8);
      ctx.strokeStyle = '#f6b31c'; ctx.lineWidth = 1.6;
      ctx.strokeRect(gx - 24, gy - 12, 48, 8);
      // 蝴蝶结
      ctx.fillStyle = '#ffb930';
      ctx.beginPath();
      ctx.moveTo(gx - 6, gy - 18);
      ctx.quadraticCurveTo(gx - 22, gy - 28, gx - 17, gy - 14);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(gx + 6, gy - 18);
      ctx.quadraticCurveTo(gx + 22, gy - 28, gx + 17, gy - 14);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e5484d';
      ctx.beginPath(); ctx.arc(gx, gy - 16, 4.6, 0, 6.283); ctx.fill();
      // 高光
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(gx - 16, gy - 10, 3.4, 0, 6.283); ctx.fill();
      // 浮动圆点
      for (let i = 0; i < 3; i++) {
        const a = timeAcc * 2 + i * 2.09;
        ctx.fillStyle = 'rgba(255,235,150,0.85)';
        ctx.beginPath(); ctx.arc(gx + Math.cos(a) * 34, gy - 10 + Math.sin(a) * 12, 2.6, 0, 6.283); ctx.fill();
      }
      ctx.restore();
    }

    function drawHazards() {
      const cy = cameraOffsetY();
      for (const h of hazards) {
        const sx = h.x - cameraX, sy = h.y - cy;
        if (sx + (h.w || 60) < -80 || sx > view.w + 80) continue;
        ctx.save();
        switch (h.type) {
          case 'gear': case 'saw': {
            const r = h.r;
            ctx.translate(sx + r, sy + r);
            ctx.rotate(h.t * h.spin);
            if (h.type === 'gear') {
              ctx.fillStyle = '#8899a6';
              for (let i = 0; i < 8; i++) { ctx.rotate(0.7854); ctx.fillRect(-5, -r - 7, 10, r * 2 + 14); }
              ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill();
              ctx.fillStyle = '#5a6b78'; ctx.beginPath(); ctx.arc(0, 0, r * 0.34, 0, 6.283); ctx.fill();
            } else {
              ctx.fillStyle = '#ff5252';
              for (let i = 0; i < 10; i++) {
                ctx.rotate(0.6283);
                ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * 0.3, -r * 0.55); ctx.lineTo(-r * 0.3, -r * 0.55); ctx.fill();
              }
              ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, 6.283); ctx.fill();
              ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, r * 0.22, 0, 6.283); ctx.fill();
            }
            break;
          }
          case 'spike': {
            ctx.fillStyle = '#c9d2d6';
            ctx.strokeStyle = '#7c8a90'; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(sx, sy + h.h); ctx.lineTo(sx + h.w / 2, sy); ctx.lineTo(sx + h.w, sy + h.h);
            ctx.closePath(); ctx.fill(); ctx.stroke();
            break;
          }
          case 'spikeFloor': {
            ctx.fillStyle = '#8e9aa1'; ctx.fillRect(sx, sy + h.h - 8, h.w, 8);
            ctx.fillStyle = '#dbe3e6'; ctx.strokeStyle = '#8e9aa1'; ctx.lineWidth = 1.5;
            const n = Math.floor(h.w / 22);
            for (let i = 0; i < n; i++) {
              const bx = sx + i * 22;
              ctx.beginPath();
              ctx.moveTo(bx, sy + h.h); ctx.lineTo(bx + 11, sy); ctx.lineTo(bx + 22, sy + h.h);
              ctx.closePath(); ctx.fill(); ctx.stroke();
            }
            break;
          }
          case 'fire': {
            if (h.on) {
              const fl = 1 + Math.sin(h.t * 22) * 0.12;
              ctx.fillStyle = '#e74c3c';
              ctx.beginPath();
              ctx.moveTo(sx, sy + h.h);
              ctx.quadraticCurveTo(sx + h.w * 0.5, sy - 6 * fl, sx + h.w, sy + h.h);
              ctx.fill();
              ctx.fillStyle = '#ffd24a';
              ctx.beginPath();
              ctx.moveTo(sx + h.w * 0.22, sy + h.h);
              ctx.quadraticCurveTo(sx + h.w * 0.5, sy + h.h * 0.42, sx + h.w * 0.78, sy + h.h);
              ctx.fill();
            } else {
              ctx.fillStyle = '#6d4b3a';
              ctx.fillRect(sx + 4, sy + h.h - 12, h.w - 8, 12);
              ctx.fillStyle = 'rgba(255,160,60,0.5)';
              ctx.beginPath(); ctx.arc(sx + h.w / 2, sy + h.h - 10, 5, 0, 6.283); ctx.fill();
            }
            break;
          }
          case 'patrol': {
            // 手绘紫色小怪兽（圆身 + 双角 + 大眼 + 小脚）
            const px = sx + h.w / 2, py = sy + h.h / 2;
            const bobY = Math.sin(h.t * 6) * 2;
            // 脚
            ctx.fillStyle = '#6a2f86';
            ctx.beginPath(); ctx.ellipse(px - 7, py + 16 + bobY, 6, 3.4, 0, 0, 6.283); ctx.fill();
            ctx.beginPath(); ctx.ellipse(px + 7, py + 16 + bobY, 6, 3.4, 0, 0, 6.283); ctx.fill();
            // 身体白描边
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(px, py + 2 + bobY, h.w / 2 + 2.6, 0, 6.283); ctx.fill();
            // 角
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.moveTo(px - 11, py - 10); ctx.lineTo(px - 8, py - 25); ctx.lineTo(px - 3, py - 10); ctx.closePath(); ctx.fill();
            ctx.beginPath(); ctx.moveTo(px + 11, py - 10); ctx.lineTo(px + 8, py - 25); ctx.lineTo(px + 3, py - 10); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#9b59b6';
            ctx.beginPath(); ctx.arc(px, py + 2 + bobY, h.w / 2, 0, 6.283); ctx.fill();
            ctx.fillStyle = '#8e44ad';
            ctx.beginPath(); ctx.moveTo(px - 10, py - 9); ctx.lineTo(px - 7.5, py - 20); ctx.lineTo(px - 4, py - 9); ctx.closePath(); ctx.fill();
            ctx.beginPath(); ctx.moveTo(px + 10, py - 9); ctx.lineTo(px + 7.5, py - 20); ctx.lineTo(px + 4, py - 9); ctx.closePath(); ctx.fill();
            // 大眼睛
            ART.eye(ctx, px - 7, py + 1 + bobY, 4.6, h.t * 3); ART.eye(ctx, px + 7, py + 1 + bobY, 4.6, h.t * 3);
            // 嘴
            ctx.strokeStyle = '#5b2a75'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.arc(px, py + 7 + bobY, 3, 0.25, 2.9); ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(px - 16, py - 8 + bobY, 2.2, 0, 6.283); ctx.fill();
            ctx.beginPath(); ctx.arc(px + 16, py - 8 + bobY, 2.2, 0, 6.283); ctx.fill();
            break;
          }
          case 'triGear': {
            // 意见④：旋转的三角形齿轮（白描边 + 三角齿 + 中心铆钉）
            ctx.translate(sx + h.r, sy + h.r);
            ctx.rotate(h.t * h.spin);
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 3; i++) {
              ctx.rotate(2.0944);
              ctx.beginPath();
              ctx.moveTo(0, -h.r - 9);
              ctx.lineTo(9, -h.r + 2);
              ctx.lineTo(-9, -h.r + 2);
              ctx.closePath(); ctx.fill();
            }
            ctx.fillStyle = '#5e60ce';
            ctx.beginPath(); ctx.arc(0, 0, h.r, 0, 6.283); ctx.fill();
            ctx.fillStyle = '#7f83f7';
            ctx.beginPath();
            ctx.moveTo(0, -h.r * 0.78); ctx.lineTo(h.r * 0.68, h.r * 0.4); ctx.lineTo(-h.r * 0.68, h.r * 0.4);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#fff8e1';
            ctx.beginPath(); ctx.arc(0, 0, h.r * 0.24, 0, 6.283); ctx.fill();
            break;
          }
          case 'blocker': {
            // 意见④：挡路大个子小怪兽（绿色胖墩 + 白描边 + 呆萌大眼 + 小短腿）
            const bx = sx + h.w / 2, by = sy + h.h;
            const breathe = 1 + Math.sin(h.t * 4) * 0.03;
            // 影子
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath(); ctx.ellipse(bx, by + 3, h.w * 0.52, 6, 0, 0, 6.283); ctx.fill();
            // 小短腿
            ctx.fillStyle = '#3f9142';
            ctx.beginPath(); ctx.ellipse(bx - 14, by - 4, 8, 5, 0, 0, 6.283); ctx.fill();
            ctx.beginPath(); ctx.ellipse(bx + 14, by - 4, 8, 5, 0, 0, 6.283); ctx.fill();
            // 白描边大身体
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(bx, by - h.h * 0.52, h.w / 2 + 3, 0, 6.283); ctx.fill();
            ctx.fillStyle = '#57b85a';
            ctx.beginPath();
            ctx.ellipse(bx, by - h.h * 0.52, h.w / 2, (h.h / 2) * breathe, 0, 0, 6.283);
            ctx.fill();
            // 肚皮
            ctx.fillStyle = '#cdeecb';
            ctx.beginPath(); ctx.ellipse(bx, by - h.h * 0.36, h.w * 0.30, h.h * 0.22, 0, 0, 6.283); ctx.fill();
            // 眯眯眼 → 呆萌大眼（blink 复用 ART.eye）
            ART.eye(ctx, bx - 10, by - h.h * 0.62, 6, h.t);
            ART.eye(ctx, bx + 10, by - h.h * 0.62, 6, h.t);
            // 撅嘴
            ctx.strokeStyle = '#2f6b32'; ctx.lineWidth = 2; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.arc(bx, by - h.h * 0.44, 4, 0.35, 2.79); ctx.stroke();
            // 头顶呆毛
            ctx.strokeStyle = '#2f6b32'; ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(bx, by - h.h * 0.98);
            ctx.quadraticCurveTo(bx + 4, by - h.h * 1.12, bx + 10, by - h.h * 1.06);
            ctx.stroke();
            break;
          }
          case 'gate': {
            if (h.open) {
              ctx.strokeStyle = 'rgba(46,204,113,0.85)'; ctx.lineWidth = 4;
              ctx.strokeRect(sx, sy, h.w, h.h * 0.22);
              ctx.fillStyle = 'rgba(46,204,113,0.25)';
              ctx.fillRect(sx, sy, h.w, h.h * 0.22);
            } else {
              ctx.fillStyle = '#c0392b'; ctx.fillRect(sx, sy, h.w, h.h);
              ctx.fillStyle = 'rgba(255,255,255,0.22)';
              for (let i = 0; i < 5; i++) ctx.fillRect(sx + 2, sy + 6 + i * 20, h.w - 4, 8);
              ctx.fillStyle = '#ffd24a';
              ctx.fillRect(sx - 2, sy + h.h - 6, h.w + 4, 6);
            }
            break;
          }
          case 'slider': {
            const px = sx + h.w / 2, py = sy + h.h / 2;
            // 手绘橙色齿轮
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(px, py, h.w / 2 + 3, 0, 6.283); ctx.fill();
            ctx.fillStyle = '#f39c12';
            for (let i = 0; i < 8; i++) {
              ctx.save();
              ctx.translate(px, py);
              ctx.rotate(i * 0.7854 + h.t * 1.6);
              ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-5, -h.w / 2 - 6, 10, h.w + 12, 3) : ctx.rect(-5, -h.w / 2 - 6, 10, h.w + 12); ctx.fill();
              ctx.restore();
            }
            ctx.beginPath(); ctx.arc(px, py, h.w / 2, 0, 6.283); ctx.fill();
            ctx.fillStyle = '#e67e22';
            ctx.beginPath(); ctx.arc(px, py, h.w / 2 * 0.58, 0, 6.283); ctx.fill();
            ctx.fillStyle = '#fff8e1';
            ctx.beginPath(); ctx.arc(px, py, h.w / 2 * 0.24, 0, 6.283); ctx.fill();
            // 上下轨道
            ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
            const bx = px;
            ctx.beginPath(); ctx.moveTo(bx, h.baseY - cameraOffsetY() - h.range - 4); ctx.lineTo(bx, h.baseY - cameraOffsetY() + h.range + 4); ctx.stroke();
            // 顶部小箭头
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.beginPath();
            ctx.moveTo(bx - 5, h.baseY - cameraOffsetY() - h.range - 12);
            ctx.lineTo(bx + 5, h.baseY - cameraOffsetY() - h.range - 12);
            ctx.lineTo(bx, h.baseY - cameraOffsetY() - h.range - 4);
            ctx.closePath(); ctx.fill();
            break;
          }
        }
        ctx.restore();
      }
    }

    function drawPlayer() {
      if (!player) return;
      const p = player;
      const cy = cameraOffsetY();
      const sx = p.x - cameraX, sy = p.y - cy;
      if (sx < -160 || sx > view.w + 160) return;
      ctx.save();
      if (p.invuln > 0 && Math.floor(p.invuln / 4) % 2 === 0) ctx.globalAlpha = 0.42;
      const cx = sx + p.w / 2;
      const flip = p.dir < 0 ? -1 : 1;
      const run = p.onGround && Math.abs(p.vx) > 1.1;
      const bounce = p.onGround ? Math.abs(Math.sin(p.animT * 9)) * 3.2 : 0;
      const groundY = sy + p.h + 2;

      // 影子（2.5D：双层柔和投影，空中缩小变淡 → 立体落地感）
      const airF = p.onGround ? 1 : 0.72;
      ctx.fillStyle = 'rgba(0,0,0,' + (0.20 * airF).toFixed(3) + ')';
      ctx.beginPath(); ctx.ellipse(cx, groundY + 4, 27 * airF, 6 * airF, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,' + (0.10 * airF).toFixed(3) + ')';
      ctx.beginPath(); ctx.ellipse(cx, groundY + 3, 20 * airF, 4 * airF, 0, 0, 6.283); ctx.fill();

      // 跑动尾尘
      if (run && Math.random() < 0.45) {
        spawnDust(cx - flip * 15, groundY - 2, 1, 'rgba(255,255,255,0.85)');
      }

      // 载具（先画 → 在角色下层）
      ART.drawVehicle(vehicle.id, ctx, cx, groundY, flip, vehicle.accent, p.animT);

      // 宠物（骑在载具上，头中心 ≈ 车座上方；放大到 1.40 后锚点 -58 → -63）
      const tAnim = p.animT + (run ? p.x * 0.018 : 0);
      // squash & stretch：落地压扁 → 上升拉伸 → 站立回正
      let sqx = 1, sqy = 1;
      const lt = p.landT || 0;
      if (lt > 0) {
        const f = lt / 11;                       // 落地瞬间最强，11 帧内回弹
        sqy = 1 - 0.22 * f; sqx = 1 + 0.18 * f;
      } else if (!p.onGround) {
        const f = clamp(-p.vy / 12, -0.35, 1);   // 上升越快，纵向拉得越长
        sqy = 1 + 0.16 * f; sqx = 1 - 0.12 * f;
      }
      ctx.__sq = [sqx, sqy];
      ctx.__mood = (shieldLeft > 0) ? 'shield' : ((p.invuln > 40) ? 'hurt' : (run ? 'happy' : ''));
      drawPetWithEq(pet.id, ctx, cx, groundY - 63 + bounce * 0.85, 1, flip, tAnim, run);
      ctx.__sq = null; ctx.__mood = '';

      ctx.restore();
    }

    function drawParticles() {
      const cy = cameraOffsetY();
      for (const q of particles) {
        ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
        ctx.fillStyle = q.color;
        ctx.fillRect(q.x - cameraX - q.size / 2, q.y - cy - q.size / 2, q.size, q.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawFloaters() {
      const cy = cameraOffsetY();
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
      for (const f of floaters) {
        ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillText(f.text, f.x - cameraX + 1, f.y - cy + 2);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, f.x - cameraX, f.y - cy);
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    /* =========================================================================
     * 10. HUD / 触屏按键 / 覆盖层（全部 Canvas 绘制，便于迁移小游戏）
     * ====================================================================== */
    function roundRect(x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function panel(x, y, w, h, r) {
      const rr = r || 14;
      ctx.fillStyle = 'rgba(20,16,36,0.58)';
      roundRect(x, y, w, h, rr); ctx.fill();
      // 顶部高光
      const hi = ctx.createLinearGradient(x, y, x, y + h * 0.5);
      hi.addColorStop(0, 'rgba(255,255,255,0.14)'); hi.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hi;
      roundRect(x, y, w, h, rr); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.24)'; ctx.lineWidth = 1.5;
      roundRect(x, y, w, h, rr); ctx.stroke();
    }

    function heartRow(x, y, lives, size) {
      const s = size || 20;
      for (let i = 0; i < 3; i++) {
        ctx.save();
        ctx.globalAlpha = i < lives ? 1 : 0.22;
        drawHeartIcon(x + i * (s + 8), y, s);
        ctx.restore();
      }
    }
    function drawHeartIcon(x, y, s) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(s / 22, s / 22);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(0, 6);
      ctx.bezierCurveTo(-2, 1, -11, -4, -8, -10);
      ctx.bezierCurveTo(-5, -14, 0, -9, 0, -6);
      ctx.bezierCurveTo(0, -9, 5, -14, 8, -10);
      ctx.bezierCurveTo(11, -4, 2, 1, 0, 6);
      ctx.fill();
      ctx.fillStyle = '#ff5d73';
      ctx.beginPath();
      ctx.moveTo(0, 6);
      ctx.bezierCurveTo(-2, 1, -10, -4, -7.4, -9.4);
      ctx.bezierCurveTo(-4.6, -13, 0, -8.6, 0, -6);
      ctx.bezierCurveTo(0, -8.6, 4.6, -13, 7.4, -9.4);
      ctx.bezierCurveTo(10, -4, 2, 1, 0, 6);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(-3.4, -6.6, 1.7, 0, 6.283); ctx.fill();
      ctx.restore();
    }

    // 小喇叭图标（意见③ 静音开关）：x,y 中心，s 大小
    function drawSpeakerIcon(x, y, s, mutedOn) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(s / 22, s / 22);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(-8, -3); ctx.lineTo(-3, -3); ctx.lineTo(3, -8);
      ctx.lineTo(3, 8); ctx.lineTo(-3, 3); ctx.lineTo(-8, 3);
      ctx.closePath(); ctx.fill();
      if (!mutedOn) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(4, 0, 6, -0.9, 0.9); ctx.stroke();
        ctx.beginPath(); ctx.arc(4, 0, 9.5, -0.8, 0.8); ctx.stroke();
      } else {
        ctx.strokeStyle = '#ff8a95'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(5, -5); ctx.lineTo(12, 5);
        ctx.moveTo(12, -5); ctx.lineTo(5, 5);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawHUD() {
      // cover/room 是全屏场景；cleared 是结算面板——关卡号、礼物数、评级在结算里
      // 已经全部呈现，再叠一层 HUD 只会挤占顶部空间（成就/任务提示条正好也抢这块地）。
      // 菜单态（工坊/背包/签到等）同理：它们是模态面板，HUD 会跟面板标题抢位置。
      if (isMenuState(state) || state === 'room' || state === 'cleared') return;
      const w = view.w;
      // 左上：关卡 + 三颗心 + 喇叭（三心机制：撞到障碍/掉坑各扣 1 心）
      panel(12, 12, 214, 46, 23);
      ctx.font = 'bold 17px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(endlessMode ? ('无尽 ' + endlessDist + 'm') : ('第 ' + level + ' 关'), 26, 35);
      heartRow(92, 35, player ? player.lives : 3, 19);
      const mutedOn = sfx.isMuted && sfx.isMuted();
      ctx.globalAlpha = mutedOn ? 0.55 : 1;
      drawSpeakerIcon(198, 35, 20, mutedOn);
      ctx.globalAlpha = 1;

      // 生效中的道具条：左上角第二行。玩家必须能一眼看到"我的道具还剩多久"，
      // 否则限时道具的时间感是隐形的，价值感知会大打折扣。
      const buffs = [];
      if (shieldLeft > 0) buffs.push({ icon: '🛡️', t: shieldLeft, max: 1, c: '#6fe3ff' });
      if (magnetLeft > 0) buffs.push({ icon: '🧲', t: magnetLeft, max: 1500, c: '#ff9ff3' });
      if (boostLeft > 0) buffs.push({ icon: '👟', t: boostLeft, max: 1200, c: '#ffd24a' });
      const veh = ITEM_BY_ID[equippedItem];
      if (veh && veh.kind === 'vehicle') buffs.push({ icon: veh.icon, t: -1, max: 1, c: veh.accent });
      if (buffs.length) {
        let bx2 = 16;
        for (const b of buffs) {
          ctx.fillStyle = 'rgba(10,8,18,0.52)';
          roundRect(bx2, 64, 54, 42, 12); ctx.fill();
          ctx.font = '19px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = '#fff';
          ctx.fillText(b.icon, bx2 + 27, 79);
          if (b.t > 0) {
            const f = clamp(b.t / b.max, 0, 1);
            ctx.fillStyle = 'rgba(255,255,255,0.22)';
            roundRect(bx2 + 8, 94, 38, 5, 2.5); ctx.fill();
            ctx.fillStyle = b.c;
            roundRect(bx2 + 8, 94, Math.max(3, 38 * f), 5, 2.5); ctx.fill();
          } else {
            ctx.font = 'bold 9px "PingFang SC","Microsoft YaHei",sans-serif';
            ctx.fillStyle = b.c;
            ctx.fillText('载具', bx2 + 27, 97);
          }
          bx2 += 60;
        }
      }

      // 右上：礼物（手绘礼物图标 + 数字）—— 给暂停键留出右侧空间
      panel(w - 198, 12, 128, 46, 23);
      drawGiftIconSmall(ctx, w - 176, 35, 20);
      ctx.font = 'bold 19px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = '#ffd24a'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(runGifts, w - 154, 36);

      /* 本关金币：实时往上跳的数字（吃星立刻 +）。
       * 放在礼物面板正下方而不是别处 —— 两者都是"这一局我赚到了什么"，
       * 放在一起玩家扫一眼就够，不用满屏找。 */
      panel(w - 128, 66, 78, 32, 16);
      ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = '#ffd24a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🪙' + runCoins, w - 128 + 39, 66 + 17);
      ctx.textAlign = 'left';

      /* 难度徽章：紧贴金币面板左侧（进度条右端 w-264 之外，不会打架）。
       * 常驻显示的意义：难度是玩家自己选的，必须随时知道自己在哪一档，
       * 否则"我选了挑战怎么没感觉"——选择不反馈，选择就白选了。 */
      const dmb = curMode();
      const badgeX = w - 214, badgeW = 78;
      panel(badgeX, 66, badgeW, 32, 16);
      ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = dmb.id === 'pro' ? '#ff9f43' : 'rgba(255,255,255,0.82)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(dmb.icon + dmb.name, badgeX + badgeW / 2, 66 + 17);
      ctx.textAlign = 'left';

      // 顶部进度条（胶囊 + 光泽）
      const bx = 232, bw = Math.max(120, w - 496), by = 35;
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      roundRect(bx - 2, by - 9, bw + 4, 18, 9); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      roundRect(bx, by - 7, bw, 14, 7); ctx.fill();
      /* 无尽模式没有终点，进度条改成"离下一个 100 米里程碑还有多远" ——
       * 否则一条永远卡在 0% 的进度条只会让玩家以为游戏坏了。 */
      const prog = endlessMode
        ? ((endlessDist % 100) / 100)
        : (player ? clamp(player.x / levelWidth, 0, 1) : 0);
      if (prog > 0.01) {
        const grd = ctx.createLinearGradient(bx, by - 7, bx, by + 7);
        grd.addColorStop(0, '#ffd24a'); grd.addColorStop(0.5, '#ffb52e'); grd.addColorStop(1, '#ff8a3c');
        ctx.fillStyle = grd;
        roundRect(bx, by - 7, Math.max(10, bw * prog), 14, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        roundRect(bx + 4, by - 5, Math.max(2, bw * prog - 8), 4, 2); ctx.fill();
      }
      if (endlessMode) {
        // 无尽模式条尾换成"下一里程碑"数字，明确告诉玩家这条进度条在量什么
        ctx.fillStyle = '#ffd24a';
        ctx.font = 'bold 10px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText((endlessRock + 100) + 'm', bx + bw, by - 17);
        ctx.textAlign = 'left';
      } else {
        // 终点旗帜标记
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx + bw - 3, by - 13, 6, 26, 3) : ctx.rect(bx + bw - 3, by - 13, 6, 26); ctx.fill();
        ctx.fillStyle = '#ffd24a';
        ctx.beginPath(); ctx.moveTo(bx + bw - 3, by - 13); ctx.lineTo(bx + bw - 18, by - 9); ctx.lineTo(bx + bw - 3, by - 5); ctx.closePath(); ctx.fill();
      }
    }

    /* ---------- 触屏按键布局 ---------- */
    const touchButtons = [];
    function layoutButtons() {
      touchButtons.length = 0;
      if (state === 'playing') {
        const R = view.portrait ? 54 : 40;
        const by = view.h - (view.portrait ? 150 : 74) - view.safeBottom;
        touchButtons.push({ id: 'left', kind: 'round', x: 34 + R, y: by, r: R });
        touchButtons.push({ id: 'right', kind: 'round', x: 34 + R * 3 + 26, y: by, r: R });
        touchButtons.push({ id: 'jump', kind: 'round', x: view.w - 34 - R * 1.15, y: by, r: R * 1.15, accent: true });
        // 意见③：常驻小喇叭（画在左上 HUD 面板里，热区 36px 方便小手指点按）
        touchButtons.push({ id: 'sound', kind: 'round', x: 198, y: 35, r: 17, hidden: true });
      }
      // 暂停：常驻右上角（避开礼物面板）
      touchButtons.push({ id: 'pause', kind: 'round', x: view.w - 34, y: 36, r: 22 });
    }

    const pointerMap = new Map();

    function drawTouchControls() {
      // 菜单态不画虚拟按键：那时玩家在点面板按钮，方向键留在屏幕上既没用又碍事
      if (isMenuState(state) || state === 'room') return;
      layoutButtons();
      for (const b of touchButtons) {
        if (b.hidden) continue;
        const active = (b.id === 'jump' && touchState.jump) ||
                       (b.id === 'left' && touchState.left) ||
                       (b.id === 'right' && touchState.right);
        ctx.save();
        // 底
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 2, 0, 6.283);
        ctx.fillStyle = b.accent
          ? (active ? 'rgba(255,150,50,0.85)' : 'rgba(255,170,70,0.5)')
          : (active ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.24)');
        ctx.fill();
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283);
        ctx.fillStyle = b.accent
          ? (active ? 'rgba(255,196,80,0.5)' : 'rgba(255,205,110,0.28)')
          : (active ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.16)');
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = b.accent ? 'rgba(255,235,160,0.95)' : 'rgba(255,255,255,0.55)';
        ctx.stroke();
        // 图标
        ctx.strokeStyle = '#fff'; ctx.lineCap = 'round';
        if (b.id === 'pause') {
          ctx.lineWidth = Math.max(3, b.r * 0.18);
          const off = b.r * 0.26;
          ctx.beginPath();
          ctx.moveTo(b.x - off, b.y - b.r * 0.3); ctx.lineTo(b.x - off, b.y + b.r * 0.3);
          ctx.moveTo(b.x + off, b.y - b.r * 0.3); ctx.lineTo(b.x + off, b.y + b.r * 0.3);
          ctx.stroke();
        } else if (b.id === 'left') {
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.moveTo(b.x - b.r * 0.28, b.y);
          ctx.lineTo(b.x + b.r * 0.34, b.y - b.r * 0.42);
          ctx.lineTo(b.x + b.r * 0.34, b.y + b.r * 0.42);
          ctx.closePath(); ctx.fill();
        } else if (b.id === 'right') {
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.moveTo(b.x + b.r * 0.28, b.y);
          ctx.lineTo(b.x - b.r * 0.34, b.y - b.r * 0.42);
          ctx.lineTo(b.x - b.r * 0.34, b.y + b.r * 0.42);
          ctx.closePath(); ctx.fill();
        } else if (b.id === 'jump') {
          // 跳跃箭头
          ctx.lineWidth = Math.max(3, b.r * 0.16);
          ctx.beginPath();
          ctx.moveTo(b.x - b.r * 0.32, b.y + b.r * 0.22);
          ctx.quadraticCurveTo(b.x - b.r * 0.36, b.y - b.r * 0.28, b.x, b.y - b.r * 0.42);
          ctx.quadraticCurveTo(b.x + b.r * 0.36, b.y - b.r * 0.28, b.x + b.r * 0.32, b.y + b.r * 0.22);
          ctx.stroke();
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.moveTo(b.x - b.r * 0.5, b.y - b.r * 0.2);
          ctx.lineTo(b.x - b.r * 0.08, b.y - b.r * 0.62);
          ctx.lineTo(b.x + b.r * 0.2, b.y - b.r * 0.22);
          ctx.lineTo(b.x - b.r * 0.06, b.y - b.r * 0.5);
          ctx.closePath(); ctx.fill();
          ctx.font = 'bold ' + (b.r * 0.2).toFixed(0) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
          ctx.fillText('跳', b.x, b.y + b.r * 0.5);
        }
        ctx.restore();
      }
    }

    /* ---------- 覆盖层（封面 / 暂停 / 失败 / 过关） ---------- */
    const overlayButtons = [];
    function overlayLayout() {
      overlayButtons.length = 0;
      const w = view.w, h = view.h;
      if (state === 'cover') {
        buildCoverButtons(w, h);
      } else if (state === 'paused') {
        btn(w / 2 - 110, h * 0.55, 220, 54, '继续游戏', 'resume');
        btn(w / 2 - 110, h * 0.55 + 68, 220, 48, (sfx.isMuted && sfx.isMuted()) ? '🔇 声音：关' : '🔊 声音：开', 'music', true);
        btn(w / 2 - 110, h * 0.55 + 128, 220, 48, endlessMode ? '重新开始冲刺' : '重新开始本关', 'restart', true);
        btn(w / 2 - 110, h * 0.55 + 188, 220, 48, '返回首页', 'home', true);
      } else if (state === 'dead') {
        // 三心时代：看广告满血复活（最多 2 次）+ 再来一次本关 + 回首页
        const canRevive = revivesUsed < 2;
        if (canRevive) btn(w / 2 - 130, h * 0.56, 260, 54, '🎬 看广告复活', 'revive');
        btn(w / 2 - 130, h * 0.56 + (canRevive ? 68 : 0), 260, 50, '再来一次', 'retry', canRevive);
        btn(w / 2 - 130, h * 0.56 + (canRevive ? 128 : 66), 260, 46, '返回首页', 'home', true);
      } else if (state === 'cleared') {
        btn(w / 2 - 130, h * 0.56, 260, 54, '🎬 奖励翻倍', 'double');
        if (save.house >= 3) btn(w / 2 - 130, h * 0.56 + 68, 260, 50, '🏠 回小屋休息', 'room');
        btn(w / 2 - 130, h * 0.56 + (save.house >= 3 ? 128 : 68), 260, 50, '下一关', 'next');
        btn(w / 2 - 130, h * 0.56 + (save.house >= 3 ? 188 : 128), 260, 46, '返回首页', 'home', true);
      } else if (state === 'room') {
        // 意见②：小屋。家具热区不可见（点什么宠物就干什么）+ 底部换装 + 出发。
        btn(w * 0.06, h * 0.26, w * 0.36, h * 0.36, '', 'tv', false, true);
        btn(w * 0.44, h * 0.52, w * 0.22, h * 0.26, '', 'eat', false, true);
        btn(w * 0.70, h * 0.36, w * 0.26, h * 0.30, '', 'sleep', false, true);
        btn(14, h - 76, 130, 48, '🎩 ' + (accName(save.eq.hat) || '不戴'), 'wearHat', true);
        btn(152, h - 76, 130, 48, '🕶 ' + (accName(save.eq.glasses) || '不戴'), 'wearGlass', true);
        btn(290, h - 76, 130, 48, '🧣 ' + (accName(save.eq.neck) || '不戴'), 'wearNeck', true);
        btn(w - 226, h - 76, 212, 52, '继续闯关', 'keepgoing');
        btn(w - 128, 16, 114, 44, '回首页', 'home', true);
      } else if (state === 'scores' || state === 'achievements') {
        // 留存系统子界面：一个返回按钮
        btn(w / 2 - 100, h - 76, 200, 50, '返回', 'back');
      } else if (state === 'bag') {
        // 背包：3×3 卡片热区（卡片由 drawBag 绘制，这里只注册隐形命中区）
        // 几何直接复用 bagGrid，与绘制端共用同一份公式，杜绝"画的和点的不一致"
        const bg = bagGrid(w, h);
        for (let i = 0; i < ITEMS.length; i++) {
          const r = Math.floor(i / bg.cols), c = i % bg.cols;
          btn(bg.gx + c * (bg.bw + bg.gap), bg.gy + r * (bg.bw + bg.gap), bg.bw, bg.bw,
              '', 'item:' + ITEMS[i].id, false, true);
        }
        btn(w / 2 - 100, h - 70, 200, 48, '返回', 'back');
      } else if (state === 'daily') {
        // 每日挑战：开始挑战 + 返回
        btn(w / 2 - 130, h * 0.52, 260, 54, '开始挑战', 'dailyStart');
        btn(w / 2 - 100, h - 76, 200, 50, '返回', 'back');
      } else if (state === 'sign' || state === 'chest' || state === 'quest' || state === 'freeItem') {
        // 留存系统子界面：返回按钮
        btn(w / 2 - 100, h - 76, 200, 50, '返回', 'back');
      } else if (state === 'garage') {
        /* 改装工坊：每行右侧「买 / 合成」两个操作键，底部「一键合成」+「返回」。
         * 热区几何全部取自 garageLayout()，与 drawGarage 共用同一份公式 ——
         * 分头各算一遍就是"画的和点的对不上"这类 bug 的经典来源。 */
        const gl = garageLayout(w, h);
        gl.rows.forEach(function (r, i) {
          btn(r.buyX, r.btnY, r.btnW, r.btnH, '', 'buy:' + PART_SLOTS[i].id, false, true);
          btn(r.mergeX, r.btnY, r.btnW, r.btnH, '', 'merge:' + PART_SLOTS[i].id, false, true);
        });
        const mc = mergeableCount();
        /* 底部动作区：有可合成时并排两个键，否则只留返回（居中）——
         * 按钮宽度按可用宽度自适应，短屏也不会挤出屏幕。 */
        const bw = Math.min(150, (w - 60) / 2);
        const by = h - 68, bh = 46;
        if (mc > 0) {
          btn(w / 2 - bw - 6, by, bw, bh, '⚡ 一键合成 ' + mc, 'mergeAll');
          btn(w / 2 + 6, by, bw, bh, '返回', 'back', true);
        } else {
          btn(w / 2 - bw / 2, by, bw, bh, '返回', 'back', true);
        }
      }
    }
    function btn(x, y, w, h, label, id, secondary, hidden) {
      overlayButtons.push({ x: x, y: y, w: w, h: h, label: label, id: id, secondary: !!secondary, hidden: !!hidden });
    }

    /* 封面按钮：宠物九宫格热区。命中检测发生在两次渲染之间，必须在这里
     * 独立于渲染重新注册（与 drawCover 用同一套网格几何，见 coverGrid）。
     * 此函数此前在重构中丢失，导致封面点击完全失效 + 每帧报错。 */
    function coverGrid() {
      const w = view.w, h = view.h;
      const topY = view.portrait ? h * 0.16 : h * 0.15;
      // 横屏网格缩到 78：横屏画布仅 506 高，92×3 行 + 底部信息行会顶出屏幕
      const gs = view.portrait ? Math.min(96, (w - 60) / 3) : 78;
      const gx = w / 2 - (3 * gs + 2 * 12) / 2;
      /* +88 / +74 而不是原来的 +70：网格底板从 gy-12 起画，用 70 时底板顶边
       * 正好压住 topY+58 的副标题。多留出的这段就是给副标题的呼吸位。 */
      const gy = topY + (view.portrait ? 88 : 74);
      return { gs: gs, gx: gx, gy: gy };
    }
    /* 封面「工坊 + 离线收益」两张卡片的几何。
     * drawCover 与 buildCoverButtons 必须共用这一份公式 —— 分头各算一遍就会出现
     * "画的位置和点的位置差几像素"的经典 bug（背包 3×3 已经踩过一次）。
     *
     * 布局分两种模式，因为横竖屏画布尺寸差得极远（横屏 900×506、竖屏 660×1428）：
     *  - 竖屏：宠物网格下方有大片空白（千余像素），卡片直接竖排铺在网格下面。
     *  - 横屏：宠物网格 3 行就把 506 的高度吃完了，网格下方根本没有空间放卡片
     *    （曾经因此把工坊卡画到屏幕外，等于新功能在桌面上完全不可见）。
     *    横屏改为放到网格**左侧**的空白区，右侧留给入口按钮列。
     */
    function coverCards(w, h) {
      const grid = coverGrid();
      const portrait = !!view.portrait;
      let cw, top;
      if (portrait) {
        const infoY = grid.gy + 3 * (grid.gs + 12) + 34;
        cw = w - 152; top = infoY + 16;
      } else {
        cw = Math.max(170, Math.min(280, grid.gx - 34));
        top = grid.gy + 6;
      }
      const availH = Math.max(88, (h - 16) - top);
      const gh = Math.min(portrait ? 176 : 124, Math.max(88, availH - (portrait ? 128 : 60)));
      let ih = availH - gh - 8;
      if (ih < 52) ih = 0; else ih = Math.min(ih, portrait ? 130 : 92);
      return {
        x: 14, w: cw,
        garageY: top, garageH: gh,
        idleY: top + gh + 8, idleH: ih,
      };
    }

    /* 无尽冲刺按钮几何：横竖屏各挑一块确定不会撞车的空地。
     *  竖屏 → 左侧纵列（段位/难度/携带/精通 四枚胶囊之下、宠物网格底板之上）；
     *  横屏 → 宠物网格正下方那条横带（网格左侧被工坊卡占着，只能往下走）。
     * 绘制端与热区端共用这一个函数 —— 分头各算一遍是"画的和点的对不上"的经典来源。 */
    function endlessBtnRect() {
      const w = view.w, h = view.h;
      if (view.portrait) {
        // 胶囊纵列最底那枚（精通）结束于 y=148，这里留 10px 呼吸位
        return { x: 14, y: 158, w: 214, h: 36 };
      }
      const grid = coverGrid();
      let y = grid.gy + 3 * (grid.gs + 12) + 14;
      y = Math.min(y, h - 12 - 46);
      return { x: 14, y: y, w: 244, h: 46 };
    }

    /* 工坊卡片：按卡片高度自适应三档内容密度。
     * 为什么不写死排版：竖屏卡高 176、横屏只有 124、极窄屏可能压到 88，
     * 固定坐标在矮卡上必然重叠 —— 这里用高度决定"画几行"，任何尺寸都不糊。 */
    function drawGarageCard(gc) {
      const gh = gc.garageH;
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      roundRect(gc.x, gc.garageY, gc.w, gh, 16); ctx.fill();
      ctx.strokeStyle = 'rgba(255,210,74,0.62)'; ctx.lineWidth = 2;
      roundRect(gc.x, gc.garageY, gc.w, gh, 16); ctx.stroke();

      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 17px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText('🔧 改装工坊', gc.x + 16, gc.garageY + 26);

      // 右上角「可合成」红点 —— 让"有事可做"这件事自己跳出来
      const mc = mergeableCount();
      if (mc > 0) {
        const bx = gc.x + gc.w - 22;
        ctx.fillStyle = '#ff4d6d';
        ctx.beginPath(); ctx.arc(bx, gc.garageY + 24, 10, 0, 6.283); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(mc), bx, gc.garageY + 25);
        ctx.textAlign = 'left';
      }

      if (gh >= 112) {
        // 5 个部位的迷你等级徽章一行铺开，一眼看出短板在哪
        const stepW = (gc.w - 32) / PART_SLOTS.length;
        for (let i = 0; i < PART_SLOTS.length; i++) {
          const s = PART_SLOTS[i];
          const lv = partBestLv(s.id);
          const bx2 = gc.x + 16 + i * stepW;
          const by2 = gc.garageY + 46;
          ctx.fillStyle = 'rgba(0,0,0,0.28)';
          roundRect(bx2, by2, stepW - 6, 32, 8); ctx.fill();
          if (lv > 0) {
            ctx.strokeStyle = s.tint; ctx.lineWidth = 1.5;
            roundRect(bx2, by2, stepW - 6, 32, 8); ctx.stroke();
          }
          ctx.textAlign = 'center';
          ctx.font = '14px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
          ctx.fillStyle = lv ? '#fff' : 'rgba(255,255,255,0.32)';
          ctx.fillText(s.icon, bx2 + (stepW - 6) / 2, by2 + 12);
          ctx.font = 'bold 10px "PingFang SC","Microsoft YaHei",sans-serif';
          ctx.fillStyle = lv ? s.tint : 'rgba(255,255,255,0.32)';
          ctx.fillText(lv ? PART_LV_NAME[lv] : '—', bx2 + (stepW - 6) / 2, by2 + 24);
          ctx.textAlign = 'left';
        }
        const power = garagePower();
        const maxPower = PART_MAX_LV * PART_SLOTS.length;
        ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = '#7afcff';
        ctx.fillText('车库强度 ' + power + '/' + maxPower, gc.x + 16, gc.garageY + 98);
        // 强度进度条：把"还差多少满级"变成一条看得见的线
        const barW = gc.w - 32;
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        roundRect(gc.x + 16, gc.garageY + 112, barW, 6, 3); ctx.fill();
        ctx.fillStyle = '#7afcff';
        roundRect(gc.x + 16, gc.garageY + 112, Math.max(2, barW * (power / maxPower)), 6, 3); ctx.fill();
      } else {
        ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = '#7afcff';
        ctx.fillText('车库强度 ' + garagePower() + ' · 点我升级 ▸', gc.x + 16, gc.garageY + gh * 0.70);
      }
      if (gh >= 170) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillText('点这里升级零件，跑得更快 ▸', gc.x + gc.w / 2, gc.garageY + gh - 22);
      }
    }

    function drawIdleCard(gc) {
      const p = idlePending();
      const ready = p.coins > 0;
      const top = gc.idleY, hgt = gc.idleH;
      ctx.fillStyle = ready ? 'rgba(122,252,255,0.14)' : 'rgba(255,255,255,0.07)';
      roundRect(gc.x, top, gc.w, hgt, 14); ctx.fill();
      ctx.strokeStyle = ready ? 'rgba(122,252,255,0.75)' : 'rgba(255,255,255,0.16)';
      ctx.lineWidth = ready ? 2 : 1;
      roundRect(gc.x, top, gc.w, hgt, 14); ctx.stroke();

      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = ready ? '#7afcff' : 'rgba(255,255,255,0.55)';
      ctx.fillText('📦 宠物快递站', gc.x + 16, top + 24);

      const line2 = ready
        ? ('收到 +' + p.coins + ' 🪙' + (p.capped ? '（已满仓）' : ''))
        : ('离线也在赚：每小时 ' + Math.round(IDLE_PER_HOUR * partBonus().coin) + ' 🪙');
      ctx.font = '12px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.82)';
      ctx.save();
      ctx.beginPath();
      ctx.rect(gc.x + 16, top + 34, gc.w - 100, 24); ctx.clip();
      ctx.fillText(line2, gc.x + 16, top + 48);
      ctx.restore();
      ctx.font = '10px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillText('最多累计 8 小时', gc.x + 16, top + hgt - 14);

      if (ready) {
        const btnW = 66, btnH = 30;
        const bx = gc.x + gc.w - btnW - 14, by = top + (hgt - btnH) / 2;
        ctx.fillStyle = '#7afcff';
        roundRect(bx, by, btnW, btnH, btnH / 2); ctx.fill();
        ctx.textAlign = 'center';
        ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = '#12101f';
        ctx.fillText('领取', bx + btnW / 2, by + btnH / 2);
        ctx.textAlign = 'left';
      }
    }

    function buildCoverButtons(w, h) {
      const grid = coverGrid();
      for (let i = 0; i < PETS.length; i++) {
        const r = Math.floor(i / 3), c = i % 3;
        overlayButtons.push({
          x: grid.gx + c * (grid.gs + 12), y: grid.gy + r * (grid.gs + 12),
          w: grid.gs, h: grid.gs, id: 'pet:' + PETS[i].id, hidden: true,
        });
      }
      // 意见②：大房子建成后，封面直达小屋
      if (save.house >= 3) {
        overlayButtons.push({ x: 16, y: h - 72, w: 122, h: 52, label: '🏠 小屋', id: 'room' });
      }
      // 留存系统入口（右下角竖排：排行榜 / 成就 / 每日挑战 / 签到 / 宝箱 / 任务 / 免费道具 / 背包）
      const entrys = [
        { id: 'scores', label: '🏆 排行榜' },
        { id: 'achievements', label: '🎖 成就' },
        { id: 'daily', label: '📅 每日挑战' },
        { id: 'sign', label: '📌 签到' },
        { id: 'chest', label: '📦 宝箱' },
        { id: 'quest', label: '📋 任务' },
        { id: 'freeItem', label: '🎁 免费道具' },
        { id: 'bag', label: '🎒 背包 ' + (bagTotal() ? bagTotal() : '') },
      ];
      /* 竖屏：右侧单列 8 行（纵向空间充足）。
       * 横屏：右侧双列 4 行 —— 横屏只有 506 逻辑高，单列 8×54=432px 会把最上面
       * 的入口顶出屏幕（实测排行榜被切掉大半）。横屏宠物网格只占中间 258px 宽，
       * 两侧都是空白，排两列绰绰有余。 */
      if (view.portrait) {
        const ex = w - 124, ey = h - 72;
        for (let i = 0; i < entrys.length; i++) {
          overlayButtons.push({ x: ex, y: ey - i * 54, w: 112, h: 44, label: entrys[i].label, id: entrys[i].id, secondary: true });
        }
      } else {
        const colW = 112, colGap = 12, rowH = 52;
        const rows = Math.ceil(entrys.length / 2);
        const x0 = w - 124;                       // 靠右那列
        const y0 = h - 52;                        // 从底部往上排
        for (let i = 0; i < entrys.length; i++) {
          const col = i % 2, row = Math.floor(i / 2);
          overlayButtons.push({
            x: x0 - col * (colW + colGap), y: y0 - (rows - 1 - row) * rowH,
            w: colW, h: 44, label: entrys[i].label, id: entrys[i].id, secondary: true,
          });
        }
      }
      // 改装工坊 / 离线收益：热区与 drawCover 共用 coverCards 几何
      // 难度模式切换（热区与 drawCover 左侧徽章共用几何：x=14, y=50, 140×30）
      overlayButtons.push({ x: 14, y: 50, w: 140, h: 30, hidden: true, id: 'mode' });
      /* 无尽冲刺入口：热区与 drawCover 共用 endlessBtnRect()。
       * 这是"老少咸宜"的关键落点 —— 闯关模式有终点、有段落感，适合小孩与碎片时间；
       * 无尽模式只有一个数字（跑了多远），适合愿意一遍遍刷纪录的成年玩家。 */
      const er = endlessBtnRect();
      overlayButtons.push({ x: er.x, y: er.y, w: er.w, h: er.h, hidden: true, id: 'endless' });
      const cc = coverCards(w, h);
      overlayButtons.push({ x: cc.x, y: cc.garageY, w: cc.w, h: cc.garageH, hidden: true, id: 'garage' });
      if (cc.idleH > 0 && idlePending().coins > 0) {
        overlayButtons.push({ x: cc.x, y: cc.idleY, w: cc.w, h: cc.idleH, hidden: true, id: 'idle' });
      }
    }

    function drawOverlay() {
      // room 小屋是全屏独立场景（由 render() 的 room 分支处理），不走遮罩
      if (state === 'playing' || state === 'room') return;
      const w = view.w, h = view.h;
      ctx.save();
      /* 精致暗紫遮罩（比纯黑更通透）。
       * 菜单态加深到近乎不透明：这些面板信息密度高（工坊 5 行、宝箱列表），
       * 半透明的关卡世界透上来会把卡片糊脏；paused/dead/cleared 则保持通透，
       * 因为那时候"看到自己刚才跑到哪"是有意义的。 */
      const menu = isMenuState(state);
      const ov = ctx.createLinearGradient(0, 0, 0, h);
      if (menu) {
        ov.addColorStop(0, 'rgba(16,10,34,0.96)');
        ov.addColorStop(0.5, 'rgba(10,8,18,0.97)');
        ov.addColorStop(1, 'rgba(16,10,34,0.98)');
      } else {
        ov.addColorStop(0, 'rgba(16,10,34,0.78)');
        ov.addColorStop(0.5, 'rgba(10,8,18,0.82)');
        ov.addColorStop(1, 'rgba(16,10,34,0.9)');
      }
      ctx.fillStyle = ov;
      ctx.fillRect(0, 0, w, h);

      if (state === 'cover') drawCover(w, h);
      else if (state === 'paused') drawPause(w, h);
      else if (state === 'dead') drawDead(w, h);
      else if (state === 'cleared') drawCleared(w, h);
      else if (state === 'scores') drawScores(w, h);
      else if (state === 'achievements') drawAchievements(w, h);
      else if (state === 'daily') drawDaily(w, h);
      else if (state === 'bag') drawBag(w, h);
      else if (state === 'sign') drawSign(w, h);
      else if (state === 'chest') drawChests(w, h);
      else if (state === 'quest') drawQuests(w, h);
      else if (state === 'freeItem') drawFreeItem(w, h);
      else if (state === 'garage') drawGarage(w, h);

      drawOverlayButtons();
      ctx.restore();
    }

    function gradientTitle(text, cx, y, size) {
      ctx.save();
      ctx.font = '900 ' + size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      // 白描边（统一的卡通描边风格）
      ctx.strokeStyle = 'rgba(255,255,255,0.92)';
      ctx.lineWidth = Math.max(5, size * 0.22);
      ctx.strokeText(text, cx, y + 1.5);
      const g = ctx.createLinearGradient(cx - 150, 0, cx + 150, 0);
      g.addColorStop(0, '#ffd24a'); g.addColorStop(0.5, '#ff7eb6'); g.addColorStop(1, '#7afcff');
      ctx.fillStyle = g;
      ctx.fillText(text, cx, y);
      // 底部投影
      ctx.strokeStyle = 'rgba(30,20,60,0.28)';
      ctx.lineWidth = Math.max(2, size * 0.1);
      ctx.strokeText(text, cx, y + size * 0.06 + 3);
      ctx.restore();
    }

    function drawCover(w, h) {
      const cx = w / 2;
      const topY = view.portrait ? h * 0.16 : h * 0.15;
      // 标题四周漂浮装饰星
      for (let i = 0; i < 7; i++) {
        const a = timeAcc * 0.4 + i * 2.1;
        ART.star(ctx, cx + Math.cos(a + i) * (150 + Math.sin(timeAcc * 0.8 + i) * 18), topY - 44 + Math.sin(a + i) * 26, 6 + (i % 3) * 2.2, i % 2 ? '#ffe082' : '#c9a4ff', 'rgba(255,255,255,0.8)');
      }
      gradientTitle('疾风冲刺', cx, topY, view.portrait ? 40 : 48);
      ctx.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      // 副标题写"点一下就开始"而不是"选一位伙伴"：玩家必须一眼知道下一步做什么，
      // 尤其是不熟悉游戏的长辈 —— 把动作说出来，比描述游戏内容有用得多。
      ctx.fillText('点一位伙伴，立即开始冲刺 · 共 ' + THEMES.length + ' 大主题', cx, topY + 58);

      /* 左上角信息胶囊：段位 + 下一关携带的道具
       * 为什么放左上而不是标题下方：宠物网格底板从 topY+58 就开始铺，标题以下的纵向
       * 空间全被网格吃掉——段位信息原先画在 topY+78/96/106，被网格盖得一个字都看不见；
       * 「下一关携带」还和副标题撞在同一坐标互相覆盖。挪到左上角空白区后两个问题一起解决，
       * 而且顺手把「我当前什么段位」「下一关带什么」放在选宠这一步就能扫到的位置。 */
      let pillY = 14;
      const rk = rankOf(save.totalScore || 0);
      const nrk = nextRankOf(save.totalScore || 0);
      const scoreNow = save.totalScore | 0;
      const rkTxt = nrk ? ('段位 ' + rk.name + '  ' + scoreNow + '/' + nrk.need)
                        : ('段位 ' + rk.name + ' · 已满级');
      ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
      const rkW = Math.max(ctx.measureText(rkTxt).width + 26, 118);
      ctx.fillStyle = 'rgba(10,8,18,0.55)';
      roundRect(14, pillY, rkW, 30, 15); ctx.fill();
      ctx.strokeStyle = rk.color; ctx.lineWidth = 1.5;
      roundRect(14, pillY, rkW, 30, 15); ctx.stroke();
      ctx.fillStyle = rk.color;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(rkTxt, 27, pillY + 12);
      if (nrk) {
        // 胶囊内嵌进度条：段位只差多少一目了然
        const pw = rkW - 26;
        const prog = clamp((scoreNow - rk.need) / Math.max(1, nrk.need - rk.need), 0, 1);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        roundRect(27, pillY + 22, pw, 3.5, 1.75); ctx.fill();
        ctx.fillStyle = rk.color;
        roundRect(27, pillY + 22, pw * prog, 3.5, 1.75); ctx.fill();
      }
      pillY += 36;

      /* 难度模式切换（休闲 / 挑战）—— 整个"受众分层"的入口。
       * 位置定在左侧纵列（段位胶囊下方）：这一列横竖屏都有余量，
       * 不会被宠物网格、右侧入口列或右上角金币胶囊压住。
       * （初版放在右上角，正好压在金币胶囊上，是个自查出来的碰撞。） */
      const dmbC = curMode();
      const mw = 140, mx = 14, my = pillY;
      ctx.save();
      ctx.fillStyle = dmbC.id === 'pro' ? 'rgba(122,52,8,0.78)' : 'rgba(10,8,18,0.55)';
      roundRect(mx, my, mw, 30, 15); ctx.fill();
      ctx.strokeStyle = dmbC.id === 'pro' ? '#ff9f43' : 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1.5;
      roundRect(mx, my, mw, 30, 15); ctx.stroke();
      ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = dmbC.id === 'pro' ? '#ffc078' : '#ffffff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(dmbC.icon + ' ' + dmbC.name + '模式' + (dmbC.score > 1 ? ' ×' + dmbC.score : ''),
        mx + mw / 2, my + 15);
      ctx.restore();
      pillY += 36;

      const eqIt = ITEM_BY_ID[save.equipped];
      if (eqIt && bagCount(eqIt.id) > 0) {
        const eqTxt = '携带 ' + eqIt.name + ' ×' + bagCount(eqIt.id);
        ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
        const eqW = ctx.measureText(eqTxt).width + 44;
        // pillY 此刻已越过「段位」和「难度」两枚胶囊，这里继续往下排即可
        ctx.fillStyle = 'rgba(10,8,18,0.55)';
        roundRect(14, pillY, eqW, 28, 14); ctx.fill();
        ctx.strokeStyle = 'rgba(255,210,74,0.9)'; ctx.lineWidth = 1.5;
        roundRect(14, pillY, eqW, 28, 14); ctx.stroke();
        ctx.font = '15px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(eqIt.icon, 24, pillY + 14);
        ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = '#ffd24a';
        ctx.fillText(eqTxt, 44, pillY + 14);
        pillY += 34;
      }

      /* 精通度胶囊：累计满星数 —— 让"把每关打透"这件事在封面就看得见。
       * 没有它，星级只是结算页一闪而过的装饰，成不了长期目标。
       * 分母用「已通关卡数 × 3」而不是固定值：关卡是无尽的，固定分母迟早被超出。 */
      const clearedLv = Math.max(1, (save.best | 0) - 1);
      const stTxt = '★ 精通 ' + starsTotal() + '/' + (clearedLv * 3);
      ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
      const stW = ctx.measureText(stTxt).width + 26;
      ctx.fillStyle = 'rgba(10,8,18,0.55)';
      roundRect(14, pillY, stW, 28, 14); ctx.fill();
      ctx.strokeStyle = 'rgba(255,210,74,0.55)'; ctx.lineWidth = 1.5;
      roundRect(14, pillY, stW, 28, 14); ctx.stroke();
      ctx.fillStyle = '#ffd24a';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(stTxt, 27, pillY + 14);

      /* 无尽冲刺入口。为什么放这一列而不是右侧入口列：
       * 它是"玩法"，不是"功能面板" —— 与上面的段位/难度/精通同属"我这次怎么跑"；
       * 混进右侧那一列（签到/宝箱/背包这类系统弹窗）会被当成又一个弹窗按钮。 */
      {
        const er = endlessBtnRect();
        const eb = save.endlessBest | 0;
        ctx.save();
        const egr = ctx.createLinearGradient(er.x, er.y, er.x + er.w, er.y);
        egr.addColorStop(0, 'rgba(255,138,60,0.92)');
        egr.addColorStop(1, 'rgba(255,80,120,0.92)');
        ctx.fillStyle = egr;
        roundRect(er.x, er.y, er.w, er.h, er.h / 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.62)'; ctx.lineWidth = 1.5;
        roundRect(er.x, er.y, er.w, er.h, er.h / 2); ctx.stroke();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = 'bold ' + (view.portrait ? 14 : 16) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText(eb > 0 ? ('♾ 无尽冲刺 · 最远 ' + eb + 'm') : '♾ 无尽冲刺',
          er.x + er.w / 2, er.y + er.h / 2);
        ctx.restore();
      }

      // 宠物网格（几何与 buildCoverButtons 共用 coverGrid）
      const grid = coverGrid();
      const gs = grid.gs, gx = grid.gx, gy = grid.gy;
      const cols = 3, rows = 3;
      // 底板圆角卡片
      const bpad = 16;
      ctx.fillStyle = 'rgba(20,14,40,0.45)';
      roundRect(gx - bpad, gy - 12, 3 * gs + 2 * 12 + bpad * 2, 3 * gs + 2 * 12 + 22, 22); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1.5;
      roundRect(gx - bpad, gy - 12, 3 * gs + 2 * 12 + bpad * 2, 3 * gs + 2 * 12 + 22, 22); ctx.stroke();

      for (let i = 0; i < PETS.length; i++) {
        const p = PETS[i];
        const r = Math.floor(i / cols), c = i % cols;
        const bx = gx + c * (gs + 12), by = gy + r * (gs + 12);
        const unlocked = (save.gifts | 0) >= p.need;
        const sel = pet.id === p.id;
        ctx.save();
        // 卡片底（白描边 + 糖果渐变）
        ctx.fillStyle = '#ffffff';
        roundRect(bx - 1.5, by - 1.5, gs + 3, gs + 3, 16); ctx.fill();
        if (sel) { ctx.shadowColor = 'rgba(255,210,74,0.95)'; ctx.shadowBlur = 18; }
        const bg2 = ctx.createLinearGradient(bx, by, bx, by + gs);
        bg2.addColorStop(0, '#ffffff'); bg2.addColorStop(1, sel ? '#fff3d6' : '#f3eefc');
        ctx.fillStyle = bg2;
        roundRect(bx, by, gs, gs, 16); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.lineWidth = sel ? 3 : 1.5;
        ctx.strokeStyle = sel ? '#ffb020' : 'rgba(140,120,190,0.35)';
        roundRect(bx, by, gs, gs, 16); ctx.stroke();
        // 左上角小徽章（解锁=✔ / 锁）
        const chipX = bx + 12, chipY = by + 12;
        if (unlocked) {
          ctx.fillStyle = sel ? '#43c463' : '#9adfa8';
          ctx.beginPath(); ctx.arc(chipX, chipY, 9, 0, 6.283); ctx.fill();
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(chipX - 3.6, chipY); ctx.lineTo(chipX - 1, chipY + 3.4); ctx.lineTo(chipX + 4.4, chipY - 3.4);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#9a8fb0';
          ctx.beginPath(); ctx.arc(chipX, chipY, 9, 0, 6.283); ctx.fill();
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.arc(chipX, chipY + 1, 3.2, 0, 6.283); ctx.stroke();
        }
        // 宠物立绘
        ctx.globalAlpha = unlocked ? 1 : 0.3;
        const faceCx = bx + gs / 2, faceCy = by + gs * 0.42;
        drawPetWithEq(p.id, ctx, faceCx, faceCy, 0.92, 1, timeAcc + i * 2, true);
        ctx.globalAlpha = 1;
        // 名字标签
        ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = unlocked ? '#4a3a6a' : '#b0a6c4';
        ctx.fillText(unlocked ? p.name : (p.need + ' 解锁'), bx + gs / 2, by + gs * 0.87);
        ctx.restore();
      }

      const infoY = gy + rows * (gs + 12) + 34;
      ctx.font = '900 16px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      drawGiftIconSmall(ctx, cx - 110, infoY, 16);
      const leftText = '累计 ' + (save.gifts | 0);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ffd24a';
      ctx.fillText(leftText, cx - 86, infoY);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillText('·', cx - 20, infoY);
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.font = '900 16px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('最高纪录：第 ' + (save.best | 0) + ' 关', cx - 2, infoY);
      // 意见②：房子进度（3 段建成大房子）
      ctx.fillStyle = save.house >= 3 ? '#9af29a' : 'rgba(255,255,255,0.8)';
      ctx.font = '900 15px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(save.house >= 3 ? '🏠 大房子已建成' : '🏠 房子 ' + save.house + '/3', cx + 172, infoY);

      /* ---------- 金币胶囊（右上角）---------- */
      const coinTxt = '🪙 ' + (save.coins | 0);
      ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
      const cw = Math.max(ctx.measureText(coinTxt).width + 26, 88);
      ctx.fillStyle = 'rgba(10,8,18,0.55)';
      roundRect(w - cw - 14, 14, cw, 30, 15); ctx.fill();
      ctx.strokeStyle = 'rgba(255,210,74,0.85)'; ctx.lineWidth = 1.5;
      roundRect(w - cw - 14, 14, cw, 30, 15); ctx.stroke();
      ctx.fillStyle = '#ffd24a';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(coinTxt, w - cw / 2 - 14, 29);

      /* ---------- 改装工坊 + 离线收益（借鉴《合成竞速之王》的核心循环）----------
       * 为什么必须在封面而不是埋进右侧那排小按钮：改装是这个游戏新的核心循环
       * （跑关 → 得金币 → 买零件 → 合成升级 → 跑得更爽 → 更多金币），核心循环
       * 必须一眼可见、一点直达；混在 8 个同级小按钮里等于没有。
       * 具体摆哪儿由 coverCards() 按横竖屏决定，此处只负责画。 */
      const cards = coverCards(w, h);
      drawGarageCard(cards);
      if (cards.idleH > 0) drawIdleCard(cards);
    }
    function drawGiftIconSmall(ctx2, x, y, s) {
      ctx2.save();
      ctx2.translate(x, y);
      const k = s / 22;
      ctx2.scale(k, k);
      ctx2.fillStyle = '#e5484d';
      ctx2.beginPath(); ctx2.roundRect ? ctx2.roundRect(-11, -8, 22, 17, 3) : ctx2.rect(-11, -8, 22, 17); ctx2.fill();
      ctx2.fillStyle = '#f2545a';
      ctx2.beginPath(); ctx2.roundRect ? ctx2.roundRect(-11, -8, 22, 6, 3) : ctx2.rect(-11, -8, 22, 6); ctx2.fill();
      ctx2.fillStyle = '#ffd24a';
      ctx2.fillRect(-2.6, -8, 5.2, 17);
      ctx2.beginPath(); ctx2.arc(0, -8, 4, 0, 6.283); ctx2.fill();
      ctx2.restore();
    }

    /* ---------- 意见②：小屋场景 ----------
     * 完美通关攒满 3 段房子后开放。点电视/饭碗/小床，宠物就去做那件事；
     * 底部按钮换装；「继续闯关」带着新装饰出发。 */
    function drawRoom(w, h) {
      const floorY = h * 0.60;
      // 墙（暖白）+ 地板（奶油木色）
      const wall = ctx.createLinearGradient(0, 0, 0, floorY);
      wall.addColorStop(0, '#fdf6ec'); wall.addColorStop(1, '#f6e9d8');
      ctx.fillStyle = wall; ctx.fillRect(0, 0, w, floorY);
      const fl = ctx.createLinearGradient(0, floorY, 0, h);
      fl.addColorStop(0, '#e8c99b'); fl.addColorStop(1, '#d9b382');
      ctx.fillStyle = fl; ctx.fillRect(0, floorY, w, h - floorY);
      ctx.strokeStyle = 'rgba(160,120,70,0.22)'; ctx.lineWidth = 2;
      for (let i = 0; i < 7; i++) {
        const ly = floorY + (i + 0.5) * (h - floorY) / 7;
        ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(w, ly); ctx.stroke();
      }
      ctx.fillStyle = '#f9efdd'; ctx.fillRect(0, floorY - 8, w, 8);

      // 圆窗 + 慢慢飘的云
      const wx = w * 0.5, wy = h * 0.20, wr = Math.min(w, h) * 0.10;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(wx, wy, wr + 7, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#aee1f9';
      ctx.beginPath(); ctx.arc(wx, wy, wr, 0, 6.283); ctx.fill();
      const cl = (timeAcc * 14) % (wr * 2.4) - wr * 1.2;
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.beginPath(); ctx.arc(wx - wr * 0.35 + cl, wy + wr * 0.15, wr * 0.24, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(wx - wr * 0.35 + cl + wr * 0.22, wy + wr * 0.02, wr * 0.18, 0, 6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(wx, wy - wr); ctx.lineTo(wx, wy + wr);
      ctx.moveTo(wx - wr, wy); ctx.lineTo(wx + wr, wy);
      ctx.stroke();

      // 墙饰：完美通关奖状 + 宠物涂鸦（竖屏中段不空）
      const fw = Math.min(w * 0.13, 86);
      ctx.fillStyle = '#fff';
      roundRect(wx - wr - fw - 26, wy - fw * 0.55, fw, fw * 1.1, 6); ctx.fill();
      ctx.strokeStyle = '#e0c9a4'; ctx.lineWidth = 2;
      roundRect(wx - wr - fw - 26, wy - fw * 0.55, fw, fw * 1.1, 6); ctx.stroke();
      ctx.fillStyle = '#ffd24a';
      ART.star(ctx, wx - wr - 26 - fw / 2, wy - fw * 0.1, fw * 0.22, '#ffd24a');
      ctx.fillStyle = '#c9b489';
      ctx.font = 'bold ' + Math.max(9, fw * 0.14) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('完美奖状', wx - wr - 26 - fw / 2, wy + fw * 0.32);
      // 涂鸦：小房子简笔画（房子建到第几段画几笔）
      const hx1 = wx + wr + 26, hy1 = wy - fw * 0.55;
      ctx.fillStyle = '#fff';
      roundRect(hx1, hy1, fw, fw * 1.1, 6); ctx.fill();
      ctx.strokeStyle = '#e0c9a4';
      roundRect(hx1, hy1, fw, fw * 1.1, 6); ctx.stroke();
      ctx.strokeStyle = '#e056a0'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      const dh = fw * 0.5, dcx = hx1 + fw / 2, dcy = hy1 + fw * 0.62;
      ctx.strokeRect(dcx - dh / 2, dcy - dh / 2, dh, dh * 0.8);
      ctx.beginPath();
      ctx.moveTo(dcx - dh * 0.62, dcy - dh / 2); ctx.lineTo(dcx, dcy - dh); ctx.lineTo(dcx + dh * 0.62, dcy - dh / 2);
      ctx.stroke();
      for (let i = 0; i < save.house; i++) {
        ctx.fillStyle = '#43c463';
        ctx.beginPath(); ctx.arc(hx1 + 12 + i * 11, hy1 + fw - 10, 3.4, 0, 6.283); ctx.fill();
      }

      // —— 电视 + 柜子（左）：屏幕滚彩虹条 ——
      const tvX = w * 0.16, tvW = Math.min(150, w * 0.20), tvY = floorY - tvW * 0.72 - 30;
      ctx.fillStyle = '#8a6b4f';
      roundRect(tvX - tvW * 0.62, floorY - 46, tvW * 1.24, 46, 8); ctx.fill();
      ctx.fillStyle = '#ffffff';
      roundRect(tvX - tvW / 2 - 5, tvY - 5, tvW + 10, tvW * 0.62 + 10, 10); ctx.fill();
      ctx.save();
      roundRect(tvX - tvW / 2, tvY, tvW, tvW * 0.62, 6);
      ctx.fillStyle = '#2b2b33'; ctx.fill(); ctx.clip();
      const cols = ['#ff7eb6', '#ffd24a', '#7afcff', '#9af29a'];
      for (let i = 0; i < 8; i++) {
        ctx.fillStyle = cols[i % 4];
        ctx.fillRect(tvX - tvW / 2 + ((i * 46 + timeAcc * 70) % (tvW + 46)) - 23, tvY, 18, tvW * 0.62);
      }
      ctx.restore();

      // —— 沙发（电视右侧） ——
      const sfX = w * 0.36, sfY = floorY;
      ctx.fillStyle = '#ffb9a3';
      roundRect(sfX - 70, sfY - 78, 140, 56, 16); ctx.fill();
      roundRect(sfX - 86, sfY - 52, 172, 48, 14); ctx.fill();
      ctx.fillStyle = '#ff9d84';
      roundRect(sfX - 68, sfY - 42, 136, 24, 10); ctx.fill();

      // —— 饭碗（中） ——
      const fwX = w * 0.55, fwY = floorY + 30;
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.ellipse(fwX, fwY + 6, 46, 12, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#e056a0';
      ctx.beginPath(); ctx.ellipse(fwX, fwY, 27, 13, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#c94488';
      ctx.beginPath(); ctx.ellipse(fwX, fwY, 27, 7, 0, 0, Math.PI); ctx.fill();
      const bites = Math.floor((timeAcc % 3) * 3);
      ctx.fillStyle = '#fff4d6';
      for (let i = 0; i < 3 - bites; i++) {
        ctx.beginPath(); ctx.ellipse(fwX - 10 + i * 10, fwY - 5 - (i % 2) * 3, 5, 3.2, 0.4, 0, 6.283); ctx.fill();
      }

      // —— 小床（右） ——
      const bdX = w * 0.84, bdY = floorY + 8;
      ctx.fillStyle = '#ffffff';
      roundRect(bdX - 92, bdY - 26, 184, 42, 12); ctx.fill();
      ctx.fillStyle = '#a2d2ff';
      roundRect(bdX - 84, bdY - 36, 60, 26, 10); ctx.fill();
      ctx.fillStyle = '#ffdfd3';
      roundRect(bdX - 20, bdY - 32, 106, 32, 10); ctx.fill();
      ctx.strokeStyle = '#e8b5a5'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(bdX - 20, bdY - 22); ctx.quadraticCurveTo(bdX + 30, bdY - 12, bdX + 84, bdY - 24); ctx.stroke();

      // —— 宠物（按动作就位，穿戴装饰随时可见） ——
      const chew = petAction === 'eat' ? Math.sin(timeAcc * 10) * 2.5 : 0;
      let px = w * 0.5, py = floorY - 52, ps = 1.15;
      if (petAction === 'tv') { px = sfX + 4; py = sfY - 60; ps = 0.92; }
      else if (petAction === 'eat') { px = fwX; py = floorY - 44 + chew * 2; ps = 1.0; }
      else if (petAction === 'sleep') { px = bdX - 6; py = bdY - 42; ps = 0.88; }
      drawPetWithEq(pet.id, ctx, px, py, ps, 1, timeAcc, false);

      // Zzz（睡觉）
      if (petAction === 'sleep') {
        for (let i = 0; i < 3; i++) {
          const zz = (timeAcc * 0.9 + i * 0.7) % 2;
          ctx.globalAlpha = clamp(1.4 - zz, 0, 1);
          ctx.fillStyle = '#7a9bd4';
          ctx.font = 'bold ' + (13 + i * 4) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
          ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          ctx.fillText('Z', px + 22 + i * 12, py - 18 - zz * 40);
        }
        ctx.globalAlpha = 1;
      }

      // 默认提示
      if (!petAction) {
        ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = 'rgba(120,90,60,0.75)';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('点点电视、饭碗和小床，宠物就会去做那件事～', w / 2, floorY + 40);
      }
      // 标题
      gradientTitle('我的小屋', w / 2, h * 0.075, view.portrait ? 30 : 34);
    }

    function drawPause(w, h) {
      gradientTitle('已暂停', w / 2, h * 0.38, 38);
      const cx = w / 2;
      // 手绘载具小图
      ART.drawVehicle(vehicle.id, ctx, cx - 62, h * 0.38 + 46, 1, vehicle.accent, timeAcc);
      ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('第 ' + level + ' 关 · 载具：' + vehicle.name, cx - 34, h * 0.38 + 38);
    }

    function drawDead(w, h) {
      gradientTitle(endlessMode ? '冲刺结束…' : '失败啦…', w / 2, h * 0.30, 38);
      ctx.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.86)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(endlessMode ? ('本次冲刺 ' + endlessDist + ' 米')
                              : ('坚持到第 ' + level + ' 关'), w / 2, h * 0.30 + 34);
      // 宠物小头像
      drawPetWithEq(pet.id, ctx, w / 2, h * 0.30 + 64, 0.62, 1, timeAcc, false);
      ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.62)';
      drawGiftIconSmall(ctx, w / 2 - 64, h * 0.30 + 82, 13);
      ctx.textAlign = 'left';
      ctx.fillText('本次收集 ' + runGifts + (revivesUsed < 2 ? '　·　还可复活 ' + (2 - revivesUsed) + ' 次' : ''), w / 2 - 44, h * 0.30 + 82);
      if (endlessMode) {
        // 最远纪录常驻显示：无尽模式的长期目标就是这个数字，不看到它就没有刷的动力
        ctx.fillStyle = endlessNewBest ? '#ffd24a' : 'rgba(255,255,255,0.72)';
        ctx.font = (endlessNewBest ? '900 17px ' : 'bold 14px ') + '"PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(endlessNewBest ? '🏆 新纪录！' : '最远纪录 ' + (save.endlessBest | 0) + ' 米',
          w / 2, h * 0.30 + 104);
      } else if (level >= (save.best | 0)) {
        ctx.fillStyle = '#ffd24a';
        ctx.font = '900 17px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🏆 新纪录！', w / 2, h * 0.30 + 104);
      }
    }

    function drawCleared(w, h) {
      /* 排版节奏（自上而下，全部以 topY 为基准）
       *   topY+0     「关卡通过！」大标题
       *   topY+44    评级大字 + 得分
       *   topY+78    第 N 关 · 主题
       *   topY+112   宠物 / 载具 / 本关礼物 / 掉落道具 —— 同一条横带左右分列
       *   topY+150   装饰品解锁 或 房子进度（胶囊底衬，压在下沿也不糊）
       * 按钮区从 h*0.56 起（见 overlayLayout），topY 取 h*0.20 时留够 30px 间隙。
       * 此前 topY 取 0.24、各元素逐行下推，导致礼物行压住宠物立绘、状态行又滑进按钮区，
       * 一屏三处碰撞——这里压缩行距并把宠物与礼物并到同一横带，一次解决。 */
      const topY = h * 0.20;
      gradientTitle('关卡通过！', w / 2, topY, 32);
      const cx = w / 2;
      // 评分：大字评级 + 分数（留存系统：冲 S 评级）
      const gr = runGrade || gradeFor(runScore);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '900 40px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = '#fff'; ctx.strokeStyle = gr.color; ctx.lineWidth = 6; ctx.lineJoin = 'round';
      ctx.strokeText(gr.g, cx - 52, topY + 44);
      ctx.fillStyle = gr.color;
      ctx.fillText(gr.g, cx - 52, topY + 44);
      ctx.textAlign = 'left';
      ctx.font = 'bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillText('得分 ' + runScore, cx - 24, topY + 38);
      ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = gr.color;
      ctx.fillText(gr.label + (runScore >= (save.bestScore | 0) ? ' · 新纪录！' : ''), cx - 24, topY + 58);
      // 关卡信息并到评级标签右侧，竖屏把 topY+78 整行留白给星级（避免行距过密）
      ctx.textAlign = 'center';
      ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.86)';
      ctx.fillText('第 ' + level + ' 关 · ' + theme.name, cx, topY + 78);
