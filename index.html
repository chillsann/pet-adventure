        case 'double': doubleRewardByAd(); break;
        case 'next': level++; runGifts = 0; revivesUsed = 0; refreshRevives(); pendingUnlock = null; prepareRunItem(); generateLevel(level); state = 'playing'; break;
        case 'room':

        case 'keepgoing':

          prepareRunItem(); generateLevel(level); state = 'playing';
          break;
        case 'tv': case 'eat': case 'sleep': {
          // 意见②：小屋里点什么，宠物就干什么

          if (id === 'tv') sfx.play('click');

      return '';

      for (let i = 0; i < owned.length; i++) if (owned[i].id === cur) idx = i;

      input.right = keyState.right || touchState.right;

      else if (code === 'ArrowRight' || code === 'KeyD') { keyState.right = true; syncInput(); }
      else if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') {
        if (!keyState.jump) jumpBuffer = BUFFER;
        keyState.jump = true; jumpHeld = true; syncInput();

        else if (state === 'paused') { state = 'playing'; startBgm(); }
      }
      else if (code === 'KeyR' && (state === 'dead' || state === 'playing')) {

        if (state === 'cover') startRun();
        else if (state === 'dead') { generateLevel(level); revivesUsed = 0; runGifts = 0; state = 'playing'; }

      else if (code === 'ArrowRight' || code === 'KeyD') { keyState.right = false; syncInput(); }
      else if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') { keyState.jump = false; syncInput(); }

     * 12. 流程控制
     * ====================================================================== */
    function startRun() {

      runGifts = 0;
      revivesUsed = 0;
      runClean = true;             // 意见②：完美通关攒房子，重开一关重新计
      pendingUnlock = null;
      petAction = '';
      dailyMode = false;           // 正常模式：真随机
      rng = Math.random;

      questRuns = 0;
      questGiftCount = 0;
      if (!save.questRuns) save.questRuns = 0;

      generateLevel(level);
      state = 'playing';
      sfx.play('click');
    }

    /* ---------- 每日挑战（留存系统）：固定日期 seed 关卡 ---------- */
    function todayKey() {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return '' + d.getFullYear() + m + dd;
    }
    function enterDaily() {
      dailyMode = true;
      dailyKey = todayKey();
      rng = seededRng(hashStr(dailyKey));
      level = 1;
      runGifts = 0; revivesUsed = 0; runClean = true;
      pendingUnlock = null; petAction = '';

      shieldLeft = 0; magnetLeft = 0; boostLeft = 0; equippedItem = '';
      generateLevel(1);            // 今天所有人同一关（seed 决定）
      state = 'playing';
      sfx.play('click');
      toast('今日挑战：冲最高分！');
    }

    /* =========================================================================
     * 13. 主循环（固定步长 + 帧率无关的累加器）
     * ====================================================================== */
    let acc = 0;
    let lastT = 0;
    let tickErrLogged = 0;   // 异常日志限流：只打印前几次，避免每帧刷屏
    function tick(nowMs) {
      if (!lastT) lastT = nowMs;
      let dt = (nowMs - lastT) / 1000;
      lastT = nowMs;
      if (dt > 0.25) dt = 0.25;
      acc += dt;
      let steps = 0;
      while (acc >= FIXED_DT && steps < MAX_STEPS) {
        // 关键：逻辑帧异常必须就地吞掉。此前一次未捕获的 ReferenceError 会让异常
        // 冲出 rAF 回调 → requestAnimationFrame 不再被调用 → 整局游戏永久卡死不动。
        try { step(); }
        catch (e) { if (tickErrLogged++ < 5) console.error('[pet-adventure] step error:', e); }
        acc -= FIXED_DT;
        steps++;
      }
      if (steps >= MAX_STEPS) acc = 0;
      if (player) player.animT += dt;
      try { render(); }
      catch (e) { if (tickErrLogged++ < 5) console.error('[pet-adventure] render error:', e); }
    }

    /* =========================================================================
     * 14. 对外接口
     * ====================================================================== */
    resize(deps.viewport.width, deps.viewport.height, deps.viewport.dpr);
    generateLevel(1);
    state = 'cover';

    return {
      tick: tick,
      resize: resize,
      getView: function () { return view; },
      pause: function () { if (state === 'playing') state = 'paused'; },
      onPointerDown: onPointerDown,
      onPointerMove: onPointerMove,
      onPointerUp: onPointerUp,
      onKeyDown: onKeyDown,
      onKeyUp: onKeyUp,
      getState: function () { return state; },
      // 调试 / 自动化测试用
      debug: {
        jumpToLevel: function (n) { level = n; runGifts = 0; revivesUsed = 0; runClean = true; generateLevel(n); state = 'playing'; },
        getPlayer: function () { return player; },
        getLevel: function () { return { level: level, width: levelWidth, platforms: platforms, hazards: hazards, stars: stars, goal: goal }; },
        getSave: function () { return save; },
        getRunClean: function () { return runClean; },
        enterDaily: function () { enterDaily(); },
        goTo: function (s) { if (['cover','scores','achievements','daily'].indexOf(s)>=0) { state = s; stopBgm(); } },
        grantAccessories: function () { for (const a of ACCESSORIES) if (save.acc.indexOf(a.id) < 0) save.acc.push(a.id); persist(); },
        setInput: function (k, v) { if (k === 'jump' && v && !input.jump) jumpBuffer = BUFFER; input[k] = v; if (k === 'jump' && v) jumpHeld = true; },
      },
    };
  }

  global.PetAdventure = { createGame: createGame, PETS: PETS, VEHICLES: VEHICLES, THEMES: THEMES, PHYS: { FIXED_DT: FIXED_DT, GRAVITY: GRAVITY } };
})(typeof window !== 'undefined' ? window : globalThis);

        mel: [52, 55, 59, 55, 52, 55, 59, 62, 64, 62, 59, 55, 52, null, 55, 59,
              64, 67, 64, 62, 59, 55, 52, null, 55, 59, 62, 64, 59, null, null, null],
        bass: [40, 36, 43, 38],
        chords: [[52, 55, 59], [48, 52, 55], [55, 59, 62], [50, 54, 57]],
        drums: { kick: '1010001010010010', snare: '0000100000001001', hat: '1111111111111111' } },
      { name: '霓虹都市', bpm: 126, wave: 'square', bassWave: 'triangle',    // 5 Am 电子琶音
        mel: [57, 60, 64, 67, 64, 60, 57, 60, 64, 67, 72, 67, 64, 60, 64, 60,
              55, 59, 62, 67, 62, 59, 55, 59, 62, 67, 71, 67, 62, 59, 55, null],
        bass: [45, 41, 43, 40],
        chords: [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 55, 59]],
        drums: { kick: '1000100010001000', snare: '0000100000001000', hat: '0010010010010010' } },
    ];

    let bgmTimer = null, bgmSong = null, bgmIdx = -1, bgmActive = false;
    let stepIdx = 0, nextTime = 0;
    const LOOKAHEAD = 0.15, TICK_MS = 25;

    function stepDur() { return 60 / bgmSong.bpm / 4; }

    function scheduleStep(i, when) {
      const s = bgmSong, L = s.mel.length, k = i % L, k16 = i % 16;
      const m = s.mel[k];
      if (m != null) leadAt(midi(m), stepDur() * 1.75, s.wave, 0.13, when);
      if (k % 4 === 0) {
        const b = s.bass[(k / 4 | 0) % s.bass.length];
        toneAt(midi(b), midi(b), stepDur() * 3.5, s.bassWave, 0.17, when);
      }
      if (k % 8 === 0) {
        const ch = s.chords[(k / 8 | 0) % s.chords.length];
        const fr = [];
        for (let n = 0; n < ch.length; n++) fr.push(midi(ch[n]));
        padAt(fr, stepDur() * 7.4, 0.05, when);
      }
      const d = s.drums;
      if (d) {
        if (d.kick.charAt(k16) === '1') kickAt(when, 0.40);
        if (d.snare.charAt(k16) === '1') snareAt(when, 0.13);
        if (d.hat.charAt(k16) === '1') hatAt(when, 0.042);
      }
    }

    function scheduler() {
      const c = ac;
      if (!c || !bgmSong) return;
      const sd = stepDur();
      let guard = 0;
      while (nextTime < c.currentTime + LOOKAHEAD && guard++ < 64) {
        scheduleStep(stepIdx, Math.max(nextTime, c.currentTime + 0.01));
        stepIdx++;
        nextTime += sd;
      }
      // 页面被挂起再回来时时间轴会落后，追平以免一次性补发大量音符
      if (nextTime < c.currentTime) nextTime = c.currentTime + 0.02;
    }

    function stopBgmTimer() {
      if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
    }
    function startBgm(idx) {
      if (typeof idx === 'number') bgmIdx = idx;
      if (bgmIdx < 0) return;
      stopBgmTimer();
      bgmSong = SONGS[bgmIdx % SONGS.length];
      bgmActive = true;
      const c = ensure();
      if (!c || muted) return;
      if (c.state === 'suspended') c.resume();
      stepIdx = 0;
      nextTime = c.currentTime + 0.08;
      scheduler();
      bgmTimer = setInterval(scheduler, TICK_MS);
    }
    function stopBgm() {
      bgmActive = false;
      stopBgmTimer();
      bgmSong = null;
    }

    return {
      play: function (name) {
        const fn = SFX[name];
        if (fn) { try { fn(); } catch (e) {} }
      },
      unlock: function () {
        const c = ensure();
        if (c && c.state === 'suspended') c.resume();
      },
      startBgm: startBgm,
      stopBgm: stopBgm,
      setMuted: function (v) {
        muted = !!v;
        if (master) master.gain.value = muted ? 0 : 0.40;
        try { global.localStorage.setItem('petadv.muted', muted ? '1' : '0'); } catch (e) {}
        // 静音只停调度器，保留 bgmActive：取消静音后能自动接着放
        if (muted) stopBgmTimer();
        else if (bgmActive) startBgm();
      },
      isMuted: function () { return muted; },
    };
  }

  /* ---------- 广告：Web 版为模拟实现，小游戏版替换为真实激励视频 ---------- */
  function createAds(opts) {
    const o = opts || {};
    return {
      showRewarded: function (kind, cb) {
        // Web 端没有激励视频，用 1.2s 模拟，方便验证流程与 UI
        if (o.onShow) o.onShow(kind);
        global.setTimeout(function () {
          if (o.onClose) o.onClose(kind);
          cb(true);
        }, 1200);
      },
    };
  }

  /* ---------- 震动 ---------- */
  function vibrate(ms) {
    try { if (global.navigator && global.navigator.vibrate) global.navigator.vibrate(ms); } catch (e) {}
  }

  global.PlatformWeb = {
    storage: storage,
    createSfx: createSfx,
    createAds: createAds,
    vibrate: vibrate,
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script data-page-node-id="pyjL30A4atJ6PZCkE4NOW5" data-pnid-children="FNPQWK83sxhqTDSq0CEllw">/* =============================================================================
 * Web 启动器：创建画布、绑定输入、驱动主循环
 * ========================================================================== */
(function (global) {
  'use strict';
  const doc = global.document;

  const PREVENT_KEYS = {
    Space: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1,
  };

  function boot() {
    const wrap = doc.getElementById('stage');
    const canvas = doc.getElementById('game');
    const ctx = canvas.getContext('2d');
    const sfx = global.PlatformWeb.createSfx();
    const ads = global.PlatformWeb.createAds();
    const vibrate = global.PlatformWeb.vibrate;

    let game = null;
    let audioUnlocked = false;

    function currentSize() {
      const r = wrap.getBoundingClientRect();
      return { width: Math.max(1, Math.round(r.width)), height: Math.max(1, Math.round(r.height)) };
    }

    function safeInsets() {
      const el = doc.getElementById('safeProbe');
      let b = 0;
      if (el && global.getComputedStyle) {
        const v = parseFloat(global.getComputedStyle(el).paddingBottom);
        if (!isNaN(v)) b = v;
      }
      return { bottom: b, top: 0 };
    }

    function applySize() {
      const s = currentSize();
      const dpr = Math.min(global.devicePixelRatio || 1, 2.5);
      canvas.style.width = s.width + 'px';
      canvas.style.height = s.height + 'px';
      canvas.width = Math.round(s.width * dpr);
      canvas.height = Math.round(s.height * dpr);
      if (game) game.resize(s.width, s.height, dpr, safeInsets());
    }

    function toLogicalX(clientX) {
      const r = canvas.getBoundingClientRect();
      const v = game.getView();
      return (clientX - r.left) / v.scale;
    }
    function toLogicalY(clientY) {
      const r = canvas.getBoundingClientRect();
      const v = game.getView();
      return (clientY - r.top) / v.scale;
    }

    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      sfx.unlock();
    }

    /* ---------- 输入 ---------- */
    canvas.addEventListener('pointerdown', function (e) {
      unlockAudio();
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      game.onPointerDown(toLogicalX(e.clientX), toLogicalY(e.clientY), e.pointerId);
      e.preventDefault();
    }, { passive: false });

    global.addEventListener('pointermove', function (e) {
      game.onPointerMove(toLogicalX(e.clientX), toLogicalY(e.clientY), e.pointerId);
    });

    global.addEventListener('pointerup', function (e) {
      game.onPointerUp(toLogicalX(e.clientX), toLogicalY(e.clientY), e.pointerId);
    });

    global.addEventListener('pointercancel', function (e) {
      game.onPointerUp(toLogicalX(e.clientX), toLogicalY(e.clientY), e.pointerId);
    });

    global.addEventListener('keydown', function (e) {
      unlockAudio();
      if (PREVENT_KEYS[e.code]) e.preventDefault();
      game.onKeyDown(e.code);
    });
    global.addEventListener('keyup', function (e) {
      game.onKeyUp(e.code);
    });

    // 阻止移动端页面滚动 / 双击缩放 / 长按菜单
    doc.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    doc.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    // 切到后台自动暂停，回来不会因为累加器爆炸而瞬移
    doc.addEventListener('visibilitychange', function () {
      if (doc.hidden && game.getState() === 'playing') game.pause();
    });

    global.addEventListener('resize', applySize);
    global.addEventListener('orientationchange', function () {
      global.setTimeout(applySize, 220);
    });

    /* ---------- 启动 ---------- */
    const s0 = currentSize();
    game = global.PetAdventure.createGame({
      ctx: ctx,
      storage: global.PlatformWeb.storage,
      sfx: sfx,
      ads: ads,
      vibrate: vibrate,
      viewport: { width: s0.width, height: s0.height, dpr: Math.min(global.devicePixelRatio || 1, 2.5) },
    });
    applySize();

    const loading = doc.getElementById('loading');
    if (loading && loading.parentNode) loading.parentNode.removeChild(loading);

    function frame(t) {
      // 兜底：即使 tick 内部出现意外异常，也必须把下一帧排上，绝不让循环断掉
      try { game.tick(t); } catch (e) { /* 内部已限流打印，这里只保证循环存活 */ }
      global.requestAnimationFrame(frame);
    }
    global.requestAnimationFrame(frame);

    // 供自动化测试使用
    global.__game = game;
  }

  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);
