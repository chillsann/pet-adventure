      } catch (e) { ac = null; }
      return ac;
    }

    function tone(f0, f1, dur, type, vol, delay) {
      const c = ensure();
      if (!c || muted) return;
      const t0 = c.currentTime + (delay || 0);
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(f0, t0);
      if (f1 && f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol == null ? 0.5 : vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(master);
      osc.start(t0); osc.stop(t0 + dur + 0.03);
    }

    function noise(dur, vol, delay) {
      const c = ensure();
      if (!c || muted) return;
      const t0 = c.currentTime + (delay || 0);
      const len = Math.floor(c.sampleRate * dur);
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = c.createBufferSource();
      src.buffer = buf;
      const g = c.createGain();
      g.gain.value = vol == null ? 0.3 : vol;
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 1400;
      src.connect(lp); lp.connect(g); g.connect(master);
      src.start(t0);
    }

    const SFX = {
      jump:  function () { tone(360, 720, 0.14, 'triangle', 0.42); },
      land:  function () { noise(0.07, 0.16); },
      coin:  function () { tone(880, 880, 0.07, 'square', 0.30); tone(1320, 1320, 0.10, 'square', 0.26, 0.06); },
      hurt:  function () { tone(320, 110, 0.26, 'sawtooth', 0.34); noise(0.12, 0.18); },
      fall:  function () { tone(440, 70, 0.50, 'sawtooth', 0.32); },
      clear: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, f, 0.16, 'triangle', 0.34, i * 0.09); }); },
      fail:  function () { [392, 330, 262].forEach(function (f, i) { tone(f, f, 0.22, 'triangle', 0.32, i * 0.14); }); },
      click: function () { tone(660, 660, 0.05, 'square', 0.22); },

<script data-page-node-id="pyjL30A4atJ6PZCkE4NOW5" data-pnid-children="FNPQWK83sxhqTDSq0CEllw">/* =============================================================================
 * Web 启动器：创建画布、绑定输入、驱动主循环
 * ========================================================================== */
(function (global) {
  'use strict';
  const doc = global.document;

  const PREVENT_KEYS = {
    Space: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1,
  };

  function boot() {
    const wrap = doc.getElementById('stage');
    const canvas = doc.getElementById('game');

    const sfx = global.PlatformWeb.createSfx();
    const ads = global.PlatformWeb.createAds();
    const vibrate = global.PlatformWeb.vibrate;

    let game = null;
    let audioUnlocked = false;

    function currentSize() {
      const r = wrap.getBoundingClientRect();
      return { width: Math.max(1, Math.round(r.width)), height: Math.max(1, Math.round(r.height)) };
    }

    function safeInsets() {
      const el = doc.getElementById('safeProbe');
      let b = 0;

      canvas.width = Math.round(s.width * dpr);
      canvas.height = Math.round(s.height * dpr);
      if (game) game.resize(s.width, s.height, dpr, safeInsets());
    }

    function toLogicalX(clientX) {
      const r = canvas.getBoundingClientRect();
      const v = game.getView();
      return (clientX - r.left) / v.scale;
    }
    function toLogicalY(clientY) {
      const r = canvas.getBoundingClientRect();
      const v = game.getView();
      return (clientY - r.top) / v.scale;

      if (audioUnlocked) return;
      audioUnlocked = true;

      unlockAudio();
      if (e.pointerType === 'mouse' && e.button !== 0) return;

    global.addEventListener('pointermove', function (e) {
      game.onPointerMove(toLogicalX(e.clientX), toLogicalY(e.clientY), e.pointerId);
    });

    global.addEventListener('pointerup', function (e) {
      game.onPointerUp(toLogicalX(e.clientX), toLogicalY(e.clientY), e.pointerId);
    });

    global.addEventListener('pointercancel', function (e) {
      game.onPointerUp(toLogicalX(e.clientX), toLogicalY(e.clientY), e.pointerId);
    });

    global.addEventListener('keydown', function (e) {
      unlockAudio();
      if (PREVENT_KEYS[e.code]) e.preventDefault();
      game.onKeyDown(e.code);

    global.addEventListener('keyup', function (e) {
