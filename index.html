      /* 三颗星：用图形而不是文字表达成绩 —— 三星是通用视觉语言，
       * 不需要任何说明，点亮几颗就是本关最好成绩。
       *
       * 位置按屏幕方向分流，因为两个方向的余量天差地别：
       *  · 竖屏：画在 h*0.50 的空白带（横带之下、按钮之上），一字排开够醒目
       *  · 横屏：内联到评级行右侧 —— 横屏内容区只有约 177px 高，塞不下一整行；
       *          但宽度有富余，往右排正好利用了横向空间 */
      const starGap = 46, starR = 16;
      const starY = view.portrait ? Math.round(h * 0.50) : (topY + 44);
      const starCx = view.portrait ? cx : (cx + 132);
      for (let i = 0; i < 3; i++) {
        const on = i < (runStars | 0);
        const pulse = on ? 1 + Math.sin(timeAcc * 4 + i) * 0.06 : 1;
        ctx.save();
        ctx.translate(starCx + (i - 1) * starGap, starY);
        ctx.scale(pulse, pulse);
        ART.star(ctx, 0, 0, starR,
          on ? '#ffd24a' : 'rgba(255,255,255,0.14)',
          on ? 'rgba(255,255,255,0.92)' : 'rgba(255,255,255,0.3)');
        ctx.restore();
      }
      if (runStarsNew) {
        ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = '#9af29a';
        ctx.textAlign = 'center';
        ctx.fillText('精通度提升！', starCx, starY + 26);
      }

      // ---- 横带：左半是宠物+载具立绘，右半是本关礼物与掉落道具 ----
      const bandY = topY + 112;   // 星级不在这条线上（见下方按方向分流），横带保持原位
      drawPetWithEq(pet.id, ctx, cx - 122, bandY - 2, 0.62, 1, timeAcc, false);
      ART.drawVehicle(vehicle.id, ctx, cx - 86, bandY + 16, 0.8, vehicle.accent, timeAcc);
      // 礼物计数
      ctx.textAlign = 'left';
      ctx.font = 'bold 17px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = '#ffd24a';
      drawGiftIconSmall(ctx, cx - 38, bandY - 10, 13);
      ctx.fillText('本关礼物 ' + runGifts, cx - 20, bandY - 10);
      // 金币收入：结算里必须露脸 —— 玩家要清楚"这一局赚了多少金币"，
      // 才会去工坊把它花掉，整条经济循环才转得起来。
      ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = '#ffd24a';
      ctx.fillText('🪙 +' + runCoins + (runCoinsDoubled ? '（已翻倍）' : '') +
                   '   共 ' + (save.coins | 0), cx - 38, bandY + 10);
      // 掉落道具：竖排贴在礼物下方，名字用稀有度配色，玩家一眼看出成色
      if (droppedItems.length) {
        let dy = bandY + 34;
        for (const it of droppedItems) {
          ctx.font = '15px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
          ctx.fillStyle = '#fff';
          ctx.fillText(it.icon, cx - 38, dy);
          ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
          ctx.fillStyle = RARITY_COLOR[it.rarity];
          ctx.fillText('+ ' + it.name, cx - 18, dy);
          dy += 21;
        }
      }

      // 意见②：本关开出的装饰品 / 房子进度（胶囊底衬，保证压在宠物下沿也清晰）
      const stText = pendingUnlock ? ('🎁 开出了新装饰：' + pendingUnlock.name + '！')
        : (runClean && save.house >= 3) ? '🏠 大房子建成啦！去小屋休息一下吧'
        : runClean ? ('完美通关！房子进度 ' + save.house + '/3') : '';
      if (stText) {
        ctx.textAlign = 'center';
        ctx.font = '900 14px "PingFang SC","Microsoft YaHei",sans-serif';
        const sy = topY + 150;
        const sw = ctx.measureText(stText).width + 28;
        ctx.fillStyle = 'rgba(10,8,18,0.55)';
        roundRect(cx - sw / 2, sy - 14, sw, 28, 14); ctx.fill();
        ctx.fillStyle = pendingUnlock ? '#7afcff' : '#9af29a';
        ctx.fillText(stText, cx, sy);
      }
    }

    /* ---------- 排行榜（留存系统） ---------- */
    function drawScores(w, h) {
      gradientTitle('🏆 排行榜', w / 2, h * 0.13, 34);
      const list = save.scores || [];
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (!list.length) {
        ctx.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillText('还没有成绩，快去闯一关吧！', w / 2, h * 0.3);
        return;
      }
      const panelW = Math.min(w - 48, 560);
      const px = (w - panelW) / 2, py = h * 0.24, rowH = 46;
      panel(px, py, panelW, Math.min(list.length, 10) * rowH + 16, 18);
      for (let i = 0; i < list.length && i < 10; i++) {
        const it = list[i];
        const petE = (PETS.find(function (p) { return p.id === it.pet; }) || {}).emoji || '🐱';
        const y = py + 8 + i * rowH + rowH / 2;
        // 名次徽章
        const medal = i === 0 ? '#ffd24a' : i === 1 ? '#d7dde3' : i === 2 ? '#e0a96d' : 'rgba(255,255,255,0.18)';
        ctx.fillStyle = medal;
        ctx.beginPath(); ctx.arc(px + 34, y, 15, 0, 6.283); ctx.fill();
        ctx.fillStyle = i < 3 ? '#4a3a2a' : '#fff';
        ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillText(String(i + 1), px + 34, y);
        // 宠物 + 分数 + 关卡
        ctx.fillStyle = '#fff';
        ctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(petE + ' 第 ' + it.level + ' 关', px + 60, y);
        ctx.textAlign = 'right';
        ctx.font = 'bold 17px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = '#ffd24a';
        ctx.fillText(it.score + ' 分', px + panelW - 18, y);
        ctx.textAlign = 'center';
      }
    }

    /* ---------- 成就（留存系统） ---------- */
    function drawAchievements(w, h) {
      gradientTitle('🎖 成就', w / 2, h * 0.13, 34);
      const got = Object.keys(save.achievements || {}).length;
      ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('已解锁 ' + got + ' / ' + ACHIEVEMENTS.length, w / 2, h * 0.24);
      const cols = 2;
      const cw = Math.min(w - 48, 560) / cols - 8;
      /* 卡片高度按条数自适应：成就从 8 条加到 10 条后，固定 74 会在横屏
       * （画布仅 506 高）把最后一行顶出屏幕 —— 让高度去服从可用空间。 */
      const rows = Math.ceil(ACHIEVEMENTS.length / cols);
      const ch = clamp(Math.min(74, (h - h * 0.30 - 90) / rows - 10), 44, 74);
      for (let i = 0; i < ACHIEVEMENTS.length; i++) {
        const a = ACHIEVEMENTS[i];
        const c = i % cols, r = Math.floor(i / cols);
        const bx = (w - Math.min(w - 48, 560)) / 2 + c * (cw + 8);
        const by = h * 0.30 + r * (ch + 10);
        const unlocked = !!save.achievements[a.id];
        ctx.save();
        ctx.fillStyle = unlocked ? 'rgba(46,40,70,0.7)' : 'rgba(30,26,46,0.45)';
        roundRect(bx, by, cw, ch, 14); ctx.fill();
        ctx.strokeStyle = unlocked ? 'rgba(255,210,74,0.7)' : 'rgba(255,255,255,0.16)';
        ctx.lineWidth = unlocked ? 2 : 1.2;
        roundRect(bx, by, cw, ch, 14); ctx.stroke();
        if (!unlocked) ctx.globalAlpha = 0.5;
        ctx.font = '26px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(a.icon, bx + 24, by + ch / 2);
        ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'left';
        ctx.fillText(a.name, bx + 50, by + ch * 0.32);
        ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.62)';
        ctx.fillText(a.desc, bx + 50, by + ch * 0.62);
        ctx.restore();
      }
    }

    /* ---------- 背包（道具系统 UI） ---------- */
    /* 几何必须与 overlayLayout 的 bag 分支共用这一份公式（两处都调 bagGrid），
     * 否则卡片画在一处、热区注册在另一处，玩家就点不准。
     * 尺寸由「底部硬约束」反推：网格下沿 + 底部说明 必须停在「返回」按钮上方，
     * 所以先扣掉按钮与说明占用的高度，再把剩余空间三等分——这样任何屏幕比例下
     * 第三行都不会被返回按钮盖住（之前固定 bw=150 就踩了这个坑）。 */
    function bagGrid(w, h) {
      const cols = 3, rows = 3, gap = 12;
      const topY = h * 0.20 + 44;      // 网格起始 y（标题与副标题之下）
      const bottomReserve = 118;       // 返回按钮 48 + 间隙 + 底部说明 20 的预留
      const availW = Math.min(w - 60, 480);
      const availH = h - topY - bottomReserve;
      const bw = Math.floor(Math.min((availW - (cols - 1) * gap) / cols,
                                     (availH - (rows - 1) * gap) / rows, 138));
      const gx = w / 2 - (cols * bw + (cols - 1) * gap) / 2;
      return { bw: bw, gap: gap, gx: gx, gy: topY, cols: cols };
    }
    function drawBag(w, h) {
      gradientTitle('🎒 我的背包', w / 2, h * 0.09, view.portrait ? 28 : 34);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.72)';
      ctx.fillText('点一下携带，下一关开局生效（每关消耗 1 个）', w / 2, h * 0.09 + 30);

      const bg = bagGrid(w, h);
      const bw = bg.bw, gap = bg.gap, gx = bg.gx, gy = bg.gy;
      for (let i = 0; i < ITEMS.length; i++) {
        const it = ITEMS[i];
        const r = Math.floor(i / 3), c = i % 3;
        const x = gx + c * (bw + gap), y = gy + r * (bw + gap);
        const n = bagCount(it.id);
        const owned = n > 0;
        const eq = (save.equipped === it.id);
        ctx.save();
        ctx.globalAlpha = owned ? 1 : 0.40;
        ctx.fillStyle = eq ? 'rgba(255,210,74,0.20)' : 'rgba(255,255,255,0.09)';
        roundRect(x, y, bw, bw, 14); ctx.fill();
        ctx.strokeStyle = RARITY_COLOR[it.rarity];
        ctx.lineWidth = eq ? 3.6 : 2;
        roundRect(x, y, bw, bw, 14); ctx.stroke();
        ctx.font = (bw * 0.32).toFixed(0) + 'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText(it.icon, x + bw / 2, y + bw * 0.33);
        ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText(it.name, x + bw / 2, y + bw * 0.60);
        ctx.font = '12px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = owned ? 'rgba(255,255,255,0.82)' : 'rgba(255,255,255,0.55)';
        ctx.fillText(owned ? ('×' + n) : '未获得', x + bw / 2, y + bw * 0.78);
        ctx.font = '10px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = RARITY_COLOR[it.rarity];
        ctx.fillText(RARITY_NAME[it.rarity], x + bw / 2, y + bw * 0.92);
        ctx.restore();
        if (eq) {
          ctx.fillStyle = '#ffd24a';
          roundRect(x + bw - 52, y + 6, 46, 20, 10); ctx.fill();
          ctx.fillStyle = '#6b4a00';
          ctx.font = 'bold 11px "PingFang SC","Microsoft YaHei",sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('已装备', x + bw - 29, y + 16);
        }
      }
      // 底部说明：网格下沿再往下 22px，正好落在「返回」按钮上方的预留区里
      const capY = gy + 3 * bw + 2 * gap + 22;
      const cur = ITEM_BY_ID[save.equipped];
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (cur) {
        ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = '#ffd24a';
        ctx.fillText('已选：' + cur.icon + ' ' + cur.name + ' — ' + cur.desc, w / 2, capY);
      } else {
        ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.fillText('不带道具也能跑，带了更轻松', w / 2, capY);
      }
    }

    /* ---------- 签到界面 ---------- */
    /* ---------- 改装工坊（借鉴《合成竞速之王》的零件合成循环） ---------- */
    /* 几何函数必须被 drawGarage 和 overlayLayout 共用 —— 两处各算一遍是"画的和点的
     * 对不上"这类 bug 的经典来源（背包界面已经踩过一次这个坑）。 */
    function garageLayout(w, h) {
      const topY = h * 0.183;
      const bottomY = h - 86;          // 给底部「一键合成 / 返回」留出空间
      const n = PART_SLOTS.length;
      const gap = 8;
      const rowH = Math.max(44, (bottomY - topY - gap * (n - 1)) / n);
      const rows = [];
      for (let i = 0; i < n; i++) rows.push({ x: 12, y: topY + i * (rowH + gap), w: w - 24, h: rowH });
      // 每行右侧的两个操作键几何（买 / 合成），draw 与 hit 共用
      const bw = 46, bgap = 6;
      for (const r of rows) {
        const bh = Math.max(26, Math.min(34, r.h - 20));
        r.btnW = bw; r.btnH = bh;
        r.buyX = r.x + r.w - (bw * 2 + bgap) - 10;
        r.mergeX = r.buyX + bw + bgap;
        r.btnY = r.y + (r.h - bh) / 2;
      }
      return { rows: rows, rowH: rowH, gap: gap, btnGap: bgap };
    }
    function partBonusText(s) {
      const lv = partBestLv(s.id);
      if (!lv) return s.desc + ' 未升级';
      return s.desc + ' +' + Math.round(Math.abs(s.per) * lv * 100) + '%';
    }
    function partInvText(s) {
      const arr = [];
      for (let q = 1; q <= PART_MAX_LV; q++) { const c = partCount(s.id, q); if (c > 0) arr.push(PART_LV_NAME[q] + '×' + c); }
      return arr.length ? arr.join(' ') : '暂无零件';
    }
    function drawGarage(w, h) {
      /* 顶部区高度按画布高自适应。
       * 横屏画布只有 ~506 高，用 h*0.086 这种比例算出来的行距只有 10px，
       * 标题、金币、说明会叠在一起；改成"固定行高 + 上限"就能在两种比例下都稳。 */
      const tSize = h < 620 ? 26 : 30;
      const yTitle = Math.max(30, h * 0.072);
      const yInfo = yTitle + tSize * 0.95;
      const yHint = yInfo + 20;
      gradientTitle('🔧 改装工坊', w / 2, yTitle, tSize);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = '#ffd24a';
      ctx.fillText('🪙 ' + (save.coins | 0), w / 2 - 62, yInfo);
      ctx.fillStyle = '#7afcff';
      ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('每个零件 ' + PART_PRICE + ' 🪙 · 强度 ' + garagePower() + '/' + (PART_MAX_LV * PART_SLOTS.length), w / 2 + 66, yInfo);
      ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillText('两个同级零件 = 合出高一级 · 等级越高跑得越快', w / 2, yHint);

      const gl = garageLayout(w, h);
      for (let i = 0; i < PART_SLOTS.length; i++) {
        const s = PART_SLOTS[i];
        const r = gl.rows[i];
        const lv = partBestLv(s.id);
        const maxed = lv >= PART_MAX_LV;

        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        roundRect(r.x, r.y, r.w, r.h, 12); ctx.fill();
        ctx.strokeStyle = maxed ? '#ffd24a' : (lv ? 'rgba(255,255,255,0.24)' : 'rgba(255,255,255,0.12)');
        ctx.lineWidth = maxed ? 2 : 1;
        roundRect(r.x, r.y, r.w, r.h, 12); ctx.stroke();
        // 左侧色条：5 个部位一眼区分
        ctx.fillStyle = s.tint;
        roundRect(r.x + 8, r.y + 10, 5, r.h - 20, 2.5); ctx.fill();

        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.font = '18px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText(s.icon, r.x + 20, r.y + r.h * 0.35);

        ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
        const nameW = ctx.measureText(s.name).width;
        ctx.fillStyle = '#fff';
        ctx.fillText(s.name, r.x + 46, r.y + r.h * 0.35);
        if (lv > 0) {
          ctx.fillStyle = s.tint;
          roundRect(r.x + 46 + nameW + 7, r.y + r.h * 0.35 - 9, 32, 18, 9); ctx.fill();
          ctx.fillStyle = '#12101f';
          ctx.font = 'bold 11px "PingFang SC","Microsoft YaHei",sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(PART_LV_NAME[lv], r.x + 46 + nameW + 23, r.y + r.h * 0.35);
          ctx.textAlign = 'left';
        }
        // 第二行：加成 + 库存。裁切防溢出——窄屏上宁可截断也不能糊成一团。
        const textRight = r.buyX - 8;
        ctx.save();
        ctx.beginPath();
        ctx.rect(r.x + 46, r.y + r.h * 0.50, Math.max(20, textRight - r.x - 46), r.h * 0.46);
        ctx.clip();
        ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = lv ? 'rgba(122,252,255,0.92)' : 'rgba(255,255,255,0.42)';
        ctx.fillText(partBonusText(s) + '  ·  ' + partInvText(s), r.x + 46, r.y + r.h * 0.73);
        ctx.restore();

        // 「买」按钮：金币不够时变灰（仍然可点，点了给出提示，避免"点了没反应"的困惑）
        const afford = (save.coins | 0) >= PART_PRICE;
        ctx.fillStyle = maxed ? 'rgba(255,255,255,0.10)' : (afford ? '#ffd24a' : 'rgba(255,255,255,0.16)');
        roundRect(r.buyX, r.btnY, r.btnW, r.btnH, r.btnH / 2); ctx.fill();
        ctx.textAlign = 'center';
        ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillStyle = maxed ? 'rgba(255,255,255,0.4)' : (afford ? '#12101f' : 'rgba(255,255,255,0.55)');
        ctx.fillText(maxed ? '满级' : '买', r.buyX + r.btnW / 2, r.btnY + r.btnH / 2);

        // 「合成」按钮：只有真的能合才高亮，不可合时压暗 —— 让可操作性自己说话
        const canM = canMerge(s.id, lv);
        ctx.fillStyle = canM ? '#7afcff' : 'rgba(255,255,255,0.13)';
        roundRect(r.mergeX, r.btnY, r.btnW, r.btnH, r.btnH / 2); ctx.fill();
        ctx.fillStyle = canM ? '#12101f' : 'rgba(255,255,255,0.42)';
        ctx.fillText('合成', r.mergeX + r.btnW / 2, r.btnY + r.btnH / 2);
        ctx.textAlign = 'left';
      }
    }

    function drawOverlayButtons() {
      overlayLayout();
      for (const b of overlayButtons) {
        if (b.hidden) continue;
        const g = ctx.createLinearGradient(b.x, b.y, b.x + b.w, b.y + b.h);
        if (b.secondary) {
          g.addColorStop(0, 'rgba(255,255,255,0.24)'); g.addColorStop(0.5, 'rgba(255,255,255,0.12)'); g.addColorStop(1, 'rgba(255,255,255,0.07)');
        } else {
          g.addColorStop(0, '#ffb84d'); g.addColorStop(0.5, '#ff7f95'); g.addColorStop(1, '#ff5e87');
        }
        ctx.save();
        // 外白描边（立体糖果按钮）
        ctx.fillStyle = '#ffffff';
        roundRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4, (b.h + 4) / 2); ctx.fill();
        ctx.shadowColor = b.secondary ? 'rgba(0,0,0,0.3)' : 'rgba(255,90,120,0.4)';
        ctx.shadowBlur = b.secondary ? 8 : 14;
        ctx.shadowOffsetY = b.secondary ? 2 : 3;
        ctx.fillStyle = g;
        roundRect(b.x, b.y, b.w, b.h, b.h / 2); ctx.fill();
        ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
        // 顶部高光
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        roundRect(b.x + 8, b.y + 3, b.w - 16, b.h * 0.34, (b.h * 0.34) / 2); ctx.fill();
        // 图标清理：🎬 前缀替换为播放三角
        let label = b.label;
        const hasPlay = label.indexOf('🎬') === 0;
        if (hasPlay) label = label.slice(2);
        if (hasPlay) {
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.moveTo(b.x + 16, b.y + b.h / 2 - 6);
          ctx.lineTo(b.x + 16, b.y + b.h / 2 + 6);
          ctx.lineTo(b.x + 24, b.y + b.h / 2);
          ctx.closePath(); ctx.fill();
        }
        ctx.font = 'bold ' + (b.h * 0.36).toFixed(0) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = 'rgba(140,50,60,0.3)'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
        const tx = b.x + b.w / 2 + (hasPlay ? 6 : 0);
        ctx.strokeText(label, tx, b.y + b.h / 2 + 1);
        ctx.fillText(label, tx, b.y + b.h / 2 + 1);
        ctx.restore();
      }
    }

    function drawToast() {
      if (bannerT <= 0 || !bannerMsg) return;
      const w = view.w;
      ctx.save();
      ctx.globalAlpha = clamp(bannerT / 0.4, 0, 1);
      ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
      const tw = ctx.measureText(bannerMsg).width + 40;
      // 提示条垂直位置：
      //   有 HUD 的界面 → 紧贴 HUD 下沿（HUD 是固定像素高度，所以这里也必须写死像素，
      //     早期用 h*0.22 在横屏正好等于 112 所以看着没问题，一到竖屏 h 变大就掉到
      //     258 以下，直接压住背包/任务列表的第一行）
      //   无 HUD 的界面（封面/结算）→ 直接占顶部。结算界面必须走顶部——它的
      //     「关卡通过！」大标题就在 0.20 高度，提示条若还停在中间会正好盖住标题。
      const hasHud = !isMenuState(state) && state !== 'room' && state !== 'cleared';
      /* 封面竖屏要再往下让一让：y=22 会横穿右上角的金币胶囊（y=14~44）。
       * 竖屏封面在胶囊下方、标题上方有一段空白，正好收留提示条；
       * 横屏高度太紧没有这段空白，维持原位。 */
      const ty = hasHud ? 112 : ((state === 'cover' && view.portrait) ? 70 : 22);
      ctx.fillStyle = 'rgba(18,14,28,0.86)';
      roundRect(w / 2 - tw / 2, ty, tw, 40, 20); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(bannerMsg, w / 2, ty + 20);
      ctx.restore();
    }

    /* =========================================================================
     * 11. 输入处理
     * ====================================================================== */
    function hitButtons(x, y) {
      // 覆盖层按钮优先
      overlayLayout();
      for (const b of overlayButtons) {
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
      }
      if (state === 'playing') {
        layoutButtons();
        for (const b of touchButtons) {
          const dx = x - b.x, dy = y - b.y;
          if (dx * dx + dy * dy <= b.r * b.r) return b;
        }
      }
      return null;
    }

    /* 覆盖层按钮的触发语义
     * ---------------------------------------------------------------------
     * 只有「左 / 右 / 跳」三个虚拟按键是"按住生效"，其余全部是"按下即触发"。
     * 早期这里维护过一份 TAP_ACTIONS 白名单，结果是每新增一个入口按钮都得记得
     * 手工登记，漏登记就会出现「按钮点了没反应」——「免费道具」入口就是这样阵亡的。
     * 现在改成白名单的反面：默认全部按下即触发，只把三个方向键显式排除。
     * 以后再加按钮，天然就是可点的，不会再踩同一个坑。 */
    function onPointerDown(x, y, id) {
      const b = hitButtons(x, y);
      if (!b) return;
      pointerMap.set(id, b);
      if (b.hidden) {
        // 封面宠物卡：直接选宠开跑（无抬起也能响应）
        handleButtonAction(b.id);
        return;
      }
      if (b.id === 'left') { touchState.left = true; syncInput(); return; }
      if (b.id === 'right') { touchState.right = true; syncInput(); return; }
      if (b.id === 'jump') { touchState.jump = true; jumpBuffer = BUFFER; jumpHeld = true; syncInput(); return; }
      // 其余按钮：按下即响应，pointerup 只做清理
      handleButtonAction(b.id);
      pointerMap.set(id, { id: '__consumed__' });
    }

    function onPointerMove(x, y, id) {
      const cur = pointerMap.get(id);
      if (!cur) return;
      const b = hitButtons(x, y);
      if (!b || b.id !== cur.id) {
        releasePointer(id);
        const nb = hitButtons(x, y);
        if (nb) onPointerDown(x, y, id);
      }
    }

    function releasePointer(id) {
      const b = pointerMap.get(id);
      if (!b) return;
      pointerMap.delete(id);
      if (b.id === 'left') touchState.left = false;
      else if (b.id === 'right') touchState.right = false;
      else if (b.id === 'jump') touchState.jump = false;
      syncInput();
    }

    function onPointerUp(x, y, id) {
      const b = pointerMap.get(id);
      // 按下时已经触发过（tap 型按钮）→ 抬起只清理，绝不重复触发
      if (b && b.id === '__consumed__') { pointerMap.delete(id); return; }
      if (b) {
        // 持续按下按钮（左/右/跳）→ 抬起时释放
        releasePointer(id);
        return;
      }
      // 兜底：手指按下时落空（例如从按钮外滑入）→ 抬起命中即触发
      pointerMap.delete(id);
      const hit = hitButtons(x, y);
      if (hit && hit.id !== 'left' && hit.id !== 'right' && hit.id !== 'jump') handleButtonAction(hit.id);
    }

    function handleButtonAction(id) {
      sfx.play('click');
      if (id.indexOf('pet:') === 0) {
        const pid = id.slice(4);
        const p = PETS.find(q => q.id === pid);
        if (!p) return;
        if ((save.gifts | 0) < p.need) { toast('还需 ' + (p.need - (save.gifts | 0)) + ' 🎁 解锁'); return; }
        pet = p;
        startRun();
        return;
      }
      if (id.indexOf('item:') === 0) {
        // 背包：点一下携带，再点一下取消。下一关开局生效并消耗 1 个。
        const iid = id.slice(5);
        const it = ITEM_BY_ID[iid];
        if (!it) return;
        if (bagCount(iid) <= 0) { toast('还没有「' + it.name + '」，通关就会掉落～'); return; }
        save.equipped = (save.equipped === iid) ? '' : iid;
        persist();
        sfx.play(save.equipped ? 'item' : 'click');
        toast(save.equipped ? ('下一关携带：' + it.icon + ' ' + it.name) : '已取消携带');
        return;
      }
      /* ---- 改装工坊：买零件 / 合成 ---- */
      if (id.indexOf('buy:') === 0) {
        const sid = id.slice(4);
        const s = PART_BY_ID[sid];
        if (!s) return;
        if ((save.coins | 0) < PART_PRICE) { toast('金币不够，再跑几关就有啦～'); return; }
        buyPart(sid);
        sfx.play('coin');
        toast(s.icon + ' ' + s.name + ' Ⅰ 到手！两个同级就能合成');
        return;
      }
      if (id.indexOf('merge:') === 0) {
        const sid = id.slice(6);
        const s = PART_BY_ID[sid];
        if (!s) return;
        const lv = partBestLv(sid);
        if (lv >= PART_MAX_LV) { toast(s.name + ' 已经是满级啦！'); return; }
        if (!canMerge(sid, lv)) {
          if (partOwned(sid) === 0) { toast('还没有 ' + s.name + ' 零件，先买一个吧'); return; }
          // 提示要具体到"还差几个"，不然玩家只能猜
          const have = partCount(sid, lv);
          toast(s.name + ' ' + PART_LV_NAME[lv] + ' 还差 ' + (2 - have) + ' 个才能合成');
          return;
        }
        mergeOne(sid, lv);
        sfx.play('merge');
        spawnBurst(view.w / 2, view.h * 0.35, s.tint, 26);
        toast('合成成功！' + s.name + ' → ' + PART_LV_NAME[lv + 1]);
        return;
      }
      switch (id) {
        case 'mode': {
          const cur = curMode();
          const nx = MODES[(MODES.indexOf(cur) + 1) % MODES.length];
          setMode(nx.id);
          sfx.play('click');
          // 提示条刻意短：它在封面顶部居中，太长会横穿左上那枚「段位」胶囊。
          // 详细的档位说明交给徽章本身和结算界面，不占提示条。
          toast(nx.icon + ' ' + nx.name + '模式 · ' + nx.desc);
          break;
        }
        case 'endless': startEndless(); break;
        case 'bag': state = 'bag'; sfx.play('click'); break;
        case 'pause':
          if (state === 'playing') { state = 'paused'; stopBgm(); sfx.play('click'); }
          break;
        case 'resume': state = 'playing'; startBgm(); break;
        case 'restart': generateLevel(level); state = 'playing'; break;
        case 'retry': refreshItemEffects(); generateLevel(level); revivesUsed = 0; runGifts = 0; state = 'playing'; break;
        case 'home':
          state = 'cover'; runGifts = 0; revivesUsed = 0;
          petAction = ''; pendingUnlock = null; stopBgm();
          dailyMode = false; rng = Math.random;
          endlessMode = false;   // 回首页即退出无尽模式，下次点宠物走正常闯关
          break;
        case 'scores': state = 'scores'; sfx.play('click'); break;
        case 'achievements': state = 'achievements'; sfx.play('click'); break;
      case 'daily': state = 'daily'; sfx.play('click'); break;
        case 'dailyStart': enterDaily(); break;
        case 'sign':
          state = 'sign'; sfx.play('click'); break;
        case 'chest':
          state = 'chest'; sfx.play('click'); break;
        case 'quest':
          state = 'quest'; sfx.play('click'); break;
        case 'freeItem':
          state = 'freeItem'; sfx.play('click'); break;
        case 'garage':
          state = 'garage'; sfx.play('click'); break;
        case 'idle': {
          // 离线收益：进游戏时就已到账（见 createGame 的启动结算），
          // 所以这里只负责把待收的那份也领掉，绝不重复发放。
          const got = collectIdle(1);
          if (got > 0) { sfx.play('coin'); toast('快递站收货 +' + got + ' 🪙'); }
          else { toast('包裹还在路上，跑几关再来～'); }
          break;
        }
        case 'mergeAll': {
          const n = mergeAll();
          if (n > 0) {
            sfx.play('merge');
            spawnBurst(view.w / 2, view.h * 0.35, '#7afcff', 34);
            toast('一键合成 ' + n + ' 次！零件全面升级');
          } else { toast('暂时没有能合成的零件（需要两个同级的）'); }
          break;
        }
        case 'back': state = 'cover'; sfx.play('click'); dailyMode = false; rng = Math.random; break;
        case 'revive': reviveByAd(); break;
        case 'double': doubleRewardByAd(); break;
        case 'next': level++; runGifts = 0; revivesUsed = 0; refreshRevives(); pendingUnlock = null; prepareRunItem(); generateLevel(level); state = 'playing'; break;
        case 'room':
          // 意见②：大房子建成后回小屋休息
          state = 'room'; petAction = ''; stopBgm(); sfx.play('rev');
          break;
        case 'keepgoing':
          // 意见②：休息完继续闯关
          level++; runGifts = 0; revivesUsed = 0; pendingUnlock = null;
          prepareRunItem(); generateLevel(level); state = 'playing';
          break;
        case 'tv': case 'eat': case 'sleep': {
          // 意见②：小屋里点什么，宠物就干什么
          petAction = id;
          if (id === 'eat') { sfx.play('coin'); spawnBurst(view.w * 0.55, view.h * 0.60 + 20, '#fff4d6', 10); }
          if (id === 'sleep') sfx.play('fall');
          if (id === 'tv') sfx.play('click');
          if (!roomVisitUsed) { roomVisitUsed = true; toast('休息好了点「继续闯关」出发！'); }
          break;
        }
        case 'wearHat': cycleSlot('hat'); break;
        case 'wearGlass': cycleSlot('glasses'); break;
        case 'wearNeck': cycleSlot('neck'); break;
        case 'music': case 'sound': {
          const m = !sfx.isMuted();
          sfx.setMuted(m);
          toast(m ? '🔇 已静音' : '🔊 声音开启');
          break;
        }
      }
    }
    function refreshRevives() { return 0; }

    /* 意见②：换装循环——点一次切到该部位的下一件已拥有装饰（含「不戴」） */
    function accName(id) {
      for (const a of ACCESSORIES) if (a.id === id) return a.name;
      return '';
    }
    function cycleSlot(slot) {
      const owned = ACCESSORIES.filter(function (a) { return a.slot === slot && save.acc.indexOf(a.id) >= 0; });
      const cur = save.eq[slot] || '';
      let idx = -1;
      for (let i = 0; i < owned.length; i++) if (owned[i].id === cur) idx = i;
      const next = (idx + 1 < owned.length) ? owned[idx + 1].id : '';
      save.eq[slot] = next;
      persist();
      sfx.play('click');
      toast(next ? '穿上' + accName(next) + '！' : '脱下来了');
    }

    function syncInput() {
      input.left = keyState.left || touchState.left;
      input.right = keyState.right || touchState.right;
      input.jump = keyState.jump || touchState.jump;
    }

    function onKeyDown(code) {
      if (code === 'ArrowLeft' || code === 'KeyA') { keyState.left = true; syncInput(); }
      else if (code === 'ArrowRight' || code === 'KeyD') { keyState.right = true; syncInput(); }
      else if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') {
        if (!keyState.jump) jumpBuffer = BUFFER;
        keyState.jump = true; jumpHeld = true; syncInput();
      }
      else if (code === 'Escape' || code === 'KeyP') {
        if (state === 'playing') { state = 'paused'; stopBgm(); }
        else if (state === 'paused') { state = 'playing'; startBgm(); }
      }
      else if (code === 'KeyR' && (state === 'dead' || state === 'playing')) {
        generateLevel(level); state = 'playing';
      }
      else if (code === 'Enter') {
        if (state === 'cover') startRun();
        else if (state === 'dead') { generateLevel(level); revivesUsed = 0; runGifts = 0; state = 'playing'; }
        else if (state === 'cleared') { level++; runGifts = 0; revivesUsed = 0; prepareRunItem(); generateLevel(level); state = 'playing'; }
      }
    }
    function onKeyUp(code) {
      if (code === 'ArrowLeft' || code === 'KeyA') { keyState.left = false; syncInput(); }
      else if (code === 'ArrowRight' || code === 'KeyD') { keyState.right = false; syncInput(); }
      else if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') { keyState.jump = false; syncInput(); }
    }

    /* =========================================================================
     * 12. 流程控制
     * ====================================================================== */
    /* 无尽冲刺开局。与 startRun 的差别只有三件事：
     *   ① endlessMode = true —— 让 generateLevel 走"无终点"分支；
     *   ② level 固定 1 —— 无尽没有关卡号，难度由距离驱动（见 endlessTierLv）；
     *   ③ 清空里程 / 档位 / 里程碑状态。
     * 其余（道具消耗、任务追踪、BGM）与普通开局完全一致，避免两套流程各自漂移。 */
    function startEndless() {
      endlessMode = true;
      level = 1;
      runGifts = 0;
      revivesUsed = 0;
      runClean = true;
      pendingUnlock = null;
      petAction = '';
      dailyMode = false;
      rng = Math.random;
      endlessDist = 0;
      endlessGenX = 0;
      endlessTier = 0;
      endlessRock = 0;
      endlessNewBest = false;
      questRuns = 0;
      questGiftCount = 0;
      if (!save.questRuns) save.questRuns = 0;
      prepareRunItem();            // 道具：消耗背包 1 件并注入本关效果
      generateLevel(1);
      state = 'playing';
      sfx.play('click');
      toast('♾ 无尽冲刺开始！跑得越远，奖励越多');
    }

    function startRun() {
      endlessMode = false;         // 点宠物 = 正常闯关（无尽模式必须显式切换）
      level = 1;
      runGifts = 0;
      revivesUsed = 0;
      runClean = true;             // 意见②：完美通关攒房子，重开一关重新计
      pendingUnlock = null;
      petAction = '';
      dailyMode = false;           // 正常模式：真随机
      rng = Math.random;
      // 重置任务进度追踪
      questRuns = 0;
      questGiftCount = 0;
      if (!save.questRuns) save.questRuns = 0;
      prepareRunItem();            // 道具：消耗背包 1 件并注入本关效果
      generateLevel(level);
      state = 'playing';
      sfx.play('click');
    }

    /* ---------- 每日挑战（留存系统）：固定日期 seed 关卡 ---------- */
    function todayKey() {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return '' + d.getFullYear() + m + dd;
    }
    function enterDaily() {
      dailyMode = true;
      dailyKey = todayKey();
      rng = seededRng(hashStr(dailyKey));
      level = 1;
      runGifts = 0; revivesUsed = 0; runClean = true;
      pendingUnlock = null; petAction = '';
      // 每日挑战禁用道具：全球同关冲分，带道具会直接破坏排行榜公平性
      shieldLeft = 0; magnetLeft = 0; boostLeft = 0; equippedItem = '';
      generateLevel(1);            // 今天所有人同一关（seed 决定）
      state = 'playing';
      sfx.play('click');
      toast('今日挑战：冲最高分！');
    }

    /* =========================================================================
     * 13. 主循环（固定步长 + 帧率无关的累加器）
     * ====================================================================== */
    let acc = 0;
    let lastT = 0;
    let tickErrLogged = 0;   // 异常日志限流：只打印前几次，避免每帧刷屏
    function tick(nowMs) {
      if (!lastT) lastT = nowMs;
      let dt = (nowMs - lastT) / 1000;
      lastT = nowMs;
      if (dt > 0.25) dt = 0.25;
      acc += dt;
      let steps = 0;
      while (acc >= FIXED_DT && steps < MAX_STEPS) {
        // 关键：逻辑帧异常必须就地吞掉。此前一次未捕获的 ReferenceError 会让异常
        // 冲出 rAF 回调 → requestAnimationFrame 不再被调用 → 整局游戏永久卡死不动。
        try { step(); }
        catch (e) { if (tickErrLogged++ < 5) console.error('[pet-adventure] step error:', e); }
        acc -= FIXED_DT;
        steps++;
      }
      if (steps >= MAX_STEPS) acc = 0;
      if (player) player.animT += dt;
      try { render(); }
      catch (e) { if (tickErrLogged++ < 5) console.error('[pet-adventure] render error:', e); }
    }

    /* =========================================================================
     * 14. 对外接口
     * ====================================================================== */
    resize(deps.viewport.width, deps.viewport.height, deps.viewport.dpr);
    generateLevel(1);
    state = 'cover';

    /* 回访欢迎：把"离线收益"这件事主动告诉玩家一次。
     * 如果只是静静躺在卡片上，大部分玩家永远不会注意到自己有一笔钱待领 ——
     * 离线收益的留存价值全在"回来就有收获"这个瞬间被感知到。 */
    if (idlePending().coins > 0) {
      const p = idlePending();
      const mins = Math.floor(p.sec / 60);
      const dur = mins >= 60 ? (Math.floor(mins / 60) + ' 小时') : (mins + ' 分钟');
      setTimeout(function () {
        toast('📦 你不在的 ' + dur + ' 里，快递站赚了 ' + p.coins + ' 🪙，点封面卡片领取～');
      }, 600);
    }

    return {
      tick: tick,
      resize: resize,
      getView: function () { return view; },
      pause: function () { if (state === 'playing') state = 'paused'; },
      onPointerDown: onPointerDown,
      onPointerMove: onPointerMove,
      onPointerUp: onPointerUp,
      onKeyDown: onKeyDown,
      onKeyUp: onKeyUp,
      getState: function () { return state; },
      // 调试 / 自动化测试用
      debug: {
        jumpToLevel: function (n) { level = n; runGifts = 0; revivesUsed = 0; runClean = true; generateLevel(n); state = 'playing'; },
        getPlayer: function () { return player; },
        getLevel: function () { return { level: level, width: levelWidth, platforms: platforms, hazards: hazards, stars: stars, goal: goal, maxGap: lastMaxGap }; },
        getSave: function () { return save; },
        /* 暴露当前界面所有按钮的几何 + 中心点。
         * 为什么值得暴露：自动化测试如果自己硬编码坐标，一旦布局微调就全红，

<script data-page-node-id="pyjL30A4atJ6PZCkE4NOW5" data-pnid-children="FNPQWK83sxhqTDSq0CEllw">/* =============================================================================
 * Web 启动器：创建画布、绑定输入、驱动主循环
 * ========================================================================== */
(function (global) {
  'use strict';
  const doc = global.document;

  const PREVENT_KEYS = {
    Space: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1,
  };

  function boot() {
    const wrap = doc.getElementById('stage');
    const canvas = doc.getElementById('game');
    const ctx = canvas.getContext('2d');
    const sfx = global.PlatformWeb.createSfx();
    const ads = global.PlatformWeb.createAds();
    const vibrate = global.PlatformWeb.vibrate;

    let game = null;
    let audioUnlocked = false;

    function currentSize() {
      const r = wrap.getBoundingClientRect();
      return { width: Math.max(1, Math.round(r.width)), height: Math.max(1, Math.round(r.height)) };
    }

    function safeInsets() {
      const el = doc.getElementById('safeProbe');
      let b = 0;
      if (el && global.getComputedStyle) {
        const v = parseFloat(global.getComputedStyle(el).paddingBottom);
        if (!isNaN(v)) b = v;
      }
      return { bottom: b, top: 0 };
    }

    function applySize() {
      const s = currentSize();
      const dpr = Math.min(global.devicePixelRatio || 1, 2.5);
      canvas.style.width = s.width + 'px';
      canvas.style.height = s.height + 'px';
      canvas.width = Math.round(s.width * dpr);
      canvas.height = Math.round(s.height * dpr);
      if (game) game.resize(s.width, s.height, dpr, safeInsets());
    }

    function toLogicalX(clientX) {
      const r = canvas.getBoundingClientRect();
      const v = game.getView();
      return (clientX - r.left) / v.scale;
    }
    function toLogicalY(clientY) {
      const r = canvas.getBoundingClientRect();
      const v = game.getView();
      return (clientY - r.top) / v.scale;
    }

    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      sfx.unlock();
    }

    /* ---------- 输入 ---------- */
    canvas.addEventListener('pointerdown', function (e) {
      unlockAudio();
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      game.onPointerDown(toLogicalX(e.clientX), toLogicalY(e.clientY), e.pointerId);
      e.preventDefault();
    }, { passive: false });

    global.addEventListener('pointermove', function (e) {
      game.onPointerMove(toLogicalX(e.clientX), toLogicalY(e.clientY), e.pointerId);
    });

    global.addEventListener('pointerup', function (e) {
      game.onPointerUp(toLogicalX(e.clientX), toLogicalY(e.clientY), e.pointerId);
    });

    global.addEventListener('pointercancel', function (e) {
      game.onPointerUp(toLogicalX(e.clientX), toLogicalY(e.clientY), e.pointerId);
    });

    global.addEventListener('keydown', function (e) {
      unlockAudio();
      if (PREVENT_KEYS[e.code]) e.preventDefault();
      game.onKeyDown(e.code);
    });
    global.addEventListener('keyup', function (e) {
      game.onKeyUp(e.code);
    });

    // 阻止移动端页面滚动 / 双击缩放 / 长按菜单
    doc.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    doc.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    // 切到后台自动暂停，回来不会因为累加器爆炸而瞬移
    doc.addEventListener('visibilitychange', function () {
      if (doc.hidden && game.getState() === 'playing') game.pause();
    });

    global.addEventListener('resize', applySize);
    global.addEventListener('orientationchange', function () {
      global.setTimeout(applySize, 220);
    });

    /* ---------- 启动 ---------- */
    const s0 = currentSize();
    game = global.PetAdventure.createGame({
      ctx: ctx,
      storage: global.PlatformWeb.storage,
      sfx: sfx,
      ads: ads,
      vibrate: vibrate,
      viewport: { width: s0.width, height: s0.height, dpr: Math.min(global.devicePixelRatio || 1, 2.5) },
    });
    applySize();

    const loading = doc.getElementById('loading');
    if (loading && loading.parentNode) loading.parentNode.removeChild(loading);

    function frame(t) {
      // 兜底：即使 tick 内部出现意外异常，也必须把下一帧排上，绝不让循环断掉
      try { game.tick(t); } catch (e) { /* 内部已限流打印，这里只保证循环存活 */ }
      global.requestAnimationFrame(frame);
    }
    global.requestAnimationFrame(frame);

    // 供自动化测试使用
    global.__game = game;
  }

  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
