<script data-page-node-id="SIxNNeFfAVa9HW7rJqkPOq" data-pnid-children="lr4oRrhUDzr6HJgkjt2iBl">/* =============================================================================

  // 障碍定义。solid=true 表示实体阻挡（撞上被挡住不扣血），dmg=true 表示扣血。

  // 装饰品（意见②）：礼物攒到 need 即解锁。确定性解锁表——孩子数着礼物就能

  /* ---------- 道具表：礼物从"计数"升级成"下一关能用的工具" ----------
   * 用户诉求③：通关拿到的礼物应该是不同的工具，例如交通工具，下一关可以使用。

  const ITEMS = [

      vmax: 7.2, jump: 11.6, accel: 0.52, brake: 0.900, accent: '#cc5de8' },
    { id: 'cloud',   name: '筋斗云',   icon: '☁️', rarity: 3, kind: 'vehicle', desc: '传说级：跳最高还跑得快',
      vmax: 6.0, jump: 15.5, accel: 0.50, brake: 0.900, accent: '#74c0fc' },
  ];
  const ITEM_BY_ID = {};
  for (const it of ITEMS) ITEM_BY_ID[it.id] = it;
  const RARITY_COLOR = [null, '#b9c6d6', '#4dabf7', '#cc5de8'];
  const RARITY_NAME  = [null, '普通',    '稀有',    '史诗'];

  /* ===========================================================================
   * 留存与变现钩子（成人也要爱玩 + 广告位设计）
   * 四条钩子各自解决一个留存问题：

  const SIGN_REWARDS = [

  const RANKS = [

  function rankOf(total) {
    let r = RANKS[0];

  }
  function nextRankOf(total) {

  // 宝箱：等一会儿就能白开，等不及就看广告秒开。

  /* ===========================================================================
   * 3. 小工具

  // 可替换随机源（每日挑战用日期 seed 固定关卡；普通模式用真随机）
  let rng = Math.random;
  function seededRng(seed) {
    let s = (seed >>> 0) || 1;
    return function () {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      return s / 0x7fffffff;
    };
  }
  function hashStr(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rand(a, b) { return a + rng() * (b - a); }
  function ri(a, b) { return Math.floor(a + rng() * (b - a + 1)); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }
  function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  /* ===========================================================================

  function createGame(deps) {
    const ctx = deps.ctx;
    const storage = deps.storage;

    const ads = deps.ads;
    const vibrate = deps.vibrate || function () {};

    /* ---------- 视口 / 坐标系 ---------- */
    // 逻辑坐标系：宽度固定为可视宽度，高度由屏幕比例推导。
    // 竖屏时可视宽度收窄（看得少但元素大），横屏时放宽。
    const view = { w: 900, h: 540, dpr: 1, scale: 1, portrait: false, pad: 120, safeBottom: 0 };

    function resize(width, height, dpr, insets) {
      const wantW = (height > width) ? 660 : 900;  // 竖屏 660 / 横屏 900 逻辑像素宽
      const scale = width / wantW;
      view.w = width / scale;
      view.h = height / scale;
      view.dpr = clamp(dpr || 1, 1, 2.5);
      view.scale = scale;
      view.portrait = view.h > view.w;
      const insetBottom = (insets && insets.bottom) || 0;
      view.safeBottom = insetBottom / scale;        // 刘海屏 / Home 指示条避让（逻辑像素）
      view.pad = view.portrait ? 300 : 122;         // 底部留给虚拟按键的逻辑高度
      ctx.setTransform(
        view.dpr * scale, 0, 0, view.dpr * scale, 0, 0
      );
      sky = null;   // 强制重建天空渐变缓存
      buildBackdrop();
    }

    /* ---------- 存档 ---------- */
    const SKEY = 'petadv.save.v1';
    const save = storage.get(SKEY, { best: 1, gifts: 0, pet: 'cat', runs: 0 });
    // 意见② 新字段：acc 已拥有的装饰品 id 列表 / eq 当前穿戴 / house 房子进度 0-3。
    // 留存系统字段：bestScore 单关最高分 / scores 排行榜 top10 / achievements 成就 / dailyBest 每日挑战。
    // 旧存档没有这些字段，这里统一补默认值（旧档不丢）。
    if (!Array.isArray(save.acc)) save.acc = [];
    if (!save.eq) save.eq = { hat: '', glasses: '', neck: '' };
    if (!save.house) save.house = 0;
    if (!save.bestScore) save.bestScore = 0;
    if (!Array.isArray(save.scores)) save.scores = [];
    if (!save.achievements) save.achievements = {};
    if (!save.dailyBest) save.dailyBest = {};
    // 道具系统：bag 是背包（itemId → 数量），equipped 是下一关要带的道具
    if (!save.bag || typeof save.bag !== 'object') save.bag = {};
    if (typeof save.equipped !== 'string') save.equipped = '';
    // 留存系统：签到 / 宝箱 / 每日任务 / 累计分（段位） / 免费道具冷却
    if (!save.sign || typeof save.sign !== 'object') save.sign = { last: '', streak: 0, total: 0 };
    if (!Array.isArray(save.chests)) save.chests = [];
    if (!save.quests || typeof save.quests !== 'object') save.quests = { date: '', prog: {}, claimed: {} };
    if (!save.totalScore) save.totalScore = 0;
    if (!save.freeItemAt) save.freeItemAt = 0;
    function persist() { storage.set(SKEY, save); }

    /* ---------- 道具掉落与背包 ---------- */
    function itemWeight(it) { return it.rarity === 1 ? 60 : (it.rarity === 2 ? 26 : 8); }
    function rollItem(minRarity) {
      const cand = [];
      for (const it of ITEMS) if (it.rarity >= (minRarity || 1)) cand.push(it);
      let total = 0;
      for (const it of cand) total += itemWeight(it);
      let r = rng() * total;
      for (const it of cand) { r -= itemWeight(it); if (r <= 0) return it; }
      return cand[cand.length - 1] || ITEMS[0];
    }
    function grantItem(id, n) {
      save.bag[id] = (save.bag[id] | 0) + (n || 1);
      persist();
    }
    function bagCount(id) { return save.bag[id] | 0; }
    function bagTotal() {
      let n = 0;
      for (const k in save.bag) if (save.bag.hasOwnProperty(k)) n += save.bag[k] | 0;
      return n;
    }
    /* 消耗并生效一件携带的道具。返回 false 表示背包里没有了（自动卸下）。 */
    function consumeEquippedItem() {
      equippedItem = save.equipped || '';
      if (!equippedItem) return false;
      if (bagCount(equippedItem) <= 0) { save.equipped = ''; equippedItem = ''; persist(); return false; }
      save.bag[equippedItem] = bagCount(equippedItem) - 1;
      if (save.bag[equippedItem] <= 0) delete save.bag[equippedItem];
      persist();
      return true;
    }

    /* =========================================================================
     * 留存钩子实现：签到 / 任务 / 宝箱 / 免费道具
     * ====================================================================== */
    function keyOfDate(d) {
      return '' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    }
    function canSign() { return save.sign.last !== todayKey(); }
    function doSign() {
      if (!canSign()) return null;
      const yk = keyOfDate(new Date(Date.now() - 86400000));
      // 昨天签过 → 连签 +1；否则断签从 1 重来。连签奖励递增是"明天还要来"的动力。
      save.sign.streak = (save.sign.last === yk) ? (save.sign.streak | 0) + 1 : 1;
      if (save.sign.streak > SIGN_REWARDS.length) save.sign.streak = 1;   // 7 天一轮回
      save.sign.last = todayKey();
      save.sign.total = (save.sign.total | 0) + 1;
      const r = SIGN_REWARDS[(save.sign.streak - 1) % SIGN_REWARDS.length];
      if (r.item) grantItem(r.item, 1);
      else { save.gifts = (save.gifts | 0) + r.n; persist(); }
      // 签到额外送一个木质宝箱（增加每日登录动机）
      grantChest(0);
      return r;
    }

    function ensureQuests() {
      const tk = todayKey();
      if (save.quests.date !== tk) {
        save.quests = { date: tk, prog: {}, claimed: {} };
        persist();
      }
    }
    function bumpQuest(id, n) {
      ensureQuests();
      save.quests.prog[id] = (save.quests.prog[id] | 0) + (n || 1);
      persist();
    }
    function questProgress(q) { ensureQuests(); return Math.min(save.quests.prog[q.id] | 0, q.need); }
    function questDone(q) { ensureQuests(); return (save.quests.prog[q.id] | 0) >= q.need; }
    function questClaimed(q) { ensureQuests(); return !!save.quests.claimed[q.id]; }
    function claimQuest(q) {
      ensureQuests();
      if (!questDone(q) || questClaimed(q)) return false;
      save.quests.claimed[q.id] = 1;
      grantItem(q.rewardItem, q.rewardN);
      persist();
      return true;
    }
    function questsPending() {
      ensureQuests();
      let n = 0;
      for (const q of QUEST_DEFS) if (questDone(q) && !questClaimed(q)) n++;
      return n;
    }

    function chestReady(c) { return Date.now() - c.at >= CHESTS[c.t].wait * 1000; }
    function chestLeftSec(c) { return Math.max(0, Math.ceil((CHESTS[c.t].wait * 1000 - (Date.now() - c.at)) / 1000)); }
    function grantChest(ti) {
      if (save.chests.length >= 4) return false;
      save.chests.push({ t: ti, at: Date.now() });
      persist();
      return true;
    }
    function openChestAt(idx) {
      const c = save.chests[idx];
      if (!c) return null;
      const def = CHESTS[c.t];
      const got = [];
      for (let i = 0; i < def.items; i++) {
        const it = rollItem(def.minRarity);
        grantItem(it.id, 1);
        got.push(it);
      }
      save.chests.splice(idx, 1);
      persist();
      return got;
    }
    /* 开箱入口：到点直接开，没到点走激励视频秒开 —— 广告位之一 */
    function openChestFlow(idx) {
      const c = save.chests[idx];
      if (!c) return;
      if (chestReady(c)) { finishOpenChest(idx); return; }
      ads.showRewarded('chest', function (ok) {
        if (!ok) { toast('广告没看完，宝箱还得再等等'); return; }
        finishOpenChest(idx);
      });
    }
    function finishOpenChest(idx) {
      const got = openChestAt(idx);
      if (!got) return;
      sfx.play('open');
      let s = '';
      for (const it of got) s += it.icon + it.name + ' ';
      toast('开箱获得：' + s);
    }
    /* 看广告免费领一件稀有以上道具（4 小时冷却）—— 广告位之二 */
    function freeItemByAd() {
      const left = freeItemLeftMs();
      if (left > 0) { toast('冷却中，' + Math.ceil(left / 60000) + ' 分钟后可再领'); return; }
      ads.showRewarded('item', function (ok) {
        if (!ok) { toast('广告没看完'); return; }
        save.freeItemAt = Date.now();
        const it = rollItem(2);        // 保底稀有：一次广告的回报要看得见，否则没人点
        grantItem(it.id, 1);
        persist();
        sfx.play('item');
        toast('获得 ' + it.icon + ' ' + it.name + '！');
      });
    }
    function freeItemLeftMs() {
      return Math.max(0, FREE_ITEM_CD - (Date.now() - (save.freeItemAt || 0)));
    }

    /* ---------- 运行时状态 ---------- */
    let state = 'cover';   // cover | playing | paused | dead | cleared | ad
    let level = 1;
    let runGifts = 0;      // 本次挑战累计
    /* 道具系统（本次跑关内的生效状态）：
     * shieldLeft = 还能挡几次伤害；magnetLeft / boostLeft = 剩余生效帧数。
     * 由玩家开局携带的道具注入（见 startRun），关卡结束或返回封面时清零。
     * 只影响数值与渲染，不触碰碰撞盒 —— 和 PET_VIS_SCALE 同样的解耦思路。 */
    let shieldLeft = 0, magnetLeft = 0, boostLeft = 0;
    let equippedItem = '';   // 本次跑关携带的道具 id（'' 表示没带）
    let droppedItems = [];   // 本次通关掉落的道具（结算界面展示"你拿到了什么"）
    let pet = PETS[0];
    let vehicle = VEHICLES[0];
    let theme = THEMES[0];

    let player = null;
    let platforms = [];
    let hazards = [];
    let stars = [];        // 沿途小礼物
    let goal = null;       // 终点礼物箱
    let particles = [];
    let floaters = [];     // 飘字
    let levelWidth = 2600;
    let cameraX = 0, cameraY = 0;
    let shake = 0;
    let timeAcc = 0;
    let checkpoint = { x: 90, y: GROUND_BASE - 50 };
    let revivesUsed = 0;
    let comboCount = 0;    // 连续无伤吃星
    let runClean = true;   // 意见②：本关是否一次都没受伤（完美通关攒房子）
    let runScore = 0;      // 本关得分（评分系统）
    let runCombo = 0;      // 本关最大连击
    let runGrade = null;   // 本关评级 { g, color, label }（过关结算后写入）
    let dailyMode = false; // 每日挑战模式：用日期 seed 固定关卡
    let dailyKey = '';     // 今日日期 key（YYYYMMDD）
    let questRuns = 0;     // 本局累计通关次数（每日任务追踪）
    let questGiftCount = 0; // 本关收集礼物数（每日任务追踪）
    let coyote = 0, jumpBuffer = 0, jumpHeld = false, jumpFrames = 0;
    let screenFlash = 0;
    let bannerMsg = '';
    let bannerT = 0;
    let pendingUnlock = null;   // 意见②：本关开出的装饰品（cleared 界面展示）
    let petAction = '';         // 小屋动作：'' | tv | eat | sleep
    let roomVisitUsed = false;  // 本次 room 是否已触发过互动提示

    /* ---------- BGM 接线（意见③）：防御 stub sfx 没有这两个方法 ---------- */
    function startBgm(idx) {
      if (sfx && sfx.startBgm) { try { sfx.startBgm(idx); } catch (e) {} }
    }
    function stopBgm() {
      if (sfx && sfx.stopBgm) { try { sfx.stopBgm(); } catch (e) {} }
    }

    /* ---------- 评分 & 成就（留存系统） ---------- */
    // 分数构成：通关 100 + 每星 30 + 连击加成(combo-1)*5 + 无伤 50。
    // 满分 ≈ 255（全星+无伤+满连击）。评级映射：
    //   S ≥ 230  完美     A ≥ 180  太棒了   B ≥ 130  不错   C < 130  继续加油
    function gradeFor(score) {
      if (score >= 230) return { g: 'S', color: '#ffd24a', label: '完美！' };
      if (score >= 180) return { g: 'A', color: '#7afcff', label: '太棒了' };
      if (score >= 130) return { g: 'B', color: '#9af29a', label: '不错' };
      return { g: 'C', color: '#c9c9c9', label: '继续加油' };
    }
    let achievementToastT = 0;   // 成就解锁弹窗倒计时
    function unlockAchievement(id) {
      if (save.achievements[id]) return;
      save.achievements[id] = Date.now();
      const a = ACHIEVEMENTS.find(function (x) { return x.id === id; });
      if (a) { toast('成就解锁：' + a.icon + ' ' + a.name + '！'); }
      persist();
    }

    /* ---------- 输入 ---------- */
    const input = { left: false, right: false, jump: false };
    const keyState = { left: false, right: false, jump: false };
    const touchState = { left: false, right: false, jump: false };

    /* ---------- 背景装饰（视差层，世界坐标） ---------- */
    let backdrop = [];
    let sky = null;
    function buildBackdrop() {
      backdrop = [];
      const n = 26;
      for (let i = 0; i < n; i++) {
        backdrop.push({
          x: rand(-200, levelWidth + 200),
          y: rand(WORLD_TOP_VIS(), GROUND_BASE - 40),
          r: rand(14, 46),
          p: rand(0.18, 0.45),      // 视差系数
          k: rand(0, 1),
          a: rand(0.10, 0.30),
        });
      }
    }
    function WORLD_TOP_VIS() { return -260; }

    /* =========================================================================
     * 5. 关卡生成
     * ====================================================================== */
    function jumpDistance(v) {
      // 满跳水平位移 = 极速 × 滞空帧数；滞空 = 2 × v0 / g
      return v.vmax * (2 * v.jump / GRAVITY);
    }

    function generateLevel(lv) {
      theme = THEMES[(lv - 1) % THEMES.length];
      const baseVehicle = VEHICLES[(lv - 1) % VEHICLES.length];
      // 道具载具：关卡难度（maxGap）永远按默认载具算，算完再换成玩家携带的载具。
      // 这样"更强的载具"只会让关卡更好过，绝不会生成跳不过去的坑 —— 道具是纯收益，
      // 也让平衡工作从"每个载具都要重新验证关卡"简化为一次性验证。
      const itEq = ITEM_BY_ID[equippedItem];
      vehicle = (itEq && itEq.kind === 'vehicle')
        ? { id: itEq.id, name: itEq.name, emoji: itEq.icon, vmax: itEq.vmax, jump: itEq.jump,
            accel: itEq.accel, brake: itEq.brake, accent: itEq.accent, fromItem: true }
        : baseVehicle;

      // 每日挑战用固定 seed 随机源；普通模式恢复真随机（保证每次都不一样）
      if (!dailyMode) rng = Math.random;

      // 意见④：路要很长——第 1 关约 3500px，之后每关 +300。
      // [PLACEHOLDER] 目标单局 30-60s，等 playtest 实测均速后回调。
      levelWidth = 3200 + lv * 300;

      const maxGap = Math.floor(jumpDistance(baseVehicle) * 0.72);   // 留 28% 容错，点按跳也能过
      const minGap = 62;
      const gapChance = clamp(0.30 + lv * 0.015, 0.30, 0.50);

      platforms = [];
      hazards = [];
      stars = [];
      particles = [];
      floaters = [];
      runClean = true;             // 每次生成新关卡重置完美标记
      runScore = 0;                // 每次生成新关卡重置评分/连击/评级
      runCombo = 0;
      runGrade = null;

      // --- 5.1 地形：起步平台 → （缺口 | 平台）循环 → 终点平台 ---
      // 硬性约束：缺口后必须接平台，否则连续缺口会累加成不可跨越的死路。
      const START_W = 520, END_W = 460;
      let x = 0, lastY = GROUND_BASE;
      let lastWasGap = false;
      platforms.push({ x: 0, y: GROUND_BASE, w: START_W, h: PLAT_THICK, start: true });
      x = START_W;

      while (x < levelWidth - END_W - 200) {
        if (!lastWasGap && rng() < gapChance) {
          x += ri(minGap, maxGap);
          lastWasGap = true;
        } else {
          const w = ri(240, 460);
          const y = clamp(lastY + ri(-58, 58), GROUND_BASE - 68, GROUND_BASE);
          platforms.push({ x: x, y: y, w: w, h: PLAT_THICK });
          lastY = y;
          x += w;
          lastWasGap = false;
        }
      }
      // 循环若停在缺口上，先补一段短平台，否则「最后一个缺口 + 终点偏移」会拼出超宽死路
      if (lastWasGap) {
        platforms.push({ x: x, y: GROUND_BASE, w: 240, h: PLAT_THICK });
        x += 240;
      }
      platforms.push({ x: x + 100, y: GROUND_BASE, w: END_W, h: PLAT_THICK, end: true });
      levelWidth = x + 100 + END_W;

      // --- 5.2 障碍：只放在非起点/终点平台上，满足最小间距与边缘留白 ---
      // 儿童向难度：障碍密度刻意压低、最小间距拉大，保证「看得清、躲得开」。
      const avail = Math.max(600, levelWidth - START_W - END_W);
      const spacing = clamp(360 - lv * 6, 240, 360);
      const count = clamp(Math.round(avail / spacing), 4, 16);
      const minSpacing = Math.max(230, spacing * 0.75);
      // 意见④：难度分档——新障碍随关数逐步解锁（unlock 字段见 HAZARDS 定义）
      const unlockedKeys = HAZARD_KEYS.filter(function (k) { return lv >= (HAZARDS[k].unlock || 0); });
      const placed = [];
      let guard = 0;
      for (let i = 0; i < count && guard < count * 30; guard++) {
        const seg = platforms[ri(1, platforms.length - 2)];
        if (!seg || seg.start || seg.end) continue;
        const margin = clamp(seg.w * 0.28, 100, 150);
        if (seg.w < margin * 2 + 60) continue;
        const hx = rand(seg.x + margin, seg.x + seg.w - margin);
        // 最小间距检查：避免障碍连体导致无解
        let ok = true;
        for (const px of placed) {
          if (Math.abs(px - hx) < minSpacing) { ok = false; break; }
        }
        if (!ok) continue;

        const type = pick(unlockedKeys);
        const def = HAZARDS[type];
        const obj = { type: type, x: hx, y: seg.y, t: rand(0, 6), phase: rand(0, 6.28), baseY: seg.y };
        if (def.cycle !== undefined) obj.cycle = def.cycle;   // 火焰/闸门周期：漏复制会变成 undefined → NaN → 永远关/永远不喷
        if (def.r) { obj.r = def.r; obj.w = def.r * 2; obj.h = def.r * 2; }
        else { obj.w = def.w; obj.h = def.h; }

        if (type === 'gear' || type === 'saw') {
          obj.y = seg.y - def.r * 2 + 8;                 // 贴地
          obj.spin = (type === 'gear' ? 1.6 : 5.2) * (rng() < 0.5 ? -1 : 1);
        } else if (type === 'fire') {
          obj.y = seg.y - def.h;
        } else if (type === 'patrol') {
          obj.y = seg.y - def.h;
          obj.range = clamp(rand(50, Math.min(130, (seg.w - margin * 2) / 2)), 40, 130);
          obj.spd = 1.1 + Math.min(lv * 0.045, 0.9);
          obj.baseX = hx;
        } else if (type === 'gate') {
          obj.y = seg.y - def.h;
        } else if (type === 'slider') {
          obj.range = rand(70, 130);
          obj.spd = 1.3 + Math.min(lv * 0.04, 0.8);
          obj.baseY = seg.y - 44 - rand(20, 70);
          obj.y = obj.baseY;
        } else if (type === 'triGear') {
          // 意见④：上下往复移动的三角齿轮，悬空转着咬人，看准节奏从下面冲过去
          obj.range = rand(60, 110);
          obj.spd = 1.1 + Math.min(lv * 0.05, 1.0);
          obj.baseY = seg.y - 46 - rand(20, 70);
          obj.y = obj.baseY;
          obj.spin = 2.8 * (rng() < 0.5 ? -1 : 1);
        } else if (type === 'blocker') {
          // 意见④：挡路大个子，站地上不动，必须跳过它才能继续
          obj.y = seg.y - def.h;
        } else {
          obj.y = seg.y - def.h;
        }
        hazards.push(obj);
        placed.push(hx);
        i++;
      }

      // --- 5.3 沿途小礼物：3 颗，避开障碍 ---
      const segs = platforms.slice(1, -1);
      const wantStars = 3;
      for (let i = 0; i < wantStars && segs.length; i++) {
        const idx = Math.floor((i + 0.5) / wantStars * segs.length);
        const seg = segs[Math.min(idx, segs.length - 1)];
        if (!seg) continue;
        let sx = seg.x + seg.w * rand(0.3, 0.7);
        let clash = false;
        for (const h of hazards) {
          if (Math.abs((h.baseX || h.x) - sx) < 80) { clash = true; break; }
        }
        if (clash) sx = seg.x + seg.w * 0.5;
        stars.push({ x: sx, y: seg.y - 120, r: 16, bob: rand(0, 6.28), taken: false });
      }

      // --- 5.4 终点 ---
      const endSeg = platforms[platforms.length - 1];
      goal = { x: endSeg.x + endSeg.w * 0.5 - 26, y: endSeg.y - 74, w: 52, h: 52, bob: 0, taken: false };

      // --- 5.5 玩家 ---
      // 三心机制：撞到障碍/掉坑各扣 1 心，扣光才死亡（比一击死亡更宽容，利于留存）。
      const startSeg = platforms[0];
      player = {
        x: 90, y: startSeg.y - 50, w: 44, h: 50,
        vx: 0, vy: 0, onGround: false, dir: 1,
        animT: 0, invuln: 0, dead: false,
        lives: (equippedItem === 'heart') ? 4 : 3,   // 道具「爱心罐头」多 1 条命
        landT: 0,                                    // 落地压扁动画计时
      };
      checkpoint = { x: 90, y: startSeg.y - 50 };
      cameraX = 0;
      coyote = 0; jumpBuffer = 0;
      timeAcc = 0;
      comboCount = 0;
      screenFlash = 0;
      shake = 0;
      buildBackdrop();
      startBgm((lv - 1) % 6);      // 意见③：每一关不同的背景音乐（跟主题走）
    }

    /* 进入新关卡前调用：消耗背包里的一件道具，把效果注入本关。
     * 消耗制是刻意设计 —— 用完了就得再去刷一关，这是留存闭环的一环，
     * 也让「看广告领道具」这个变现点有实际需求支撑（见 ads 的 item 分支）。
     * 调用顺序必须是：runGifts 重置 → prepareRunItem → generateLevel。 */
    function prepareRunItem() {
      shieldLeft = 0; magnetLeft = 0; boostLeft = 0;
      equippedItem = '';
      const id = save.equipped || '';
      if (!id) return;
      if (bagCount(id) <= 0) { save.equipped = ''; persist(); return; }
      if (!consumeEquippedItem()) { save.equipped = ''; persist(); return; }
      equippedItem = id;
      if (id === 'shield') shieldLeft = 1;
      else if (id === 'magnet') magnetLeft = 1500;   // 25 秒 @60fps
      else if (id === 'boost') boostLeft = 1200;     // 20 秒
      else if (id === 'giftbox') runGifts += 5;
      // heart（多 1 命）与 vehicle 类载具由 generateLevel 读 equippedItem 生效
    }
    /* 重玩本关：不重复消耗道具，但把限时效果重置回满 —— 否则失败重来会白白损失时长 */
    function refreshItemEffects() {
      shieldLeft = 0; magnetLeft = 0; boostLeft = 0;
      if (equippedItem === 'shield') shieldLeft = 1;
      else if (equippedItem === 'magnet') magnetLeft = 1500;
      else if (equippedItem === 'boost') boostLeft = 1200;
    }

    /* =========================================================================
     * 6. 物理步进（固定 60Hz）
     * ====================================================================== */
    function step() {
      if (state !== 'playing') { stepParticles(); return; }
      const p = player;
      timeAcc += FIXED_DT;
      if (p.landT > 0) p.landT--;   // 落地压扁动画倒计时（squash & stretch）
      if (magnetLeft > 0) magnetLeft--;   // 道具「磁力球」剩余帧
      if (boostLeft > 0) boostLeft--;     // 道具「加速靴」剩余帧

      /* --- 水平 --- */
      const dirIn = (input.right ? 1 : 0) - (input.left ? 1 : 0);
      if (dirIn !== 0) {
        p.vx += dirIn * vehicle.accel;
        p.dir = dirIn;
      } else {
        p.vx *= vehicle.brake;              // 松手滑行：brake 越接近 1 越难刹
        if (Math.abs(p.vx) < 0.12) p.vx = 0;
      }
      const vmaxNow = vehicle.vmax * (boostLeft > 0 ? 1.35 : 1);   // 道具「加速靴」+35% 极速
      p.vx = clamp(p.vx, -vmaxNow, vmaxNow);

      /* --- 跳跃：土狼时间 + 输入缓冲 + 可变跳高 --- */
      if (p.onGround) coyote = COYOTE; else if (coyote > 0) coyote--;
      if (jumpBuffer > 0) jumpBuffer--;
      if ((coyote > 0) && jumpBuffer > 0) {
        p.vy = -vehicle.jump;
        p.onGround = false;
        coyote = 0; jumpBuffer = 0;
        jumpFrames = 0; jumpHeld = true;
        sfx.play('jump');
        spawnDust(p.x + p.w / 2, p.y + p.h, 6, '#ffffff');
      }
      // 可变跳高：松手切断上升速度。
      // 前 MIN_JUMP_FRAMES 帧不切断——触屏玩家绝大多数是「点一下」而不是长按，
      // 没有这段保护，一次轻点只能跳到满跳的 18%，等于把跳跃做废。
      if (jumpHeld) {
        jumpFrames++;
        if (!input.jump && jumpFrames >= MIN_JUMP_FRAMES && p.vy < 0) {
          p.vy *= JUMP_CUT;
          jumpHeld = false;
        }
        if (p.vy >= 0) jumpHeld = false;
      }

      /* --- 重力 --- */
      p.vy += GRAVITY;
      if (p.vy > MAX_FALL) p.vy = MAX_FALL;

      /* --- 分轴碰撞解算 --- */
      p.x += p.vx;
      for (const s of platforms) {
        if (!aabb(p.x, p.y, p.w, p.h, s.x, s.y, s.w, s.h)) continue;
        // 自动上台阶：高度差在 STEP_UP 以内直接抬上去，
        // 否则 1~14px 的小坎会把玩家硬生生钉住——那不是难度，是 bug。
        const step = (p.y + p.h) - s.y;
        if (step > 0 && step <= STEP_UP) {
          p.y = s.y - p.h;
          if (p.vy > 0) p.vy = 0;
          continue;
        }
        if (p.vx > 0) p.x = s.x - p.w;
        else if (p.vx < 0) p.x = s.x + s.w;
        else p.x = (p.x + p.w / 2 < s.x + s.w / 2) ? s.x - p.w : s.x + s.w;  // 速度为 0 也要推出去，否则会卡在墙里
        p.vx = 0;
      }
      if (p.x < 0) { p.x = 0; p.vx = 0; }

      const wasAir = !p.onGround;
      p.y += p.vy;
      p.onGround = false;
      for (const s of platforms) {
        if (!aabb(p.x, p.y, p.w, p.h, s.x, s.y, s.w, s.h)) continue;
        if (p.vy > 0) {
          p.y = s.y - p.h;
          if (wasAir && p.vy > 6) {
            spawnDust(p.x + p.w / 2, p.y + p.h, 5, '#ffffff');
            sfx.play('land');
          }
          p.vy = 0;
          p.onGround = true;
          if (wasAir) p.landT = 11;
        } else if (p.vy < 0) {
          // 顶到平台底面：只停住上升，不做位置传送。
          // 平台厚度是 420px，若照搬「推到 s.y + s.h」会把玩家瞬移到屏幕外直接判坠落。
          p.vy = 0;
        }
      }
      if (p.onGround) jumpHeld = true;

      // 检查点：只要稳稳站在平台上并向前推进就刷新，
      // 不能用「速度接近极速才记录」——否则玩家全程满速跑，掉下去会一路退回起点。
      if (p.onGround) {
        const s = platforms.find(pl => p.x + p.w > pl.x && p.x < pl.x + pl.w);
        if (s && p.x > checkpoint.x + 220) checkpoint = { x: p.x, y: p.y - 10 };
      }

      /* --- 坠落 --- */
      if (p.y > ABYSS_Y) {
        hurt(1, true);
        if (!p.dead) respawnAtCheckpoint();
        return;
      }

      /* --- 障碍更新与碰撞 --- */
      for (const h of hazards) {
        h.t += FIXED_DT;
        if (h.type === 'patrol') {
          h.x = h.baseX + Math.sin(h.t * h.spd) * h.range;
        } else if (h.type === 'slider' || h.type === 'triGear') {
          h.y = h.baseY + Math.sin(h.t * h.spd) * h.range;
        } else if (h.type === 'gate') {
          const cyc = (h.t / h.cycle + h.phase / 6.28) % 1;
          h.open = cyc < HAZARDS.gate.openRatio ? 1 : 0;
        } else if (h.type === 'fire') {
          const cyc = (h.t / h.cycle + h.phase / 6.28) % 1;
          h.on = cyc < (1 - HAZARDS.fire.safeRatio) ? 1 : 0;
        }
      }

      if (p.invuln > 0) {
        p.invuln--;
      } else {
        for (const h of hazards) {
          const def = HAZARDS[h.type];
          if (h.type === 'gate') {
            if (h.open) continue;
            // 实体墙：阻挡而非扣血
            if (aabb(p.x, p.y, p.w, p.h, h.x, h.y, h.w, h.h)) {
              if (p.vx > 0) p.x = h.x - p.w;
              else if (p.vx < 0) p.x = h.x + h.w;
              p.vx = 0;
            }
            continue;
          }
          if (h.type === 'fire' && !h.on) continue;
          if (aabb(p.x, p.y, p.w, p.h, h.x, h.y, h.w, h.h)) {
            hurt(1, false);
            break;
          }
        }
      }

      /* --- 小礼物 --- */
      // 道具「磁力球」：先把 170px 内的礼物吸过来，再走拾取判定
      if (magnetLeft > 0) {
        const pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
        for (const s of stars) {
          if (s.taken) continue;
          const dx = pcx - s.x, dy = pcy - s.y;
          const d2 = dx * dx + dy * dy;
          if (d2 > 4 && d2 < 170 * 170) {
            const d = Math.sqrt(d2);
            s.x += dx / d * 4.6; s.y += dy / d * 4.6;
          }
        }
      }
      for (const s of stars) {
        if (s.taken) continue;
        if (aabb(p.x, p.y, p.w, p.h, s.x - s.r, s.y - s.r, s.r * 2, s.r * 2)) {
          s.taken = true;
          comboCount++;
          runCombo = Math.max(runCombo, comboCount);
          const gain = 1;
          runGifts += gain;
          // 记录本关礼物收集进度（用于每日任务追踪，结算时 bumpQuest('gift20') 读取）
          questGiftCount++;
          // 评分：每星 30 + 连击加成（连击越高越值钱，奖励连续无伤吃星）
          const pts = 30 + (comboCount - 1) * 5;
          runScore += pts;
          sfx.play('coin');
          spawnBurst(s.x, s.y, '#ffd24a', 12);
          pushFloater(s.x, s.y - 10, '+' + pts, '#ffd24a');
          if (comboCount >= 2) pushFloater(s.x, s.y - 32, comboCount + ' 连击！', '#7afcff');
        }
      }

      /* --- 终点 --- */
      if (!goal.taken && aabb(p.x, p.y, p.w, p.h, goal.x, goal.y, goal.w, goal.h)) {
        goal.taken = true;
        onCleared();
        return;
      }

      stepParticles();

      /* --- 相机 --- */
      const targetX = p.x - view.w * 0.35;
      cameraX = lerp(cameraX, targetX, 0.14);
      cameraX = clamp(cameraX, 0, Math.max(0, levelWidth - view.w));
      if (shake > 0) shake--;
      if (bannerT > 0) bannerT -= FIXED_DT;
      if (screenFlash > 0) screenFlash -= FIXED_DT;
    }

    function stepParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const q = particles[i];
        q.life--;
        q.x += q.vx; q.y += q.vy; q.vy += q.g;
        q.vx *= 0.98;
        if (q.life <= 0) particles.splice(i, 1);
      }
      if (particles.length > 220) particles.splice(0, particles.length - 220);
      for (let i = floaters.length - 1; i >= 0; i--) {
        const f = floaters[i];
        f.life--; f.y -= 0.9;
        if (f.life <= 0) floaters.splice(i, 1);
      }
    }

    /* =========================================================================
     * 7. 伤害 / 死亡 / 过关
     * ====================================================================== */
    function hurt(amount, isFall) {
      const p = player;
      if (p.invuln > 0 || p.dead) return;
      // 道具「护盾泡泡」：优先扣护盾，不掉血、不断连击、不破坏完美通关
      if (shieldLeft > 0) {
        shieldLeft--;
        p.invuln = 78;
        sfx.play('shield');
        vibrate(30);
        spawnBurst(p.x + p.w / 2, p.y + p.h / 2, '#6fe3ff', 18);
        pushFloater(p.x + p.w / 2, p.y - 8, '🛡 护盾挡下！', '#6fe3ff');
        if (isFall) respawnAtCheckpoint();
        return;
      }
      // 三心机制：撞到/掉坑各扣 1 心，扣光才死亡。掉坑扣心后回检查点重来。
      p.lives -= amount;
      comboCount = 0;
      runClean = false;              // 受过伤 → 本关不再算完美
      p.invuln = 78;                 // 1.3s 无敌，防止连续掉血
      shake = isFall ? 6 : 12;
      screenFlash = 0.18;
      sfx.play(isFall ? 'fall' : 'hurt');
      vibrate(isFall ? 30 : 60);
      spawnBurst(p.x + p.w / 2, p.y + p.h / 2, pet.color, 16);
      if (!isFall) {
        p.vx = -p.dir * 4.2;
        p.vy = -5.2;
      }
      if (p.lives <= 0) {
        p.lives = 0;
        p.dead = true;
        onDead();
      } else {
        pushFloater(p.x + p.w / 2, p.y - 6, '-1 ❤', '#ff6b8a');
      }
    }

    function respawnAtCheckpoint() {
      const p = player;
      p.x = checkpoint.x;
      p.y = checkpoint.y;
      p.vx = 0; p.vy = 0;
      p.invuln = 96;
      pushFloater(p.x, p.y - 10, '回到检查点', '#9ad0ff');
    }

    function onDead() {
      state = 'dead';
      stopBgm();
      sfx.play('fail');
      vibrate(140);
      spawnBurst(player.x + player.w / 2, player.y + player.h / 2, pet.color, 30);
      save.runs = (save.runs | 0) + 1;
      if (level > (save.best | 0)) save.best = level;
      save.gifts = (save.gifts | 0) + runGifts;
      if ((save.runs | 0) >= 20) unlockAchievement('play20');
      persist();
    }

    function onCleared() {
      state = 'cleared';
      stopBgm();
      sfx.play('clear');
      vibrate(60);
      const base = 3;
      runGifts += base;
      spawnBurst(goal.x + goal.w / 2, goal.y + goal.h / 2, '#ffd24a', 34);
      if (level + 1 > (save.best | 0)) save.best = level + 1;
      save.gifts = (save.gifts | 0) + runGifts;
      // 评分结算：通关 100 + 无伤 50，加上吃星/连击分 → 映射评级
      runScore += 100;
      if (runClean) runScore += 50;
      runGrade = gradeFor(runScore);
      if (runScore > (save.bestScore | 0)) save.bestScore = runScore;
      // 每日挑战：记录今日最佳
      if (dailyMode) save.dailyBest[dailyKey] = Math.max(save.dailyBest[dailyKey] || 0, runScore);
      // 排行榜：本地 top10（分数/关卡/宠物）
      save.scores.push({ score: runScore, level: level, pet: pet.id, date: Date.now() });
      save.scores.sort(function (a, b) { return b.score - a.score; });
      if (save.scores.length > 10) save.scores.length = 10;
      // 道具掉落（用户诉求③）：每关必掉 1 件；S 评价或每 5 关额外掉 1 件，且第 5 关保底稀有以上。
      // rationale：必掉 1 件保证"每关都有收获"的正反馈；每 5 关的保底稀有给长期玩家
      // 一个可预期的惊喜节奏，避免连开 10 个普通道具的挫败感。
      droppedItems = [];
      const d1 = rollItem(1);
      grantItem(d1.id, 1); droppedItems.push(d1);
      if (runGrade.g === 'S' || level % 5 === 0) {
        const d2 = rollItem(level % 5 === 0 ? 2 : 1);
        grantItem(d2.id, 1); droppedItems.push(d2);
      }
      // 留存系统：通关后更新任务进度 + 释放宝箱槽位
      bumpQuest('clear2', 1);
      if (runGrade.g === 'S') bumpQuest('gradeS', 1);
      bumpQuest('gift20', questGiftCount);   // 本关收集的礼物数
      grantChest(0);    // 每通关一次释放一个木质宝箱
      // 重置本关任务进度追踪
      questGiftCount = 0;
      for (const a of ACCESSORIES) {
        if (save.acc.indexOf(a.id) < 0 && (save.gifts | 0) >= a.need) {
          save.acc.push(a.id);
          pendingUnlock = a;
          break;                       // 一关只开一件，孩子看得清
        }
      }
      // 意见②：整关没受过伤 → 房子进度 +1，攒满 3 段建成大房子（解锁小屋）。
      if (runClean && save.house < 3) {
        save.house++;
        if (save.house >= 3) { toast('🏠 大房子建成啦！'); }
        else { toast('完美通关！房子 ' + save.house + '/3'); }
      }
      // 成就触发
      unlockAchievement('firstClear');
      if (level >= 10) unlockAchievement('clear10');
      if ((save.gifts | 0) >= 50) unlockAchievement('gift50');
      if (runClean) unlockAchievement('noHit');
      if (runCombo >= 5) unlockAchievement('combo5');
      if (runGrade.g === 'S') unlockAchievement('gradeS');
      if (save.house >= 3) unlockAchievement('house3');
      // 段位系统：累计总分
      save.totalScore = (save.totalScore | 0) + runScore;
      persist();
    }

    function reviveByAd() {
      if (state !== 'dead' || revivesUsed >= 2) return;
      const cb = function (ok) {
        if (!ok) { toast('广告未看完，复活失败'); return; }
        player.lives = 3;              // 看广告复活：满血继续本关
        player.dead = false;
        revivesUsed++;
        runClean = false;
        respawnAtCheckpoint();
        player.invuln = 120;
        state = 'playing';
        sfx.play('rev');
        startBgm();
        toast('复活成功！继续闯关');
      };
      ads.showRewarded('revive', cb);
    }

    function doubleRewardByAd() {
      if (state !== 'cleared') return;
      const cb = function (ok) {
        if (!ok) { toast('广告未看完'); return; }
        save.gifts = (save.gifts | 0) + runGifts;
        runGifts *= 2;
        persist();
        sfx.play('coin');
        toast('奖励翻倍！+ ' + runGifts + ' 🎁');
      };
      ads.showRewarded('double', cb);
    }

    function toast(msg) { bannerMsg = msg; bannerT = 2.2; }

    /* =========================================================================
     * 8. 粒子 / 飘字
     * ====================================================================== */
    function spawnDust(x, y, n, color) {
      for (let i = 0; i < n; i++) {
        particles.push({ x: x, y: y, vx: rand(-1.8, 1.8), vy: rand(-2.2, -0.2), g: 0.06, life: ri(14, 26), max: 26, color: color, size: rand(2, 4.5) });
      }
    }
    function spawnBurst(x, y, color, n) {
      for (let i = 0; i < n; i++) {
        const a = rand(0, 6.283), sp = rand(1.2, 5);
        particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, g: 0.14, life: ri(22, 46), max: 46, color: color, size: rand(2.5, 6) });
      }
    }
    function pushFloater(x, y, text, color) {
      floaters.push({ x: x, y: y, text: text, color: color, life: 60, max: 60 });
    }

    /* =========================================================================
     * 8.5 汪汪队萌系角色库（纯 Canvas 手绘，替代 emoji）
     * 每只宠物 = 大头 Q 版 + 小身体；载具 = 彩色圆润小车。
     * ====================================================================== */
    const ART = {};

    // —— 通用眼 / 腮红 / 白描边圆 ——
    /* ---------- 功夫熊猫式 Q 版改造（3 条通用法则） ----------
     * ① 厚描边：所有白外轮廓从 2.2-2.4 加到 3.2-3.6 —— 卡通角色的"贴纸感"，
     *    也是功夫熊猫那种圆润厚实轮廓的来源，小屏上辨识度显著提升。
     * ② 体积感：头/身各加一层"左上亮、右下暗"的渐变，形状从饼变球。
     * ③ 幼态化：瞳孔放大（0.82r → 0.90r）+ 双高光 + 下眼睑反光 —— 大瞳孔
     *    高反光是婴儿图式（baby schema），直接触发"可爱"感知。
     * 这三条改在底层原语上，9 只宠物全部受益，无需逐只重画。 */
    ART.eye = function (g, x, y, r, t, wink) {
      const blink = (t % 3.1) < 0.11;
      if (blink || wink) {
        // 眨眼改成向上弯的"笑眼"弧线（旧版是直线，闭眼时像死掉）
        g.strokeStyle = '#2e2622'; g.lineWidth = Math.max(1.6, r * 0.38); g.lineCap = 'round';
        g.beginPath();
        g.moveTo(x - r * 0.78, y - r * 0.06);
        g.quadraticCurveTo(x, y + r * 0.46, x + r * 0.78, y - r * 0.06);
        g.stroke();
        return;
      }
      g.fillStyle = '#fff';
      g.beginPath(); g.ellipse(x, y, r, r * 1.06, 0, 0, 6.283); g.fill();
      g.fillStyle = '#2e2622';
      g.beginPath(); g.arc(x + r * 0.05, y + r * 0.05, r * 0.90, 0, 6.283); g.fill();
      // 主高光（左上）
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(x - r * 0.30, y - r * 0.34, r * 0.34, 0, 6.283); g.fill();
      // 副高光（右下小点）
      g.beginPath(); g.arc(x + r * 0.32, y + r * 0.36, r * 0.16, 0, 6.283); g.fill();
      // 下眼睑反光：让眼睛"水汪汪"
      g.fillStyle = 'rgba(255,255,255,0.30)';
      g.beginPath(); g.ellipse(x, y + r * 0.64, r * 0.48, r * 0.17, 0, 0, 6.283); g.fill();
    };
    ART.cheek = function (g, x, y, r) {
      g.fillStyle = 'rgba(255,105,120,0.50)';
      g.beginPath(); g.ellipse(x, y, r, r * 0.62, 0, 0, 6.283); g.fill();
      // 两道斜笔触（日系腮红，卡通感比纯色块强）
      g.strokeStyle = 'rgba(228,66,92,0.32)';
      g.lineWidth = Math.max(0.9, r * 0.15); g.lineCap = 'round';
      for (let i = -1; i <= 1; i++) {
        g.beginPath();
        g.moveTo(x + i * r * 0.42 - r * 0.18, y + r * 0.26);
        g.lineTo(x + i * r * 0.42 + r * 0.18, y - r * 0.26);
        g.stroke();
      }
    };
    ART.head = function (g, x, y, R, fill) {
      g.fillStyle = '#ffffff';
      g.beginPath(); g.arc(x, y, R + 3.4, 0, 6.283); g.fill();
      g.fillStyle = fill;
      g.beginPath(); g.arc(x, y, R, 0, 6.283); g.fill();
      // 体积渐变：左上打亮、右下压暗
      const grd = g.createLinearGradient(x - R * 0.5, y - R, x + R * 0.4, y + R);
      grd.addColorStop(0, 'rgba(255,255,255,0.30)');
      grd.addColorStop(0.55, 'rgba(255,255,255,0)');
      grd.addColorStop(1, 'rgba(0,0,0,0.12)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(x, y, R, 0, 6.283); g.fill();
    };
    ART.earRound = function (g, x, y, r, fill, inner) {
      g.fillStyle = '#fff';

    ART.body = function (g, x, y, rx, ry, fill, belly, strokeW) {
      const sw = strokeW === 0 ? 0 : 3.2;
      g.fillStyle = '#fff';
      g.beginPath(); g.ellipse(x, y, rx + sw, ry + sw, 0, 0, 6.283); g.fill();

        g.fillStyle = belly;
        g.beginPath(); g.ellipse(x, y + 1.5, rx * 0.58, ry * 0.62, 0, 0, 6.283); g.fill();
      }
      const grd = g.createLinearGradient(x - rx, y - ry, x + rx * 0.6, y + ry);
      grd.addColorStop(0, 'rgba(255,255,255,0.26)');
      grd.addColorStop(0.5, 'rgba(255,255,255,0)');
      grd.addColorStop(1, 'rgba(0,0,0,0.12)');
      g.fillStyle = grd;
      g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 6.283); g.fill();
