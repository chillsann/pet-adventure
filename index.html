<script data-page-node-id="SIxNNeFfAVa9HW7rJqkPOq" data-pnid-children="lr4oRrhUDzr6HJgkjt2iBl">/* =============================================================================
 * 疾风冲刺 — 游戏内核（平台无关层）
 * -----------------------------------------------------------------------------
 * 本文件不触碰任何 DOM / wx / tt API。所有平台能力通过 deps 注入：
 *   deps.ctx      2D 绘图上下文
 *   deps.storage  { get(key, def), set(key, val) }
 *   deps.sfx      { play(name) }
 *   deps.ads      { showRewarded(kind, cb) }
 *   deps.vibrate  (ms)
 *   deps.viewport { width, height, dpr }  （CSS 像素）
 * 这样 Web 版与微信/抖音小游戏版共用同一份玩法逻辑，只有适配层不同。
 * ========================================================================== */
(function (global) {
  'use strict';

  /* ===========================================================================
   * 1. 物理常量
   * 全部以「固定 60Hz 步长」为单位（px / frame），保证高刷屏与 60Hz 屏手感一致。
   * ======================================================================== */
  const FIXED_DT = 1 / 60;
  const GRAVITY = 0.62;        // 跳跃到顶点约 0.31s，休闲平台跳跃的甜点区间
  const MAX_FALL = 15;         // 终端速度，防止高速穿透薄平台
  const JUMP_CUT = 0.78;       // 松手切断系数：最小跳高 ≈ 满跳的 60%
  const MIN_JUMP_FRAMES = 6;   // 起跳后 6 帧内不允许切断，保证「点一下」也有可用高度
  const COYOTE = 8;            // 0.13s 土狼时间：离开平台边缘后仍可起跳
  const BUFFER = 8;            // 0.13s 跳跃缓冲：落地前按跳，落地瞬间生效
  const STEP_UP = 14;          // 自动登台阶的最大高度差（px）
  const MAX_STEPS = 5;         // 单帧最多补算 5 个物理步，防后台切回时卡死

  const GROUND_BASE = 470;     // 世界坐标：地面顶面基准线
  const ABYSS_Y = GROUND_BASE + 320;   // 掉到这个高度判定坠落
  const PLAT_THICK = 420;      // 平台向下延伸厚度（视觉 + 防穿底）

  /* ===========================================================================
   * 2. 数据表（每一项数值都带 rationale，见 docs/DESIGN_GDD.md）
   * ======================================================================== */
  const PETS = [
    { id: 'cat',    name: '橘猫', emoji: '🐱', color: '#ff9b42', need: 0 },
    { id: 'dog',    name: '柴犬', emoji: '🐶', color: '#e0a94a', need: 0 },
    { id: 'rabbit', name: '兔子', emoji: '🐰', color: '#f2c0d5', need: 0 },
    { id: 'panda',  name: '熊猫', emoji: '🐼', color: '#ffffff', need: 30 },
    { id: 'bear',   name: '小熊', emoji: '🐻', color: '#b5794a', need: 60 },
    { id: 'frog',   name: '青蛙', emoji: '🐸', color: '#7cc74a', need: 100 },
    { id: 'fox',    name: '狐狸', emoji: '🦊', color: '#e8834a', need: 150 },
    { id: 'penguin',name: '企鹅', emoji: '🐧', color: '#3a4a5a', need: 220 },
    { id: 'dragon', name: '龙宝', emoji: '🐲', color: '#e04a4a', need: 300 },
  ];

  // 载具：差异集中在「极速 vs 可控性」，跳跃距离差异刻意压在 ±4% 内，
  // 保证任何载具都能通过任何关卡——载具改变手感与风险，不改变关卡可行性。
  const VEHICLES = [
    { id: 'escooter', name: '电动车', emoji: '🛵', vmax: 4.5, jump: 11.9, accel: 0.55, brake: 0.840, accent: '#ff6b6b' },
    { id: 'bike',     name: '单车',   emoji: '🚲', vmax: 4.9, jump: 11.4, accel: 0.44, brake: 0.880, accent: '#4dabf7' },
    { id: 'kick',     name: '滑板车', emoji: '🛴', vmax: 4.8, jump: 11.7, accel: 0.50, brake: 0.860, accent: '#ffd43b' },
    { id: 'board',    name: '滑板',   emoji: '🛹', vmax: 5.1, jump: 11.1, accel: 0.40, brake: 0.920, accent: '#cc5de8' },
    { id: 'sled',     name: '雪橇',   emoji: '🛷', vmax: 5.4, jump: 10.6, accel: 0.34, brake: 0.965, accent: '#74c0fc' },
  ];

  const THEMES = [
    { name: '翠绿草原', sky1: '#8ed6f7', sky2: '#d8f7c8', ground: '#6ab04c', edge: '#4a8a34', deep: '#2f5c22', decor: 'flower',  dark: false },
    { name: '金黄沙漠', sky1: '#ffd88a', sky2: '#ffb142', ground: '#e1a54a', edge: '#c08a30', deep: '#8a5f1e', decor: 'cactus',  dark: false },
    { name: '冰雪世界', sky1: '#e8f1f8', sky2: '#bcd3e0', ground: '#f2f7fa', edge: '#b9c9d6', deep: '#7c93a4', decor: 'snow',    dark: false },
    { name: '糖果王国', sky1: '#ffc2f0', sky2: '#ffe08a', ground: '#ff9ff3', edge: '#e056a0', deep: '#9c2f70', decor: 'candy',   dark: false },
    { name: '火山地带', sky1: '#3d1a10', sky2: '#e15f41', ground: '#5a2a1a', edge: '#8c3b22', deep: '#2a0f08', decor: 'lava',    dark: true },
    { name: '霓虹都市', sky1: '#241b3a', sky2: '#6c5ce7', ground: '#3c3f57', edge: '#5a5f80', deep: '#1a1730', decor: 'building', dark: true },
  ];

  // 障碍定义。solid=true 表示实体阻挡（撞上被挡住不扣血），dmg=true 表示扣血。
  // unlock = 从第几关开始出现（意见④：难度随闯关次数逐渐加强，新障碍分档解锁）。
  const HAZARDS = {
    spike:      { w: 42,  h: 30,  dmg: true,  solid: false },
    spikeFloor: { w: 100, h: 26,  dmg: true,  solid: false },
    gear:       { r: 26,           dmg: true,  solid: false },
    saw:        { r: 26,           dmg: true,  solid: false, unlock: 3 },
    fire:       { w: 38,  h: 56,  dmg: true,  solid: false, cycle: 2.4, safeRatio: 0.60, unlock: 3 },
    patrol:     { w: 40,  h: 40,  dmg: true,  solid: false, unlock: 2 },
    gate:       { w: 22,  h: 104, dmg: false, solid: true,  cycle: 2.4, openRatio: 0.45, unlock: 5 },
    slider:     { w: 38,  h: 38,  dmg: true,  solid: false, unlock: 4 },
    // 意见④：上下移动的三角形齿轮（第 4 关解锁）
    triGear:    { r: 24,           dmg: true,  solid: false, unlock: 4 },
    // 意见④：挡路的大个子小怪兽，站得稳、块头大，必须跳过去（第 6 关解锁）
    blocker:    { w: 60,  h: 52,  dmg: true,  solid: false, unlock: 6 },
  };
  const HAZARD_KEYS = Object.keys(HAZARDS);

  // 装饰品（意见②）：礼物攒到 need 即解锁。确定性解锁表——孩子数着礼物就能
  // 预期下一件是什么，比随机开箱更适合低龄玩家。slot 决定穿戴位置。
  const ACCESSORIES = [
    { id: 'glasses',  name: '小墨镜',   slot: 'glasses', need: 8 },
    { id: 'cap',      name: '小红帽',   slot: 'hat',     need: 15 },
    { id: 'scarf',    name: '红围巾',   slot: 'neck',    need: 24 },
    { id: 'bowknot',  name: '蝴蝶结',   slot: 'hat',     need: 34 },
    { id: 'starGlass',name: '星星眼镜', slot: 'glasses', need: 45 },
    { id: 'crown',    name: '皇冠',     slot: 'hat',     need: 60 },
    { id: 'cape',     name: '小披风',   slot: 'neck',    need: 80 },
  ];

  /* ---------- 道具表：礼物从"计数"升级成"下一关能用的工具" ----------
   * 用户诉求③：通关拿到的礼物应该是不同的工具，例如交通工具，下一关可以使用。
   * 两类道具：
   *  - kind='vehicle' 载具：覆盖本关默认载具。关卡生成器按新载具的跳跃能力重算
   *    maxGap（见 generateLevel），所以更强的载具不会遇到跳不过去的坑 —— 可行性
   *    自动适配，这是"载具道具能做得比默认强"的前提。
   *  - kind='buff' 增益：只改数值或加一次性保护，不触碰碰撞盒。
   * rarity 1/2/3 = 普通/稀有/史诗，决定掉落权重（60/26/8）与外框颜色。
   * 消耗制：装备后每关消耗 1 个 —— 用完就得再刷，这是留存闭环的一环。 */
  const ITEMS = [
    { id: 'shield',  name: '护盾泡泡', icon: '🛡️', rarity: 1, kind: 'buff',    desc: '免疫 1 次伤害' },
    { id: 'magnet',  name: '磁力球',   icon: '🧲', rarity: 1, kind: 'buff',    desc: '25 秒自动吸取礼物' },
    { id: 'boost',   name: '加速靴',   icon: '👟', rarity: 1, kind: 'buff',    desc: '20 秒移动速度 +35%' },
    { id: 'giftbox', name: '礼物盒',   icon: '🎁', rarity: 1, kind: 'buff',    desc: '开局自带 5 份礼物' },
    { id: 'balloon', name: '漂浮气球', icon: '🎈', rarity: 1, kind: 'vehicle', desc: '慢速但最好控制',
      vmax: 4.2, jump: 12.8, accel: 0.40, brake: 0.945, accent: '#ff9ff3' },
    { id: 'heart',   name: '爱心罐头', icon: '❤️', rarity: 2, kind: 'buff',    desc: '本关多 1 条命' },
    { id: 'jetpack', name: '火箭背包', icon: '🚀', rarity: 2, kind: 'vehicle', desc: '跳得又高又远',
      vmax: 4.6, jump: 14.8, accel: 0.48, brake: 0.880, accent: '#ff6b6b' },
    { id: 'turbo',   name: '涡轮滑板', icon: '🛹', rarity: 2, kind: 'vehicle', desc: '全场最快的载具',
      vmax: 7.2, jump: 11.6, accel: 0.52, brake: 0.900, accent: '#cc5de8' },
    { id: 'cloud',   name: '筋斗云',   icon: '☁️', rarity: 3, kind: 'vehicle', desc: '传说级：跳最高还跑得快',
      vmax: 6.0, jump: 15.5, accel: 0.50, brake: 0.900, accent: '#74c0fc' },
  ];
  const ITEM_BY_ID = {};
  for (const it of ITEMS) ITEM_BY_ID[it.id] = it;
  const RARITY_COLOR = [null, '#b9c6d6', '#4dabf7', '#cc5de8'];
  const RARITY_NAME  = [null, '普通',    '稀有',    '史诗'];

  /* ===========================================================================
   * 改装零件系统（借鉴《合成竞速之王》的核心循环）
   *
   * 那个游戏最值得抄的一点不是赛车，而是它把「产出 → 购买 → 合成 → 变强」这条
   * 循环做得极短：点屏幕出金币 → 金币买零件 → 两个同级零件合成高一级 → 车更强
   * → 出金币更快。每一步都在 3 秒内看到结果，玩家永远有"下一步该干什么"。
   *
   * 我们把这套循环嫁接在既有的跑酷玩法上（跑酷 + 元成长，是超休闲的标准结构）：
   *   跑关 → 得金币 → 买零件 → 合成升级 → 载具更快/跳更高 → 跑关更轻松 → 更多金币
   *
   * 5 个部位各自对应一个手感维度，合成不花钱、只花零件 —— 让"合成"成为纯粹的
   * 正反馈时刻，而不是又一次付费；金币的消耗口统一收敛到「买 1 级零件」这一处，
   * 经济模型简单到不会失控。
   * ======================================================================== */
  const PART_SLOTS = [
    { id: 'engine',     name: '发动机', icon: '⚙️', stat: 'vmax',  per:  0.055, tint: '#ff9f43', desc: '最高速度' },
    { id: 'tires',      name: '轮胎',   icon: '🛞', stat: 'accel', per:  0.070, tint: '#54a0ff', desc: '起步加速' },
    { id: 'suspension', name: '悬挂',   icon: '🪃', stat: 'jump',  per:  0.045, tint: '#7bd88f', desc: '跳跃高度' },
    { id: 'chassis',    name: '车架',   icon: '🛡️', stat: 'brake', per: -0.012, tint: '#c8d6e5', desc: '落地操控' },
    { id: 'nitro',      name: '氮气',   icon: '🔥', stat: 'coin',  per:  0.15,  tint: '#ff6b81', desc: '金币加成' },
  ];
  const PART_MAX_LV = 6;        // 每部位最高 6 级
  const PART_PRICE  = 120;      // 买 1 个「1 级零件」的价格（唯一金币消耗口）
  /* 离线产出定价：按「小时」而不是「秒」定义。
   * 平衡依据：一次通关约赚 200+ 金币，离线 8 小时给 960（≈5 次通关）——
   * 是"回来的理由"，但远不足以取代主动游玩（否则挂机就赢了，游戏就死了）。
   * 按小时定义是为了让界面上的数字好看好懂（"每小时 120"），不用暴露每秒的碎数。 */
  const IDLE_PER_HOUR = 120;
  const IDLE_CAP_SEC = 8 * 3600;// 离线收益最多累计 8 小时
  const PART_BY_ID = {};
  for (const s of PART_SLOTS) PART_BY_ID[s.id] = s;
  const PART_LV_NAME = [null, 'Ⅰ', 'Ⅱ', 'Ⅲ', 'Ⅳ', 'Ⅴ', 'Ⅵ'];

  /* ===========================================================================
   * 难度分层：休闲 / 挑战（老少咸宜的核心机制）
   *
   * 一款游戏要同时服务小孩和成人，靠的不是把难度调成"中间值"——那会让两边都不满意。
   * 正确做法是把难度做成玩家自选的两条轨道：
   *  · 休闲：3 颗心，缺口留 28% 容错、障碍更疏，积分 1.0×
   *  · 挑战：2 颗心，缺口只留 20% 容错、障碍更密，积分 2.0×、金币 1.6×
   *          —— 风险与收益严格成正比
   *
   * 刻意不动载具速度：maxGap 是拿「默认载具」的跳跃距离算的（见 generateLevel），
   * 若给某模式偷偷加速，跳跃距离反而变长、缺口相对变窄，难度会不升反降。
   * 难度只从「容错率 + 障碍密度 + 心数」三处加。
   *
   * 评级（S/A/B/C）始终按"原始表现"计算，倍率只作用于积分与金币：
   * 这样评级不会被倍率灌水，而挑战模式的高收益来自它真的更难。
   * ======================================================================== */
  const MODES = [
    // 休闲档的每个边界值都刻意等于改造前的原值 —— 分层不等于把两边都动一遍，
    // 新难度只加到挑战档，休闲档的手感必须原封不动（这才是"受众变宽"而不是"变难"）。
    { id: 'casual', name: '休闲', icon: '🌤', lives: 3, gap: 0.00, gapMax: 0.50,
      spacingAdd: 0,   spacingMin: 240, spacingMax: 360, cap: 16, minSpacingFloor: 230,
      hazMarginK: 0.28, hazMarginMin: 100, hazMarginMax: 150,
      margin: 0.72, score: 1.0, coin: 1.0, tag: '轻松体验', desc: '3 颗心 · 节奏舒缓' },
    { id: 'pro',    name: '挑战', icon: '🔥', lives: 2, gap: 0.10, gapMax: 0.62,
      spacingAdd: -70, spacingMin: 170, spacingMax: 360, cap: 22, minSpacingFloor: 170,
      // 留白下限 80 而不是 60：再小玩家落地后只剩不到 0.2s 反应，那不是难，是不讲理
      hazMarginK: 0.20, hazMarginMin: 80, hazMarginMax: 110,
      margin: 0.80, score: 2.0, coin: 1.6, tag: '双倍积分', desc: '2 颗心 · 障碍更密' },
  ];
  const MODE_BY_ID = {};
  for (const m of MODES) MODE_BY_ID[m.id] = m;
  function modeOf(id) { return MODE_BY_ID[id] || MODES[0]; }


  /* ===========================================================================
   * 留存与变现钩子（成人也要爱玩 + 广告位设计）
   * 四条钩子各自解决一个留存问题：
   * ① 每日签到 —— 解决"明天为什么还要打开"（连续签到奖励递增，断签重置）
   * ② 宝箱等待 —— 解决"这一局结束后为什么还挂着"（等待解锁 or 看广告秒开）
   * ③ 每日任务 —— 解决"上线后不知道干什么"（3 个明确目标 + 道具奖励）
   * ④ 段位晋升 —— 解决"长期玩下去图什么"（累计分晋升头衔，成人玩家的核心驱动力）
   * 广告点位：复活 / 奖励翻倍 / 宝箱秒开 / 免费领道具 —— 全部是"玩家主动选择"的
   * 激励视频，不打断节奏，eCPM 也远高于强制插屏。
   * ======================================================================== */
  const SIGN_REWARDS = [
    { icon: '🎁', n: 3,  label: '礼物 ×3' },
    { icon: '🎁', n: 5,  label: '礼物 ×5' },
    { icon: '🛡️', item: 'shield',  label: '护盾泡泡' },
    { icon: '🎁', n: 8,  label: '礼物 ×8' },
    { icon: '🧲', item: 'magnet',  label: '磁力球' },
    { icon: '🎁', n: 12, label: '礼物 ×12' },
    { icon: '🚀', item: 'jetpack', label: '火箭背包' },
  ];
  const RANKS = [
    { name: '起步新秀', need: 0,     color: '#b9c6d6' },
    { name: '街头车手', need: 2000,  color: '#7bd88f' },
    { name: '改装好手', need: 6000,  color: '#4dabf7' },
    { name: '疾风精英', need: 15000, color: '#cc5de8' },
    { name: '传说车神', need: 35000, color: '#ffd24a' },
  ];
  function rankOf(total) {
    let r = RANKS[0];
    for (const x of RANKS) if (total >= x.need) r = x;
    return r;
  }
  function nextRankOf(total) {
    for (const x of RANKS) if (total < x.need) return x;
    return null;
  }
  // 宝箱：等一会儿就能白开，等不及就看广告秒开。
  // wait 单位是秒 —— 短到"下次打开游戏时已经好了"，长到"值得花一次广告跳过"。
  const CHESTS = [
    { name: '木质宝箱', icon: '📦', wait: 45,  color: '#c99a5b', items: 1, minRarity: 1 },
    { name: '白银宝箱', icon: '🎁', wait: 240, color: '#c9d6e2', items: 2, minRarity: 1 },
    { name: '黄金宝箱', icon: '👑', wait: 720, color: '#ffd24a', items: 3, minRarity: 2 },
  ];
  const QUEST_DEFS = [
    { id: 'clear2', name: '通关 2 关',        need: 2,  rewardItem: 'shield',  rewardN: 1 },
    { id: 'gift20', name: '收集 20 份礼物',   need: 20, rewardItem: 'magnet',  rewardN: 1 },
    { id: 'gradeS', name: '拿到 1 次 S 评价', need: 1,  rewardItem: 'jetpack', rewardN: 1 },
  ];
  const FREE_ITEM_CD = 4 * 3600 * 1000;   // 看广告领道具的冷却：4 小时

  // 成就定义（留存系统）：id + 名称 + 触发条件描述。unlock 逻辑见 unlockAchievement。
  const ACHIEVEMENTS = [
    { id: 'firstClear',  icon: '🏆', name: '初次通关',   desc: '通过第 1 关' },
    { id: 'clear10',     icon: '🚩', name: '闯关达人',   desc: '通过第 10 关' },
    { id: 'gift50',      icon: '🎁', name: '收藏家',     desc: '累计收集 50 件礼物' },
    { id: 'noHit',       icon: '💫', name: '毫发无伤',   desc: '一整关一次都不受伤' },
    { id: 'combo5',      icon: '🔥', name: '连击高手',   desc: '单关连击达到 5 次' },
    { id: 'gradeS',      icon: '⭐', name: '满分达人',   desc: '一关拿到 S 评级' },
    { id: 'play20',      icon: '🎮', name: '老玩家',     desc: '累计挑战 20 局' },
    { id: 'house3',      icon: '🏠', name: '有房一族',   desc: '建成大房子（完美通关 3 关）' },
    { id: 'endless300',  icon: '🏃', name: '疾风跑者',   desc: '无尽冲刺跑过 300 米' },
    { id: 'endless1000', icon: '🌪', name: '追风少年',   desc: '无尽冲刺跑过 1000 米' },
  ];

  /* ===========================================================================
   * 3. 小工具
   * ======================================================================== */
  // 可替换随机源（每日挑战用日期 seed 固定关卡；普通模式用真随机）
  let rng = Math.random;
  function seededRng(seed) {
    let s = (seed >>> 0) || 1;
    return function () {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      return s / 0x7fffffff;
    };
  }
  function hashStr(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rand(a, b) { return a + rng() * (b - a); }
  function ri(a, b) { return Math.floor(a + rng() * (b - a + 1)); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }
  function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  /* ===========================================================================
   * 4. 游戏实例
   * ======================================================================== */
  function createGame(deps) {
    const ctx = deps.ctx;
    const storage = deps.storage;
    const sfx = deps.sfx;
    const ads = deps.ads;
    const vibrate = deps.vibrate || function () {};

    /* ---------- 视口 / 坐标系 ---------- */
    // 逻辑坐标系：宽度固定为可视宽度，高度由屏幕比例推导。
    // 竖屏时可视宽度收窄（看得少但元素大），横屏时放宽。
    const view = { w: 900, h: 540, dpr: 1, scale: 1, portrait: false, pad: 120, safeBottom: 0 };

    function resize(width, height, dpr, insets) {
      const wantW = (height > width) ? 660 : 900;  // 竖屏 660 / 横屏 900 逻辑像素宽
      const scale = width / wantW;
      view.w = width / scale;
      view.h = height / scale;
      view.dpr = clamp(dpr || 1, 1, 2.5);
      view.scale = scale;
      view.portrait = view.h > view.w;
      const insetBottom = (insets && insets.bottom) || 0;
      view.safeBottom = insetBottom / scale;        // 刘海屏 / Home 指示条避让（逻辑像素）
      view.pad = view.portrait ? 300 : 122;         // 底部留给虚拟按键的逻辑高度
      ctx.setTransform(
        view.dpr * scale, 0, 0, view.dpr * scale, 0, 0
      );
      sky = null;   // 强制重建天空渐变缓存
      buildBackdrop();
    }

    /* ---------- 存档 ---------- */
    const SKEY = 'petadv.save.v1';
    const save = storage.get(SKEY, { best: 1, gifts: 0, pet: 'cat', runs: 0 });
    // 意见② 新字段：acc 已拥有的装饰品 id 列表 / eq 当前穿戴 / house 房子进度 0-3。
    // 留存系统字段：bestScore 单关最高分 / scores 排行榜 top10 / achievements 成就 / dailyBest 每日挑战。
    // 旧存档没有这些字段，这里统一补默认值（旧档不丢）。
    if (!Array.isArray(save.acc)) save.acc = [];
    if (!save.eq) save.eq = { hat: '', glasses: '', neck: '' };
    if (!save.house) save.house = 0;
    if (!save.bestScore) save.bestScore = 0;
    if (!Array.isArray(save.scores)) save.scores = [];
    if (!save.achievements) save.achievements = {};
    if (!save.dailyBest) save.dailyBest = {};
    // 道具系统：bag 是背包（itemId → 数量），equipped 是下一关要带的道具
    if (!save.bag || typeof save.bag !== 'object') save.bag = {};
    if (typeof save.equipped !== 'string') save.equipped = '';
    // 留存系统：签到 / 宝箱 / 每日任务 / 累计分（段位） / 免费道具冷却
    if (!save.sign || typeof save.sign !== 'object') save.sign = { last: '', streak: 0, total: 0 };
    if (!Array.isArray(save.chests)) save.chests = [];
    if (!save.quests || typeof save.quests !== 'object') save.quests = { date: '', prog: {}, claimed: {} };
    if (!save.totalScore) save.totalScore = 0;
    if (!save.freeItemAt) save.freeItemAt = 0;
    // 改装系统：coins 金币 / parts 各部位各级零件数量 / idleAt 离线收益计时起点
    // parts 结构：{ engine: [lv1数, lv2数, ..., lv6数], tires: [...], ... }
    if (typeof save.coins !== 'number') save.coins = 0;
    if (!save.parts || typeof save.parts !== 'object') save.parts = {};
    for (const s of PART_SLOTS) {
      if (!Array.isArray(save.parts[s.id]) || save.parts[s.id].length !== PART_MAX_LV) {
        const old = save.parts[s.id];
        save.parts[s.id] = [0, 0, 0, 0, 0, 0];
        // 旧档迁移：若曾存过单值，按"持有 1 级零件 n 个"理解，不丢资产
        if (typeof old === 'number') save.parts[s.id][0] = old | 0;
      }
    }
    if (typeof save.idleAt !== 'number' || save.idleAt <= 0) save.idleAt = Date.now();
    // 难度模式（休闲 / 挑战）：老少咸宜的分层开关，定义见 MODES
    if (typeof save.mode !== 'string' || !MODE_BY_ID[save.mode]) save.mode = 'casual';
    // 精通星级：level → 该关历史最好星级(1~3)。跨会话保留，只增不减。
    if (!save.stars || typeof save.stars !== 'object') save.stars = {};
    // 无尽冲刺：历史最远距离（米）。无尽没有关卡号，「最远」就是它的长期目标。
    if (!save.endlessBest) save.endlessBest = 0;
    function persist() { storage.set(SKEY, save); }

    /* ---------- 道具掉落与背包 ---------- */
    function itemWeight(it) { return it.rarity === 1 ? 60 : (it.rarity === 2 ? 26 : 8); }
    function rollItem(minRarity) {
      const cand = [];
      for (const it of ITEMS) if (it.rarity >= (minRarity || 1)) cand.push(it);
      let total = 0;
      for (const it of cand) total += itemWeight(it);
      let r = rng() * total;
      for (const it of cand) { r -= itemWeight(it); if (r <= 0) return it; }
      return cand[cand.length - 1] || ITEMS[0];
    }
    function grantItem(id, n) {
      save.bag[id] = (save.bag[id] | 0) + (n || 1);
      persist();
    }
    function bagCount(id) { return save.bag[id] | 0; }
    function bagTotal() {
      let n = 0;
      for (const k in save.bag) if (save.bag.hasOwnProperty(k)) n += save.bag[k] | 0;
      return n;
    }
    /* 消耗并生效一件携带的道具。返回 false 表示背包里没有了（自动卸下）。 */
    function consumeEquippedItem() {
      equippedItem = save.equipped || '';
      if (!equippedItem) return false;
      if (bagCount(equippedItem) <= 0) { save.equipped = ''; equippedItem = ''; persist(); return false; }
      save.bag[equippedItem] = bagCount(equippedItem) - 1;
      if (save.bag[equippedItem] <= 0) delete save.bag[equippedItem];
      persist();
      return true;
    }

    /* ---------- 改装零件 / 金币 / 离线收益 ---------- */
    /* 零件按「拥有该部位的最高等级」生效 —— 直觉就是"我车上装的是最好的那个"。
     * 低等级零件不会白费：它们是合成高等级零件的材料（2 个同级 → 1 个高一级）。 */
    function partCount(slot, lv) { const a = save.parts[slot]; return a ? (a[lv - 1] | 0) : 0; }
    function partBestLv(slot) {
      const a = save.parts[slot]; if (!a) return 0;
      for (let lv = PART_MAX_LV; lv >= 1; lv--) if ((a[lv - 1] | 0) > 0) return lv;
      return 0;
    }
    function partOwned(slot) {
      const a = save.parts[slot]; if (!a) return 0;
      let n = 0; for (let i = 0; i < PART_MAX_LV; i++) n += a[i] | 0;
      return n;
    }
    /* 车库总强度 = 5 个部位最高等级之和（0 ~ 30）。封面用它做「我的车多强」的一眼指标 */
    function garagePower() { let n = 0; for (const s of PART_SLOTS) n += partBestLv(s.id); return n; }
    function partBonus() {
      const b = { vmax: 1, accel: 1, jump: 1, brakeAdd: 0, coin: 1 };
      for (const s of PART_SLOTS) {
        const lv = partBestLv(s.id); if (!lv) continue;
        /* 用 lv 而不是 lv-1 作为倍数：1 级零件也立刻有收益。
         * 让第一次花钱就看到数字变好，是这条循环能不能转起来的关键 ——
         * 如果 1 级是 +0%，玩家买完第一件零件只会觉得"白买了"。 */
        if (s.stat === 'vmax') b.vmax += s.per * lv;
        else if (s.stat === 'accel') b.accel += s.per * lv;
        else if (s.stat === 'jump') b.jump += s.per * lv;
        else if (s.stat === 'brake') b.brakeAdd += s.per * lv;
        else if (s.stat === 'coin') b.coin += s.per * lv;
      }
      return b;
    }

    /* ---------- 难度模式 ---------- */
    /* 选择要存进存档：跨会话保留。默认休闲 —— 新玩家不该一上来就被劝退。 */
    function curMode() { return modeOf(save.mode || 'casual'); }
    function setMode(id) {
      if (!MODE_BY_ID[id]) return false;
      save.mode = id; persist(); return true;
    }
    /* 累计满星数：封面"精通度"与成就的长期指标。 */
    function starsTotal() {
      if (!save.stars) return 0;
      let n = 0;
      for (const k in save.stars) if (save.stars.hasOwnProperty(k)) n += save.stars[k] | 0;
      return n;
    }
    /* 本关上限心数 = 模式基础值 + 爱心罐头道具。
     * 抽成函数是因为"关卡开始"和"广告复活补满"两处都要用同一个数，各写一份迟早会写歪。 */
    function maxLives() { return curMode().lives + (equippedItem === 'heart' ? 1 : 0); }

    function addCoins(n) { save.coins = Math.max(0, (save.coins | 0) + Math.round(n || 0)); persist(); }
    function buyPart(slot) {
      if (!PART_BY_ID[slot]) return false;
      if ((save.coins | 0) < PART_PRICE) return false;
      save.coins -= PART_PRICE;
      save.parts[slot][0] = (save.parts[slot][0] | 0) + 1;
      persist();
      return true;
    }
    function canMerge(slot, lv) { return lv < PART_MAX_LV && partCount(slot, lv) >= 2; }
    function mergeOne(slot, lv) {
      if (!canMerge(slot, lv)) return false;
      save.parts[slot][lv - 1] -= 2;
      save.parts[slot][lv] = (save.parts[slot][lv] | 0) + 1;
      persist();
      return true;
    }
    /* 一键合成：从低级往高级逐级合并，一轮清空所有可合成项。
     * 为什么值得做成一键：合成是这个游戏最爽的正反馈时刻，让它零摩擦 ——
     * 玩家点一下听见一串"合成音"，比让他点 20 次体验好得多。 */
    function mergeAll() {
      let n = 0;
      for (const s of PART_SLOTS) {
        for (let lv = 1; lv < PART_MAX_LV; lv++) {
          while (canMerge(s.id, lv)) { mergeOne(s.id, lv); n++; }
        }
      }
      return n;
    }
    function mergeableCount() {
      let n = 0;
      for (const s of PART_SLOTS) for (let lv = 1; lv < PART_MAX_LV; lv++) if (canMerge(s.id, lv)) n++;
      return n;
    }
    /* 待收离线收益：累计时长（封顶 8 小时）× 每秒产出 × 氮气金币加成 */
    function idlePending() {
      const raw = Math.max(0, (Date.now() - (save.idleAt || Date.now())) / 1000);
      const sec = Math.min(IDLE_CAP_SEC, raw);
      return {
        sec: sec,
        capped: raw >= IDLE_CAP_SEC,
        coins: Math.floor(sec / 3600 * IDLE_PER_HOUR * partBonus().coin),
      };
    }
    /* 把"最后活跃时间"推到现在。
     * 为什么需要它：离线收益必须只在"玩家不在玩"的时候累计，否则一边玩一边挂机
     * 就是双重收益（通关已经给金币了）。游戏进行中每隔十几秒刷一次 idleAt，
     * 那么玩家关掉页面时 idleAt 就约等于最后活跃时刻，待收时长自然等于离线时长。
     * 带节流是因为 step() 是 60Hz 调用的，不节流会把 localStorage 写爆。 */
    let idleTouchAt = 0;
    function touchIdle(force) {
      const now = Date.now();
      if (!force && now - idleTouchAt < 15000) return;
      idleTouchAt = now;
      save.idleAt = now;
      persist();
    }
    function collectIdle(mult) {
      const p = idlePending();
      const got = Math.floor(p.coins * (mult || 1));
      save.idleAt = Date.now();
      addCoins(got);
      return got;
    }

    /* =========================================================================
     * 留存钩子实现：签到 / 任务 / 宝箱 / 免费道具
     * ====================================================================== */
    function keyOfDate(d) {
      return '' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    }
    function canSign() { return save.sign.last !== todayKey(); }
    function doSign() {
      if (!canSign()) return null;
      const yk = keyOfDate(new Date(Date.now() - 86400000));
      // 昨天签过 → 连签 +1；否则断签从 1 重来。连签奖励递增是"明天还要来"的动力。
      save.sign.streak = (save.sign.last === yk) ? (save.sign.streak | 0) + 1 : 1;
      if (save.sign.streak > SIGN_REWARDS.length) save.sign.streak = 1;   // 7 天一轮回
      save.sign.last = todayKey();
      save.sign.total = (save.sign.total | 0) + 1;
      const r = SIGN_REWARDS[(save.sign.streak - 1) % SIGN_REWARDS.length];
      if (r.item) grantItem(r.item, 1);
      else { save.gifts = (save.gifts | 0) + r.n; persist(); }
      // 签到额外送一个木质宝箱（增加每日登录动机）
      grantChest(0);
      return r;
    }

    function ensureQuests() {
      const tk = todayKey();
      if (save.quests.date !== tk) {
        save.quests = { date: tk, prog: {}, claimed: {} };
        persist();
      }
    }
    function bumpQuest(id, n) {
      ensureQuests();
      save.quests.prog[id] = (save.quests.prog[id] | 0) + (n || 1);
      persist();
    }
    function questProgress(q) { ensureQuests(); return Math.min(save.quests.prog[q.id] | 0, q.need); }
    function questDone(q) { ensureQuests(); return (save.quests.prog[q.id] | 0) >= q.need; }
    function questClaimed(q) { ensureQuests(); return !!save.quests.claimed[q.id]; }
    function claimQuest(q) {
      ensureQuests();
      if (!questDone(q) || questClaimed(q)) return false;
      save.quests.claimed[q.id] = 1;
      grantItem(q.rewardItem, q.rewardN);
      persist();
      return true;
    }
    function questsPending() {
      ensureQuests();
      let n = 0;
      for (const q of QUEST_DEFS) if (questDone(q) && !questClaimed(q)) n++;
      return n;
    }

    function chestReady(c) { return Date.now() - c.at >= CHESTS[c.t].wait * 1000; }
    function chestLeftSec(c) { return Math.max(0, Math.ceil((CHESTS[c.t].wait * 1000 - (Date.now() - c.at)) / 1000)); }
    function grantChest(ti) {
      if (save.chests.length >= 4) return false;
      save.chests.push({ t: ti, at: Date.now() });
      persist();
      return true;
    }
    function openChestAt(idx) {
      const c = save.chests[idx];
      if (!c) return null;
      const def = CHESTS[c.t];
      const got = [];
      for (let i = 0; i < def.items; i++) {
        const it = rollItem(def.minRarity);
        grantItem(it.id, 1);
        got.push(it);
      }
      save.chests.splice(idx, 1);
      persist();
      return got;
    }
    /* 开箱入口：到点直接开，没到点走激励视频秒开 —— 广告位之一 */
    function openChestFlow(idx) {
      const c = save.chests[idx];
      if (!c) return;
      if (chestReady(c)) { finishOpenChest(idx); return; }
      ads.showRewarded('chest', function (ok) {
        if (!ok) { toast('广告没看完，宝箱还得再等等'); return; }
        finishOpenChest(idx);
      });
    }
    function finishOpenChest(idx) {
      const got = openChestAt(idx);
      if (!got) return;
      sfx.play('open');
      let s = '';
      for (const it of got) s += it.icon + it.name + ' ';
      toast('开箱获得：' + s);
    }
    /* 看广告免费领一件稀有以上道具（4 小时冷却）—— 广告位之二 */
    function freeItemByAd() {
      const left = freeItemLeftMs();
      if (left > 0) { toast('冷却中，' + Math.ceil(left / 60000) + ' 分钟后可再领'); return; }
      ads.showRewarded('item', function (ok) {
        if (!ok) { toast('广告没看完'); return; }
        save.freeItemAt = Date.now();
        const it = rollItem(2);        // 保底稀有：一次广告的回报要看得见，否则没人点
        grantItem(it.id, 1);
        persist();
        sfx.play('item');
        toast('获得 ' + it.icon + ' ' + it.name + '！');
      });
    }
    function freeItemLeftMs() {
      return Math.max(0, FREE_ITEM_CD - (Date.now() - (save.freeItemAt || 0)));
    }

    /* ---------- 运行时状态 ---------- */
    let state = 'cover';   // cover | playing | paused | dead | cleared | ad
    let level = 1;
    let runGifts = 0;      // 本次挑战累计
    /* 道具系统（本次跑关内的生效状态）：
     * shieldLeft = 还能挡几次伤害；magnetLeft / boostLeft = 剩余生效帧数。
     * 由玩家开局携带的道具注入（见 startRun），关卡结束或返回封面时清零。
     * 只影响数值与渲染，不触碰碰撞盒 —— 和 PET_VIS_SCALE 同样的解耦思路。 */
    let shieldLeft = 0, magnetLeft = 0, boostLeft = 0;
    let equippedItem = '';   // 本次跑关携带的道具 id（'' 表示没带）
    let droppedItems = [];   // 本次通关掉落的道具（结算界面展示"你拿到了什么"）
    let pet = PETS[0];
    let vehicle = VEHICLES[0];
    let theme = THEMES[0];

    let player = null;
    let platforms = [];
    let hazards = [];
    let stars = [];        // 沿途小礼物
    let goal = null;       // 终点礼物箱
    let particles = [];
    let floaters = [];     // 飘字
    let levelWidth = 2600;
    let cameraX = 0, cameraY = 0;
    let shake = 0;
    let timeAcc = 0;
    let checkpoint = { x: 90, y: GROUND_BASE - 50 };
    let revivesUsed = 0;
    let comboCount = 0;    // 连续无伤吃星
    let runClean = true;   // 意见②：本关是否一次都没受伤（完美通关攒房子）
    let runScore = 0;      // 本关得分（评分系统，已含难度倍率）
    let runScoreRaw = 0;   // 倍率前的原始得分（金币结算用，避免倍率被重复放大）
    let runCoins = 0;      // 本关结算获得的金币（结算界面展示 + 翻倍用）
    let runCoinsDoubled = false; // 本关金币是否已翻倍（防止重复刷同一个广告位）
    let runCombo = 0;      // 本关最大连击
    let runGrade = null;   // 本关评级 { g, color, label }（过关结算后写入）
    /* 精通星级：每关最多 3 颗（通关 / 集齐礼物 / 无伤）。
     * runStarsGot / runStarsTotal 是"本关实际吃到"与"本关共有"的礼物数，
     * 判"集齐"必须用"实际 == 总数"而不是"吃了 3 个"—— 关卡礼物数会随难度变。 */
    let runStars = 0;
    let runStarsGot = 0;
    let runStarsTotal = 0;
    let runStarsNew = false;   // 本关星级是否刷新了最好成绩（结算页给个提示）
    /* 无尽冲刺（老少咸宜的"成年人目标"）：没有终点，跑到跑不动为止。
     * 与闯关模式共用同一套物理/碰撞/渲染，只在三处分流：
     *   ① 地形不停向前延伸（见 extendEndless），不生成终点与礼物箱；
     *   ② 难度由"跑了多远"驱动，而不是关卡号；
     *   ③ 结算看"跑了多少米"，不看关卡。
     * 这样无尽模式不需要复制一份游戏循环，所有已修好的手感与碰撞都自动继承。 */
    let endlessMode = false;    // 本次跑关是否无尽模式
    let endlessDist = 0;        // 已冲刺距离（米）—— 无尽模式的核心分数
    let endlessGenX = 0;        // 地形已铺设到的世界坐标 x（续铺边界）
    let endlessTier = 0;        // 当前难度档（0 起，随距离提升）
    let endlessRock = 0;        // 已发放到的里程碑（每 100 米一档）
    let endlessNewBest = false; // 本次是否刷新最远纪录（结算页提示用）
    let lastMaxGap = 0;         // 最近一次生成使用的"最大缺口"上限（供调试/测试读取，避免测试重算公式）
    let dailyMode = false; // 每日挑战模式：用日期 seed 固定关卡
    let dailyKey = '';     // 今日日期 key（YYYYMMDD）
    let questRuns = 0;     // 本局累计通关次数（每日任务追踪）
    let questGiftCount = 0; // 本关收集礼物数（每日任务追踪）
    let coyote = 0, jumpBuffer = 0, jumpHeld = false, jumpFrames = 0;
    let screenFlash = 0;
    let bannerMsg = '';
    let bannerT = 0;
    let pendingUnlock = null;   // 意见②：本关开出的装饰品（cleared 界面展示）
    let petAction = '';         // 小屋动作：'' | tv | eat | sleep
    let roomVisitUsed = false;  // 本次 room 是否已触发过互动提示

    /* ---------- BGM 接线（意见③）：防御 stub sfx 没有这两个方法 ---------- */
    function startBgm(idx) {
      if (sfx && sfx.startBgm) { try { sfx.startBgm(idx); } catch (e) {} }
    }
    function stopBgm() {
      if (sfx && sfx.stopBgm) { try { sfx.stopBgm(); } catch (e) {} }
    }

    /* ---------- 评分 & 成就（留存系统） ---------- */
    // 分数构成：通关 100 + 每星 30 + 连击加成(combo-1)*5 + 无伤 50。
    // 满分 ≈ 255（全星+无伤+满连击）。评级映射：
    //   S ≥ 230  完美     A ≥ 180  太棒了   B ≥ 130  不错   C < 130  继续加油
    function gradeFor(score) {
      if (score >= 230) return { g: 'S', color: '#ffd24a', label: '完美！' };
      if (score >= 180) return { g: 'A', color: '#7afcff', label: '太棒了' };
      if (score >= 130) return { g: 'B', color: '#9af29a', label: '不错' };
      return { g: 'C', color: '#c9c9c9', label: '继续加油' };
    }
    let achievementToastT = 0;   // 成就解锁弹窗倒计时
    function unlockAchievement(id) {
      if (save.achievements[id]) return;
      save.achievements[id] = Date.now();
      const a = ACHIEVEMENTS.find(function (x) { return x.id === id; });
      if (a) { toast('成就解锁：' + a.icon + ' ' + a.name + '！'); }
      persist();
    }

    /* ---------- 输入 ---------- */
    const input = { left: false, right: false, jump: false };
    const keyState = { left: false, right: false, jump: false };
    const touchState = { left: false, right: false, jump: false };

    /* ---------- 背景装饰（视差层，世界坐标） ---------- */
    let backdrop = [];
    let sky = null;
    /* 背景装饰的"循环跨度"。普通模式=关卡长度；无尽模式关卡无限延伸，
     * 若继续拿 levelWidth 当跨度，装饰会被摊薄到几十万像素里直接看不见 ——
     * 所以无尽模式锁一个固定跨度，让装饰在原地循环平铺。 */
    let backdropSpan = 2600;
    function buildBackdrop() {
      backdrop = [];
      backdropSpan = endlessMode ? 2400 : levelWidth + 400;
      const n = 26;
      for (let i = 0; i < n; i++) {
        backdrop.push({
          x: rand(-200, backdropSpan),
          y: rand(WORLD_TOP_VIS(), GROUND_BASE - 40),
          r: rand(14, 46),
          p: rand(0.18, 0.45),      // 视差系数
          k: rand(0, 1),
          a: rand(0.10, 0.30),
        });
      }
    }
    function WORLD_TOP_VIS() { return -260; }

    /* =========================================================================
     * 5. 关卡生成
     * ====================================================================== */
    function jumpDistance(v) {
      // 满跳水平位移 = 极速 × 滞空帧数；滞空 = 2 × v0 / g
      return v.vmax * (2 * v.jump / GRAVITY);
    }

    /* ---------- 无尽冲刺：距离 ↔ 难度档 ---------- */
    const ENDLESS_PX_PER_M = 50;    // 50 世界像素 = 1 米
    const ENDLESS_AHEAD = 2600;     // 玩家前方至少保有这么多地形
    const ENDLESS_CHUNK = 2200;     // 每次向前续铺的长度
    const ENDLESS_MAX_TIER = 8;     // 难度档上限：再往上只加距离不加密度，避免出现无解地形
    /* 距离 → 难度档：每 120 米一档。把这个档位当成"等效关卡号"喂给生成公式，
     * 于是"新障碍随关数解锁""障碍越来越密"这些既有逻辑全部自动生效，
     * 一行难度代码都不用另写。 */
    function endlessTierOf(dist) {
      return Math.min(ENDLESS_MAX_TIER, Math.floor((dist || 0) / 120));
    }
    function endlessTierLv() { return 1 + endlessTier; }
    /* 里程从"出生点"起算，而不是世界坐标 0 点 —— 玩家出生在 x=90，
     * 不减掉这段的话开局第一帧就显示"1 米"，像是白送了一米。 */
    const ENDLESS_START_X = 90;
    function endlessMeters() {
      return player ? Math.floor(Math.max(0, player.x - ENDLESS_START_X) / ENDLESS_PX_PER_M) : 0;
    }

    function generateLevel(lv) {
      const dm = curMode();          // 当前难度模式：缺口容错 / 障碍密度 / 心数都读它
      /* 无尽模式：重置里程类状态（每次重开/复活重来都从 0 米、第 1 档开始），
       * 并把"等效关卡号"换成距离档位 —— 下面所有难度公式读的都是 lvCurve。 */
      const endless = !!endlessMode;
      if (endless) { endlessTier = 0; endlessDist = 0; endlessRock = 0; endlessNewBest = false; }
      const lvCurve = endless ? endlessTierLv() : lv;
      theme = THEMES[(endless ? 0 : lv - 1) % THEMES.length];
      // 无尽固定用基础载具：跑到一半偷偷换车会让手感突变（道具/零件加成照常生效）
      const baseVehicle = endless ? VEHICLES[0] : VEHICLES[(lv - 1) % VEHICLES.length];
      // 道具载具：关卡难度（maxGap）永远按默认载具算，算完再换成玩家携带的载具。
      // 这样"更强的载具"只会让关卡更好过，绝不会生成跳不过去的坑 —— 道具是纯收益，
      // 也让平衡工作从"每个载具都要重新验证关卡"简化为一次性验证。
      const itEq = ITEM_BY_ID[equippedItem];
      vehicle = (itEq && itEq.kind === 'vehicle')
        ? { id: itEq.id, name: itEq.name, emoji: itEq.icon, vmax: itEq.vmax, jump: itEq.jump,
            accel: itEq.accel, brake: itEq.brake, accent: itEq.accent, fromItem: true }
        : baseVehicle;

      /* 改装零件加成：叠在载具基础数值之上。
       * 必须克隆成新对象 —— vehicle 可能直接引用 VEHICLES 表里的元素，原地修改会
       * 永久污染载具表，导致数值每关越叠越高（这是个很难查的隐蔽 bug）。 */
      const pb = partBonus();
      vehicle = {
        id: vehicle.id, name: vehicle.name, emoji: vehicle.emoji, accent: vehicle.accent,
        fromItem: vehicle.fromItem,
        vmax:  vehicle.vmax  * pb.vmax,
        jump:  vehicle.jump  * pb.jump,
        accel: vehicle.accel * pb.accel,
        // brake 是"松手后速度的保留率"，越接近 1 越滑。车架等级越高越抓地（更容易停），
        // 但下限锁 0.80 —— 再低就硬得像撞墙，操控手感反而变差。
        brake: Math.max(0.80, Math.min(0.97, vehicle.brake + pb.brakeAdd)),
      };

      // 每日挑战用固定 seed 随机源；普通模式恢复真随机（保证每次都不一样）
      if (!dailyMode) rng = Math.random;

      // 意见④：路要很长——第 1 关约 3500px，之后每关 +300。
      // [PLACEHOLDER] 目标单局 30-60s，等 playtest 实测均速后回调。
      // 无尽模式只需铺出开头一段，之后由 extendEndless() 无限续接
      levelWidth = endless ? ENDLESS_CHUNK + 1200 : 3200 + lv * 300;

      const maxGap = Math.floor(jumpDistance(baseVehicle) * dm.margin);  // 容错率由模式定：休闲 28% / 挑战 20%
      lastMaxGap = maxGap;
      const minGap = 62;
      const gapChance = clamp(0.30 + lvCurve * 0.015 + dm.gap, 0.30, dm.gapMax);

      platforms = [];
      hazards = [];
      stars = [];
      particles = [];
      floaters = [];
      runClean = true;             // 每次生成新关卡重置完美标记
      runStarsGot = 0;             // 本关吃到的礼物数
      runStarsTotal = 0;           // 本关礼物总数（下方生成礼物后回填）
      runStars = 0;
      runStarsNew = false;
      runScore = 0;                // 每次生成新关卡重置评分/连击/评级
      runCoins = 0;                // 本关金币结算重置
      runCoinsDoubled = false;     // 翻倍机会重置
      runCombo = 0;
      runGrade = null;

      // --- 5.1 地形：起步平台 → （缺口 | 平台）循环 → 终点平台 ---
      // 硬性约束：缺口后必须接平台，否则连续缺口会累加成不可跨越的死路。
      const START_W = 520, END_W = 460;
      let x = 0, lastY = GROUND_BASE;
      let lastWasGap = false;
      platforms.push({ x: 0, y: GROUND_BASE, w: START_W, h: PLAT_THICK, start: true });
      x = START_W;

      while (x < (endless ? levelWidth : levelWidth - END_W - 200)) {
        if (!lastWasGap && rng() < gapChance) {
          x += ri(minGap, maxGap);
          lastWasGap = true;
        } else {
          const w = ri(240, 460);
          const y = clamp(lastY + ri(-58, 58), GROUND_BASE - 68, GROUND_BASE);
          platforms.push({ x: x, y: y, w: w, h: PLAT_THICK });
          lastY = y;
          x += w;
          lastWasGap = false;
        }
      }
      // 循环若停在缺口上，先补一段短平台，否则「最后一个缺口 + 终点偏移」会拼出超宽死路
      if (lastWasGap) {
        platforms.push({ x: x, y: GROUND_BASE, w: 240, h: PLAT_THICK });
        x += 240;
      }
      if (endless) {
        /* 无尽：没有终点平台，也没有礼物箱。把"已铺到哪"记进 endlessGenX，
         * 后续 extendEndless() 就顺着这个边界继续往前铺。 */
        endlessGenX = x;
        levelWidth = x + 600;
        goal = null;
      } else {
        platforms.push({ x: x + 100, y: GROUND_BASE, w: END_W, h: PLAT_THICK, end: true });
        levelWidth = x + 100 + END_W;
      }

      // --- 5.2 障碍：只放在非起点/终点平台上，满足最小间距与边缘留白 ---
      // 休闲模式刻意压低密度、拉大最小间距（看得清、躲得开）；挑战模式则收紧。
      const avail = Math.max(600, (endless ? endlessGenX : levelWidth) - START_W - END_W);
      // 三个边界全部按模式取值：休闲档 = 改造前原值，挑战档才收紧（更密、更不留缝）
      const spacing = clamp(360 - lvCurve * 6 + dm.spacingAdd, dm.spacingMin, dm.spacingMax);
      const count = clamp(Math.round(avail / spacing), 4, dm.cap);
      const minSpacing = Math.max(dm.minSpacingFloor, spacing * 0.75);
      // 意见④：难度分档——新障碍随关数逐步解锁（unlock 字段见 HAZARDS 定义）
      const unlockedKeys = HAZARD_KEYS.filter(function (k) { return lvCurve >= (HAZARDS[k].unlock || 0); });
      const placed = [];
      let guard = 0;
      for (let i = 0; i < count && guard < count * 30; guard++) {
        const seg = platforms[ri(1, platforms.length - 2)];
        if (!seg || seg.start || seg.end) continue;
        // 留白按模式取值：这是"障碍能不能落上去"的准入门槛，比 spacing 更靠前，
        // 只调 spacing 而不动这里，窄平台会先把障碍筛掉，密度根本提不上来。
        const margin = clamp(seg.w * dm.hazMarginK, dm.hazMarginMin, dm.hazMarginMax);
        if (seg.w < margin * 2 + 60) continue;
        const hx = rand(seg.x + margin, seg.x + seg.w - margin);
        // 最小间距检查：避免障碍连体导致无解
        let ok = true;
        for (const px of placed) {
          if (Math.abs(px - hx) < minSpacing) { ok = false; break; }
        }
        if (!ok) continue;

        const type = pick(unlockedKeys);
        const def = HAZARDS[type];
        const obj = { type: type, x: hx, y: seg.y, t: rand(0, 6), phase: rand(0, 6.28), baseY: seg.y };
        if (def.cycle !== undefined) obj.cycle = def.cycle;   // 火焰/闸门周期：漏复制会变成 undefined → NaN → 永远关/永远不喷
        if (def.r) { obj.r = def.r; obj.w = def.r * 2; obj.h = def.r * 2; }
        else { obj.w = def.w; obj.h = def.h; }

        if (type === 'gear' || type === 'saw') {
          obj.y = seg.y - def.r * 2 + 8;                 // 贴地
          obj.spin = (type === 'gear' ? 1.6 : 5.2) * (rng() < 0.5 ? -1 : 1);
        } else if (type === 'fire') {
          obj.y = seg.y - def.h;
        } else if (type === 'patrol') {
          obj.y = seg.y - def.h;
          obj.range = clamp(rand(50, Math.min(130, (seg.w - margin * 2) / 2)), 40, 130);
          obj.spd = 1.1 + Math.min(lvCurve * 0.045, 0.9);
          obj.baseX = hx;
        } else if (type === 'gate') {
          obj.y = seg.y - def.h;
        } else if (type === 'slider') {
          obj.range = rand(70, 130);
          obj.spd = 1.3 + Math.min(lvCurve * 0.04, 0.8);
          obj.baseY = seg.y - 44 - rand(20, 70);
          obj.y = obj.baseY;
        } else if (type === 'triGear') {
          // 意见④：上下往复移动的三角齿轮，悬空转着咬人，看准节奏从下面冲过去
          obj.range = rand(60, 110);
          obj.spd = 1.1 + Math.min(lvCurve * 0.05, 1.0);
          obj.baseY = seg.y - 46 - rand(20, 70);
          obj.y = obj.baseY;
          obj.spin = 2.8 * (rng() < 0.5 ? -1 : 1);
        } else if (type === 'blocker') {
          // 意见④：挡路大个子，站地上不动，必须跳过它才能继续
          obj.y = seg.y - def.h;
        } else {
          obj.y = seg.y - def.h;
        }
        hazards.push(obj);
        placed.push(hx);
        i++;
      }

      // --- 5.3 沿途小礼物：3 颗，落点取"离障碍最远"处（保证可安全获取）---
      const segs = platforms.slice(1, -1);
      const wantStars = 3;
      for (let i = 0; i < wantStars && segs.length; i++) {
        const idx = Math.floor((i + 0.5) / wantStars * segs.length);
        const seg = segs[Math.min(idx, segs.length - 1)];
        if (!seg) continue;
        /* 在段内扫描候选落点，选"到最近障碍距离最大"的那个。
         * 不能沿用"发现太近就退回段中点"的老写法 —— 段中点自己也可能紧贴障碍
         * （实测出现过礼物正好悬在尖刺正上方，想吃就必须挨一下）。
         * 礼物现在绑着「集齐礼物」精通星，而受伤又会丢掉「无伤」星，
         * 一旦礼物拿不到就是两颗星互斥 —— 所以落点必须保证"绝对不挨打也能拿"。 */
        let sx = seg.x + seg.w * 0.5, bestClear = -1;
        for (let t = 0.22; t <= 0.78; t += 0.04) {
          const cand = seg.x + seg.w * t;
          let nearest = 1e9;
          for (const h of hazards) {
            const d = Math.abs((h.baseX || h.x) + (h.w || 0) / 2 - cand);
            if (d < nearest) nearest = d;
          }
          if (nearest > bestClear) { bestClear = nearest; sx = cand; }
        }
        stars.push({ x: sx, y: seg.y - 120, r: 16, bob: rand(0, 6.28), taken: false });
      }
      runStarsTotal = stars.length;   // "集齐礼物"这颗星的判定基准

      // --- 5.4 终点（无尽模式没有终点，goal 保持 null）---
      if (!endless) {
        const endSeg = platforms[platforms.length - 1];
        goal = { x: endSeg.x + endSeg.w * 0.5 - 26, y: endSeg.y - 74, w: 52, h: 52, bob: 0, taken: false };
      }

      // --- 5.5 玩家 ---
      // 三心机制：撞到障碍/掉坑各扣 1 心，扣光才死亡（比一击死亡更宽容，利于留存）。
      const startSeg = platforms[0];
      player = {
        x: 90, y: startSeg.y - 50, w: 44, h: 50,
        vx: 0, vy: 0, onGround: false, dir: 1,
        animT: 0, invuln: 0, dead: false,
        lives: maxLives(),                            // 模式基础心数（休闲 3 / 挑战 2）+ 爱心罐头道具
        landT: 0,                                    // 落地压扁动画计时
      };
      checkpoint = { x: 90, y: startSeg.y - 50 };
      cameraX = 0;
      coyote = 0; jumpBuffer = 0;
      timeAcc = 0;
      comboCount = 0;
      screenFlash = 0;
      shake = 0;
      buildBackdrop();
      startBgm((lv - 1) % 6);      // 意见③：每一关不同的背景音乐（跟主题走）
    }

    /* 进入新关卡前调用：消耗背包里的一件道具，把效果注入本关。
     * 消耗制是刻意设计 —— 用完了就得再去刷一关，这是留存闭环的一环，
     * 也让「看广告领道具」这个变现点有实际需求支撑（见 ads 的 item 分支）。
     * 调用顺序必须是：runGifts 重置 → prepareRunItem → generateLevel。 */
    function prepareRunItem() {
      shieldLeft = 0; magnetLeft = 0; boostLeft = 0;
      equippedItem = '';
      const id = save.equipped || '';
      if (!id) return;
      if (bagCount(id) <= 0) { save.equipped = ''; persist(); return; }
      if (!consumeEquippedItem()) { save.equipped = ''; persist(); return; }
      equippedItem = id;
      if (id === 'shield') shieldLeft = 1;
      else if (id === 'magnet') magnetLeft = 1500;   // 25 秒 @60fps
      else if (id === 'boost') boostLeft = 1200;     // 20 秒
      else if (id === 'giftbox') runGifts += 5;
      // heart（多 1 命）与 vehicle 类载具由 generateLevel 读 equippedItem 生效
    }
    /* 重玩本关：不重复消耗道具，但把限时效果重置回满 —— 否则失败重来会白白损失时长 */
    function refreshItemEffects() {
      shieldLeft = 0; magnetLeft = 0; boostLeft = 0;
      if (equippedItem === 'shield') shieldLeft = 1;
      else if (equippedItem === 'magnet') magnetLeft = 1500;
      else if (equippedItem === 'boost') boostLeft = 1200;
    }

    /* =========================================================================
     * 5B. 无尽冲刺：前方续铺 + 里程碑
     * ====================================================================== */
    /* 前方地形续铺。核心约束只有一条 —— 玩家永远看得见前方有路。
     * 为什么"边跑边铺"而不是"开局一次生成十万像素"：
     *  ① 一次性铺满会让平台/障碍数组永久膨胀，而每帧要遍历它们做碰撞；
     *  ② 预排的难度曲线跟不上玩家真实进度，跑得快的会觉得太松、跑得慢的会被突然卡死。
     * 边跑边铺则天然只保留玩家附近的地形，难度也总能跟着当前里程走。 */
    function extendEndless() {
      if (!endlessMode || !player || state !== 'playing') return;
      if (player.x + ENDLESS_AHEAD < endlessGenX) return;   // 前方还够跑，不用铺
      const dm = curMode();
      const baseVehicle = VEHICLES[0];
      const maxGap = Math.floor(jumpDistance(baseVehicle) * dm.margin);
      lastMaxGap = maxGap;
      const minGap = 62;
      const lvCurve = endlessTierLv();
      const gapChance = clamp(0.30 + lvCurve * 0.015 + dm.gap, 0.30, dm.gapMax);
      const spacing = clamp(360 - lvCurve * 6 + dm.spacingAdd, dm.spacingMin, dm.spacingMax);
      const minSpacing = Math.max(dm.minSpacingFloor, spacing * 0.75);

      /* --- 地形：从上一块平台的右边缘继续往前 --- */
      const last = platforms[platforms.length - 1];
      let x = last.x + last.w, lastY = last.y, lastWasGap = false;
      const target = endlessGenX + ENDLESS_CHUNK;
      const newSegs = [];
      while (x < target) {
        if (!lastWasGap && rng() < gapChance) {
          x += ri(minGap, maxGap);
          lastWasGap = true;
        } else {
          const w = ri(240, 460);
          const y = clamp(lastY + ri(-58, 58), GROUND_BASE - 68, GROUND_BASE);
          const seg = { x: x, y: y, w: w, h: PLAT_THICK };
          platforms.push(seg); newSegs.push(seg);
          lastY = y; x += w; lastWasGap = false;
        }
      }
      // 停在缺口上就补一段短平台：否则"缺口 + 下一段续铺的起点"会拼成跨不过去的死路
      if (lastWasGap) {
        const seg = { x: x, y: GROUND_BASE, w: 240, h: PLAT_THICK };
        platforms.push(seg); newSegs.push(seg);
        x += 240;
      }
      endlessGenX = x;
      levelWidth = x + 600;

      /* --- 障碍：规则与 generateLevel 完全一致，只是作用在新铺的这段上 --- */
      if (newSegs.length) {
        const avail = Math.max(400, target - (last.x + last.w));
        const count = clamp(Math.round(avail / spacing), 2, dm.cap);
        const unlocked = HAZARD_KEYS.filter(function (k) { return lvCurve >= (HAZARDS[k].unlock || 0); });
        let guard = 0;
        for (let i = 0; i < count && guard < count * 30; guard++) {
          const seg = newSegs[ri(0, newSegs.length - 1)];
          if (!seg) continue;
          const margin = clamp(seg.w * dm.hazMarginK, dm.hazMarginMin, dm.hazMarginMax);
          if (seg.w < margin * 2 + 60) continue;
          const hx = rand(seg.x + margin, seg.x + seg.w - margin);
          // 最小间距检查跨"整局"做（扫全部障碍）：只看本段的话，段与段的交界处会连体
          let ok = true;
          for (const h of hazards) {
            if (Math.abs((h.baseX || h.x) - hx) < minSpacing) { ok = false; break; }
          }
          if (!ok) continue;

          const type = pick(unlocked);
          const def = HAZARDS[type];
          const obj = { type: type, x: hx, y: seg.y, t: rand(0, 6), phase: rand(0, 6.28), baseY: seg.y };
          if (def.cycle !== undefined) obj.cycle = def.cycle;
          if (def.r) { obj.r = def.r; obj.w = def.r * 2; obj.h = def.r * 2; }
          else { obj.w = def.w; obj.h = def.h; }
          if (type === 'gear' || type === 'saw') {
            obj.y = seg.y - def.r * 2 + 8;
            obj.spin = (type === 'gear' ? 1.6 : 5.2) * (rng() < 0.5 ? -1 : 1);
          } else if (type === 'patrol') {
            obj.y = seg.y - def.h;
            obj.range = clamp(rand(50, Math.min(130, (seg.w - margin * 2) / 2)), 40, 130);
            obj.spd = 1.1 + Math.min(lvCurve * 0.045, 0.9);
            obj.baseX = hx;
          } else if (type === 'slider') {
            obj.range = rand(70, 130);
            obj.spd = 1.3 + Math.min(lvCurve * 0.04, 0.8);
            obj.baseY = seg.y - 44 - rand(20, 70);
            obj.y = obj.baseY;
          } else if (type === 'triGear') {
            obj.range = rand(60, 110);
            obj.spd = 1.1 + Math.min(lvCurve * 0.05, 1.0);
            obj.baseY = seg.y - 46 - rand(20, 70);
            obj.y = obj.baseY;
            obj.spin = 2.8 * (rng() < 0.5 ? -1 : 1);
          } else {
            obj.y = seg.y - def.h;
          }
          hazards.push(obj);
          i++;
        }
      }

      /* --- 礼物：每段续铺补 1 颗，落点沿用"最大净空"扫描（保证不挨打也拿得到）--- */
      if (newSegs.length) {
        const seg = newSegs[ri(0, newSegs.length - 1)];
        let sx = seg.x + seg.w * 0.5, bestClear = -1;
        for (let t = 0.22; t <= 0.78; t += 0.04) {
          const cand = seg.x + seg.w * t;
          let nearest = 1e9;
          for (const h of hazards) {
            const d = Math.abs((h.baseX || h.x) + (h.w || 0) / 2 - cand);
            if (d < nearest) nearest = d;
          }
          if (nearest > bestClear) { bestClear = nearest; sx = cand; }
        }
        stars.push({ x: sx, y: seg.y - 120, r: 16, bob: rand(0, 6.28), taken: false });
      }
    }

    /* 里程推进：每 100 米一次小奖励，每 300 米补 1 颗心，每 120 米升一档难度。
     * 为什么要"周期性补心"：无尽模式掉一颗心就永久少一颗，长距离奔跑会被慢慢磨死，
     * 玩家感受到的是"运气不好"而不是"我还能更强"。定时补心把长跑曲线拉平，
     * 让真正决定成绩的变成操作稳定性 —— 这才是成人玩家愿意反复刷的那种难度。 */
    function endlessProgress() {
      const m = endlessMeters();
      endlessDist = m;
      const tier = endlessTierOf(m);
      if (tier !== endlessTier) {
        endlessTier = tier;
        theme = THEMES[tier % THEMES.length];   // 越跑风景越不同（六种主题循环）
        sky = null;                             // 换主题必须重建天空渐变缓存
        buildBackdrop();
        if (tier > 0) { toast('🚩 ' + (tier * 120) + ' 米！赛道升级：' + theme.name); sfx.play('rev'); }
      }
      while (endlessRock + 100 <= m) {
        endlessRock += 100;
        const gain = Math.max(5, Math.round(12 * partBonus().coin * curMode().coin));
        runCoins += gain;
        runGifts += 2;
        if (endlessRock % 300 === 0 && player.lives < maxLives()) player.lives++;
        sfx.play('coin');
        spawnBurst(player.x + player.w / 2, player.y, '#ffd24a', 18);
        pushFloater(player.x, player.y - 34, endlessRock + 'm ！ 🪙+' + gain, '#ffd24a');
        bannerMsg = '🚩 ' + endlessRock + ' 米里程碑 · 🪙+' + gain;
        bannerT = 1.6;
      }
      extendEndless();
    }

    /* =========================================================================
     * 6. 物理步进（固定 60Hz）
     * ====================================================================== */
    function step() {
      if (state !== 'playing') { stepParticles(); return; }
      const p = player;
      timeAcc += FIXED_DT;
      touchIdle(false);   // 游戏进行中持续推进"最后活跃时间"（内部有节流）
      if (p.landT > 0) p.landT--;   // 落地压扁动画倒计时（squash & stretch）
      if (magnetLeft > 0) magnetLeft--;   // 道具「磁力球」剩余帧
      if (boostLeft > 0) boostLeft--;     // 道具「加速靴」剩余帧

      /* --- 水平 --- */
      const dirIn = (input.right ? 1 : 0) - (input.left ? 1 : 0);
      if (dirIn !== 0) {
        p.vx += dirIn * vehicle.accel;
        p.dir = dirIn;
      } else {
        p.vx *= vehicle.brake;              // 松手滑行：brake 越接近 1 越难刹
        if (Math.abs(p.vx) < 0.12) p.vx = 0;
      }
      const vmaxNow = vehicle.vmax * (boostLeft > 0 ? 1.35 : 1);   // 道具「加速靴」+35% 极速
      p.vx = clamp(p.vx, -vmaxNow, vmaxNow);

      /* --- 跳跃：土狼时间 + 输入缓冲 + 可变跳高 --- */
      if (p.onGround) coyote = COYOTE; else if (coyote > 0) coyote--;
      if (jumpBuffer > 0) jumpBuffer--;
      if ((coyote > 0) && jumpBuffer > 0) {
        p.vy = -vehicle.jump;
        p.onGround = false;
        coyote = 0; jumpBuffer = 0;
        jumpFrames = 0; jumpHeld = true;
        sfx.play('jump');
        spawnDust(p.x + p.w / 2, p.y + p.h, 6, '#ffffff');
      }
      // 可变跳高：松手切断上升速度。
      // 前 MIN_JUMP_FRAMES 帧不切断——触屏玩家绝大多数是「点一下」而不是长按，
      // 没有这段保护，一次轻点只能跳到满跳的 18%，等于把跳跃做废。
      if (jumpHeld) {
        jumpFrames++;
        if (!input.jump && jumpFrames >= MIN_JUMP_FRAMES && p.vy < 0) {
          p.vy *= JUMP_CUT;
          jumpHeld = false;
        }
        if (p.vy >= 0) jumpHeld = false;
      }

      /* --- 重力 --- */
      p.vy += GRAVITY;
      if (p.vy > MAX_FALL) p.vy = MAX_FALL;

      /* --- 分轴碰撞解算 --- */
      p.x += p.vx;
      for (const s of platforms) {
        if (!aabb(p.x, p.y, p.w, p.h, s.x, s.y, s.w, s.h)) continue;
        // 自动上台阶：高度差在 STEP_UP 以内直接抬上去，
        // 否则 1~14px 的小坎会把玩家硬生生钉住——那不是难度，是 bug。
        const step = (p.y + p.h) - s.y;
        if (step > 0 && step <= STEP_UP) {
          p.y = s.y - p.h;
          if (p.vy > 0) p.vy = 0;
          continue;
        }
        if (p.vx > 0) p.x = s.x - p.w;
        else if (p.vx < 0) p.x = s.x + s.w;
        else p.x = (p.x + p.w / 2 < s.x + s.w / 2) ? s.x - p.w : s.x + s.w;  // 速度为 0 也要推出去，否则会卡在墙里
        p.vx = 0;
      }
      if (p.x < 0) { p.x = 0; p.vx = 0; }

      const wasAir = !p.onGround;
      p.y += p.vy;
      p.onGround = false;
      for (const s of platforms) {
        if (!aabb(p.x, p.y, p.w, p.h, s.x, s.y, s.w, s.h)) continue;
        if (p.vy > 0) {
          p.y = s.y - p.h;
          if (wasAir && p.vy > 6) {
            spawnDust(p.x + p.w / 2, p.y + p.h, 5, '#ffffff');
            sfx.play('land');
          }
          p.vy = 0;
          p.onGround = true;
          if (wasAir) p.landT = 11;
        } else if (p.vy < 0) {
          // 顶到平台底面：只停住上升，不做位置传送。
          // 平台厚度是 420px，若照搬「推到 s.y + s.h」会把玩家瞬移到屏幕外直接判坠落。
          p.vy = 0;
        }
      }
      if (p.onGround) jumpHeld = true;

      // 检查点：只要稳稳站在平台上并向前推进就刷新，
      // 不能用「速度接近极速才记录」——否则玩家全程满速跑，掉下去会一路退回起点。
      if (p.onGround) {
        const s = platforms.find(pl => p.x + p.w > pl.x && p.x < pl.x + pl.w);
        if (s && p.x > checkpoint.x + 220) checkpoint = { x: p.x, y: p.y - 10 };
      }

      /* --- 坠落 --- */
      if (p.y > ABYSS_Y) {
        hurt(1, true);
        if (!p.dead) respawnAtCheckpoint();
        return;
      }

      /* --- 障碍更新与碰撞 --- */
      for (const h of hazards) {
        h.t += FIXED_DT;
        if (h.type === 'patrol') {
          h.x = h.baseX + Math.sin(h.t * h.spd) * h.range;
        } else if (h.type === 'slider' || h.type === 'triGear') {
          h.y = h.baseY + Math.sin(h.t * h.spd) * h.range;
        } else if (h.type === 'gate') {
          const cyc = (h.t / h.cycle + h.phase / 6.28) % 1;
          h.open = cyc < HAZARDS.gate.openRatio ? 1 : 0;
        } else if (h.type === 'fire') {
          const cyc = (h.t / h.cycle + h.phase / 6.28) % 1;
          h.on = cyc < (1 - HAZARDS.fire.safeRatio) ? 1 : 0;
        }
      }

      if (p.invuln > 0) {
        p.invuln--;
      } else {
        for (const h of hazards) {
          const def = HAZARDS[h.type];
          if (h.type === 'gate') {
            if (h.open) continue;
            // 实体墙：阻挡而非扣血
            if (aabb(p.x, p.y, p.w, p.h, h.x, h.y, h.w, h.h)) {
              if (p.vx > 0) p.x = h.x - p.w;
              else if (p.vx < 0) p.x = h.x + h.w;
              p.vx = 0;
            }
            continue;
          }
          if (h.type === 'fire' && !h.on) continue;
          if (aabb(p.x, p.y, p.w, p.h, h.x, h.y, h.w, h.h)) {
            hurt(1, false);
            break;
          }
        }
      }

      /* --- 小礼物 --- */
      // 道具「磁力球」：先把 170px 内的礼物吸过来，再走拾取判定
      if (magnetLeft > 0) {
        const pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
        for (const s of stars) {
          if (s.taken) continue;
          const dx = pcx - s.x, dy = pcy - s.y;
          const d2 = dx * dx + dy * dy;
          if (d2 > 4 && d2 < 170 * 170) {
            const d = Math.sqrt(d2);
            s.x += dx / d * 4.6; s.y += dy / d * 4.6;
          }
        }
      }
      for (const s of stars) {
        if (s.taken) continue;
        if (aabb(p.x, p.y, p.w, p.h, s.x - s.r, s.y - s.r, s.r * 2, s.r * 2)) {
          s.taken = true;
          runStarsGot++;             // 精通星级：集齐礼物判定用
          comboCount++;
          runCombo = Math.max(runCombo, comboCount);
          const gain = 1;
          runGifts += gain;
          // 记录本关礼物收集进度（用于每日任务追踪，结算时 bumpQuest('gift20') 读取）
          questGiftCount++;
          // 评分：每星 30 + 连击加成（连击越高越值钱，奖励连续无伤吃星）
          const pts = 30 + (comboCount - 1) * 5;
          runScore += pts;
          /* 金币同步实时累积（吃一颗星立刻 +金币）。
           * 为什么要实时而不是通关后一次结算：金币数字在屏幕上肉眼可见地往上跳，
           * 是这类"点击产出"游戏最核心的即时正反馈（《合成竞速之王》点屏幕出金币
           * 就是同一个道理）。攒到最后才给，爽感会损失一大半。 */
          const coinGain = Math.max(1, Math.round(2 * partBonus().coin));
          runCoins += coinGain;
          sfx.play('coin');
          spawnBurst(s.x, s.y, '#ffd24a', 12);
          pushFloater(s.x, s.y - 10, '+' + pts + '  🪙+' + coinGain, '#ffd24a');
          if (comboCount >= 2) pushFloater(s.x, s.y - 32, comboCount + ' 连击！', '#7afcff');
        }
      }

      /* --- 终点（无尽模式 goal 恒为 null，这里自然跳过）--- */
      if (goal && !goal.taken && aabb(p.x, p.y, p.w, p.h, goal.x, goal.y, goal.w, goal.h)) {
        goal.taken = true;
        onCleared();
        return;
      }

      stepParticles();

      /* --- 无尽冲刺：里程 / 里程碑奖励 / 前方地形续铺 --- */
      if (endlessMode) endlessProgress();

      /* --- 相机 --- */
      const targetX = p.x - view.w * 0.35;
      cameraX = lerp(cameraX, targetX, 0.14);
      cameraX = clamp(cameraX, 0, Math.max(0, levelWidth - view.w));
      if (shake > 0) shake--;
      if (bannerT > 0) bannerT -= FIXED_DT;
      if (screenFlash > 0) screenFlash -= FIXED_DT;
    }

    function stepParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const q = particles[i];
        q.life--;
        q.x += q.vx; q.y += q.vy; q.vy += q.g;
        q.vx *= 0.98;
        if (q.life <= 0) particles.splice(i, 1);
      }
      if (particles.length > 220) particles.splice(0, particles.length - 220);
      for (let i = floaters.length - 1; i >= 0; i--) {
        const f = floaters[i];
        f.life--; f.y -= 0.9;
        if (f.life <= 0) floaters.splice(i, 1);
      }
    }

    /* =========================================================================
     * 7. 伤害 / 死亡 / 过关
     * ====================================================================== */
    function hurt(amount, isFall) {
      const p = player;
      if (p.invuln > 0 || p.dead) return;
      // 道具「护盾泡泡」：优先扣护盾，不掉血、不断连击、不破坏完美通关
      if (shieldLeft > 0) {
        shieldLeft--;
        p.invuln = 78;
        sfx.play('shield');
        vibrate(30);
        spawnBurst(p.x + p.w / 2, p.y + p.h / 2, '#6fe3ff', 18);
        pushFloater(p.x + p.w / 2, p.y - 8, '🛡 护盾挡下！', '#6fe3ff');
        if (isFall) respawnAtCheckpoint();
        return;
      }
      // 三心机制：撞到/掉坑各扣 1 心，扣光才死亡。掉坑扣心后回检查点重来。
      p.lives -= amount;
      comboCount = 0;
      runClean = false;              // 受过伤 → 本关不再算完美
      p.invuln = 78;                 // 1.3s 无敌，防止连续掉血
      shake = isFall ? 6 : 12;
      screenFlash = 0.18;
      sfx.play(isFall ? 'fall' : 'hurt');
      vibrate(isFall ? 30 : 60);
      spawnBurst(p.x + p.w / 2, p.y + p.h / 2, pet.color, 16);
      if (!isFall) {
        p.vx = -p.dir * 4.2;
        p.vy = -5.2;
      }
      if (p.lives <= 0) {
        p.lives = 0;
        p.dead = true;
        onDead();
      } else {
        pushFloater(p.x + p.w / 2, p.y - 6, '-1 ❤', '#ff6b8a');
      }
    }

    function respawnAtCheckpoint() {
      const p = player;
      p.x = checkpoint.x;
      p.y = checkpoint.y;
      p.vx = 0; p.vy = 0;
      p.invuln = 96;
      pushFloater(p.x, p.y - 10, '回到检查点', '#9ad0ff');
    }

    function onDead() {
      state = 'dead';
      stopBgm();
      sfx.play('fail');
      vibrate(140);
      spawnBurst(player.x + player.w / 2, player.y + player.h / 2, pet.color, 30);
      save.runs = (save.runs | 0) + 1;
      if (endlessMode) {
        /* 无尽结算：距离就是分数，按距离发金币（无尽模式的主要产出）。
         * 金币 = 距离 × 0.8 × 零件加成 × 难度倍率 —— 让"跑得远"直接等于"赚得多"。
         * 这条正循环是把成年玩家留在游戏里的关键：挑战模式还额外享受 2× 激励。 */
        endlessDist = endlessMeters();
        endlessNewBest = endlessDist > (save.endlessBest | 0);
        if (endlessNewBest) save.endlessBest = endlessDist;
        runCoins += Math.round(endlessDist * 0.8 * partBonus().coin * curMode().coin);
        addCoins(runCoins);
        if (endlessDist >= 300) unlockAchievement('endless300');
        if (endlessDist >= 1000) unlockAchievement('endless1000');
      } else if (level > (save.best | 0)) {
        save.best = level;
      }
      save.gifts = (save.gifts | 0) + runGifts;
      if ((save.runs | 0) >= 20) unlockAchievement('play20');
      persist();
    }

    function onCleared() {
      state = 'cleared';
      stopBgm();
      sfx.play('clear');
      vibrate(60);
      const base = 3;
      runGifts += base;
      spawnBurst(goal.x + goal.w / 2, goal.y + goal.h / 2, '#ffd24a', 34);
      if (level + 1 > (save.best | 0)) save.best = level + 1;
      save.gifts = (save.gifts | 0) + runGifts;
      // 评分结算：通关 100 + 无伤 50，加上吃星/连击分 → 映射评级
      runScore += 100;
      if (runClean) runScore += 50;
      /* 顺序很关键：先按"原始表现"评级，再乘难度倍率。
       * 反过来的话，挑战模式的 2× 会把 B 级表现灌水成 S 级，评级就失去意义了。 */
      runGrade = gradeFor(runScore);
      const dmC = curMode();
      runScoreRaw = runScore;
      runScore = Math.round(runScore * dmC.score);
      if (runScore > (save.bestScore | 0)) save.bestScore = runScore;

      /* ---------- 精通星级结算 ----------
       * 三颗星对应三种"玩得更好"的方式，覆盖三种不同的动机：
       *  ① 通关    —— 保底正反馈，人人有份
       *  ② 集齐礼物 —— 奖励愿意探索路线的玩家（吃满才给）
       *  ③ 无伤    —— 奖励操作精度，是纯度最高的技巧证明
       * 只增不减（存历史最好）：星级是"我达成过"，不该被后来的失误抹掉。 */
      runStars = 0;
      if (runStarsTotal > 0 && runStarsGot >= runStarsTotal) runStars = 2;
      else runStars = 1;
      if (runClean) runStars++;      // 通关星 + 集齐星 + 无伤星，最多 3
      const prevBestStar = save.stars[level] | 0;
      runStarsNew = runStars > prevBestStar;
      if (runStarsNew) save.stars[level] = runStars;
      // 每日挑战：记录今日最佳
      if (dailyMode) save.dailyBest[dailyKey] = Math.max(save.dailyBest[dailyKey] || 0, runScore);
      // 排行榜：本地 top10（分数/关卡/宠物）
      save.scores.push({ score: runScore, level: level, pet: pet.id, date: Date.now() });
      save.scores.sort(function (a, b) { return b.score - a.score; });
      if (save.scores.length > 10) save.scores.length = 10;
      // 道具掉落（用户诉求③）：每关必掉 1 件；S 评价或每 5 关额外掉 1 件，且第 5 关保底稀有以上。
      // rationale：必掉 1 件保证"每关都有收获"的正反馈；每 5 关的保底稀有给长期玩家
      // 一个可预期的惊喜节奏，避免连开 10 个普通道具的挫败感。
      droppedItems = [];
      const d1 = rollItem(1);
      grantItem(d1.id, 1); droppedItems.push(d1);
      if (runGrade.g === 'S' || level % 5 === 0) {
        const d2 = rollItem(level % 5 === 0 ? 2 : 1);
        grantItem(d2.id, 1); droppedItems.push(d2);
      }
      // 留存系统：通关后更新任务进度 + 释放宝箱槽位
      bumpQuest('clear2', 1);
      if (runGrade.g === 'S') bumpQuest('gradeS', 1);
      bumpQuest('gift20', questGiftCount);   // 本关收集的礼物数
      grantChest(0);    // 每通关一次释放一个木质宝箱
      // 重置本关任务进度追踪
      questGiftCount = 0;
      for (const a of ACCESSORIES) {
        if (save.acc.indexOf(a.id) < 0 && (save.gifts | 0) >= a.need) {
          save.acc.push(a.id);
          pendingUnlock = a;
          break;                       // 一关只开一件，孩子看得清
        }
      }
      // 意见②：整关没受过伤 → 房子进度 +1，攒满 3 段建成大房子（解锁小屋）。
      if (runClean && save.house < 3) {
        save.house++;
        if (save.house >= 3) { toast('🏠 大房子建成啦！'); }
        else { toast('完美通关！房子 ' + save.house + '/3'); }
      }
      // 成就触发
      unlockAchievement('firstClear');
      if (level >= 10) unlockAchievement('clear10');
      if ((save.gifts | 0) >= 50) unlockAchievement('gift50');
      if (runClean) unlockAchievement('noHit');
      if (runCombo >= 5) unlockAchievement('combo5');
      if (runGrade.g === 'S') unlockAchievement('gradeS');
      if (save.house >= 3) unlockAchievement('house3');
      // 段位系统：累计总分
      save.totalScore = (save.totalScore | 0) + runScore;
      /* 金币结算 —— 改装系统的唯一金币来源。
       * 两部分：跑关过程里吃星实时攒的（runCoins）+ 通关奖励。
       * 通关奖励让"跑得干净 / 评价高"直接等于"更多金币"，把玩家往更好的表现推；
       * 整体再乘氮气零件的金币加成，让"升级 → 收益更高"这条循环真正闭环。 */
      runCoins += Math.round((runScoreRaw * 1.0 + level * 20) * partBonus().coin * curMode().coin);
      addCoins(runCoins);
      persist();
    }

    function reviveByAd() {
      if (state !== 'dead' || revivesUsed >= 2) return;
      const cb = function (ok) {
        if (!ok) { toast('广告未看完，复活失败'); return; }
        player.lives = maxLives();     // 看广告复活：按当前模式补满
        player.dead = false;
        revivesUsed++;
        runClean = false;
        respawnAtCheckpoint();
        player.invuln = 120;
        state = 'playing';
        sfx.play('rev');
        startBgm();
        toast(endlessMode ? '复活成功！继续冲刺' : '复活成功！继续闯关');
      };
      ads.showRewarded('revive', cb);
    }

    function doubleRewardByAd() {
      if (state !== 'cleared') return;
      if (runCoinsDoubled) { toast('本关奖励已经翻倍过啦～'); return; }
      const cb = function (ok) {
        if (!ok) { toast('广告未看完'); return; }
        save.gifts = (save.gifts | 0) + runGifts;
        runGifts *= 2;
        addCoins(runCoins);              // 金币同步翻倍（跟礼物一个价，公平且好理解）
        runCoins *= 2;
        runCoinsDoubled = true;
        persist();
        sfx.play('coin');
        toast('奖励翻倍！+' + runGifts + ' 🎁  +' + runCoins + ' 🪙');
      };
      ads.showRewarded('double', cb);
    }

    function toast(msg) { bannerMsg = msg; bannerT = 2.2; }

     * 8. 粒子 / 飘字
     * ====================================================================== */
    function spawnDust(x, y, n, color) {
      for (let i = 0; i < n; i++) {
        particles.push({ x: x, y: y, vx: rand(-1.8, 1.8), vy: rand(-2.2, -0.2), g: 0.06, life: ri(14, 26), max: 26, color: color, size: rand(2, 4.5) });
      }
    }
    function spawnBurst(x, y, color, n) {
      for (let i = 0; i < n; i++) {
        const a = rand(0, 6.283), sp = rand(1.2, 5);
        particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, g: 0.14, life: ri(22, 46), max: 46, color: color, size: rand(2.5, 6) });
      }
    }
    function pushFloater(x, y, text, color) {
      floaters.push({ x: x, y: y, text: text, color: color, life: 60, max: 60 });
    }

    /* =========================================================================
     * 8.5 萌系角色库（纯 Canvas 手绘，替代 emoji）
     * 每只宠物 = 大头 Q 版 + 小身体；载具 = 彩色圆润小车。
     * ====================================================================== */
    const ART = {};

    // —— 通用眼 / 腮红 / 白描边圆 ——
    /* ---------- 功夫熊猫式 Q 版改造（3 条通用法则） ----------
     * ① 厚描边：所有白外轮廓从 2.2-2.4 加到 3.2-3.6 —— 卡通角色的"贴纸感"，
     *    也是功夫熊猫那种圆润厚实轮廓的来源，小屏上辨识度显著提升。
     * ② 体积感：头/身各加一层"左上亮、右下暗"的渐变，形状从饼变球。
     * ③ 幼态化：瞳孔放大（0.82r → 0.90r）+ 双高光 + 下眼睑反光 —— 大瞳孔
     *    高反光是婴儿图式（baby schema），直接触发"可爱"感知。
     * 这三条改在底层原语上，9 只宠物全部受益，无需逐只重画。 */
    ART.eye = function (g, x, y, r, t, wink) {
      const blink = (t % 3.1) < 0.11;
      if (blink || wink) {
        // 眨眼改成向上弯的"笑眼"弧线（旧版是直线，闭眼时像死掉）
        g.strokeStyle = '#2e2622'; g.lineWidth = Math.max(1.6, r * 0.38); g.lineCap = 'round';
        g.beginPath();
        g.moveTo(x - r * 0.78, y - r * 0.06);
        g.quadraticCurveTo(x, y + r * 0.46, x + r * 0.78, y - r * 0.06);
        g.stroke();
        return;
      }
      g.fillStyle = '#fff';
      g.beginPath(); g.ellipse(x, y, r, r * 1.06, 0, 0, 6.283); g.fill();
      g.fillStyle = '#2e2622';
      g.beginPath(); g.arc(x + r * 0.05, y + r * 0.05, r * 0.90, 0, 6.283); g.fill();
      // 主高光（左上）
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(x - r * 0.30, y - r * 0.34, r * 0.34, 0, 6.283); g.fill();
      // 副高光（右下小点）
      g.beginPath(); g.arc(x + r * 0.32, y + r * 0.36, r * 0.16, 0, 6.283); g.fill();
      // 下眼睑反光：让眼睛"水汪汪"
      g.fillStyle = 'rgba(255,255,255,0.30)';
      g.beginPath(); g.ellipse(x, y + r * 0.64, r * 0.48, r * 0.17, 0, 0, 6.283); g.fill();
    };
    ART.cheek = function (g, x, y, r) {
      g.fillStyle = 'rgba(255,105,120,0.50)';
      g.beginPath(); g.ellipse(x, y, r, r * 0.62, 0, 0, 6.283); g.fill();
      // 两道斜笔触（日系腮红，卡通感比纯色块强）
      g.strokeStyle = 'rgba(228,66,92,0.32)';
      g.lineWidth = Math.max(0.9, r * 0.15); g.lineCap = 'round';
      for (let i = -1; i <= 1; i++) {
        g.beginPath();
        g.moveTo(x + i * r * 0.42 - r * 0.18, y + r * 0.26);
        g.lineTo(x + i * r * 0.42 + r * 0.18, y - r * 0.26);
        g.stroke();
      }
    };
    ART.head = function (g, x, y, R, fill) {
      g.fillStyle = '#ffffff';
      g.beginPath(); g.arc(x, y, R + 3.4, 0, 6.283); g.fill();
      g.fillStyle = fill;
      g.beginPath(); g.arc(x, y, R, 0, 6.283); g.fill();
      // 体积渐变：左上打亮、右下压暗
      const grd = g.createLinearGradient(x - R * 0.5, y - R, x + R * 0.4, y + R);
      grd.addColorStop(0, 'rgba(255,255,255,0.30)');
      grd.addColorStop(0.55, 'rgba(255,255,255,0)');
      grd.addColorStop(1, 'rgba(0,0,0,0.12)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(x, y, R, 0, 6.283); g.fill();
    };
    ART.earRound = function (g, x, y, r, fill, inner) {
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(x, y, r + 3.2, 0, 6.283); g.fill();
      g.fillStyle = fill;
      g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
      if (inner) { g.fillStyle = inner; g.beginPath(); g.arc(x, y, r * 0.5, 0, 6.283); g.fill(); }
    };
    ART.earTri = function (g, x, y, w, h, fill, inner) {
      g.save();
      g.translate(x, y);
      g.fillStyle = '#fff';
      g.beginPath();
      g.moveTo(-w / 2 - 3.2, 2); g.lineTo(0, -h - 3.2); g.lineTo(w / 2 + 3.2, 2);
      g.closePath(); g.fill();
      g.fillStyle = fill;
      g.beginPath();
      g.moveTo(-w / 2, 2); g.lineTo(0, -h); g.lineTo(w / 2, 2);
      g.closePath(); g.fill();
      if (inner) { g.fillStyle = inner; g.beginPath(); g.moveTo(-w * 0.26, 2); g.lineTo(0, -h * 0.55); g.lineTo(w * 0.26, 2); g.closePath(); g.fill(); }
      g.restore();
    };
    ART.muzzle = function (g, x, y, rx, ry, fill) {

    ART.nose = function (g, x, y, r, fill) {

    // 手绘五角星

      for (let i = 0; i < 5; i++) {

        const a2 = a + 3.1416 / 5;
        g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
        g.lineTo(x + Math.cos(a2) * r * 0.45, y + Math.sin(a2) * r * 0.45);
      }
      g.closePath();
      g.fillStyle = fill || '#ffd24a'; g.fill();
      if (stroke) { g.strokeStyle = stroke; g.lineWidth = r * 0.16; g.stroke(); }
      g.restore();
    };

    // 头下方小身体白描边（带底白边）
    ART.body = function (g, x, y, rx, ry, fill, belly, strokeW) {
      const sw = strokeW === 0 ? 0 : 3.2;
      g.fillStyle = '#fff';
      g.beginPath(); g.ellipse(x, y, rx + sw, ry + sw, 0, 0, 6.283); g.fill();
      g.fillStyle = fill;
      g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 6.283); g.fill();
      if (belly) {
        g.fillStyle = belly;
        g.beginPath(); g.ellipse(x, y + 1.5, rx * 0.58, ry * 0.62, 0, 0, 6.283); g.fill();
      }
      const grd = g.createLinearGradient(x - rx, y - ry, x + rx * 0.6, y + ry);
      grd.addColorStop(0, 'rgba(255,255,255,0.26)');
      grd.addColorStop(0.5, 'rgba(255,255,255,0)');
      grd.addColorStop(1, 'rgba(0,0,0,0.12)');
      g.fillStyle = grd;
      g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 6.283); g.fill();
    };
    ART.paw = function (g, x, y, w, h, fill) {
      g.fillStyle = fill;
      g.beginPath(); g.ellipse(x, y, w, h, 0, 0, 6.283); g.fill();
    };
    // 把宠物画到 (x,y) 头中心，s 缩放，flip 朝向，t 动画，run 是否奔跑
    // 意见①：孩子要求「动物大一点点、迪士尼风、头大身小」。
    // PET_VIS_SCALE 只放大视觉（1.2×），碰撞盒 w:44 h:50 保持不变——
    // 碰撞盒一变，跳跃距离/平台手感全要重新调，视觉与手感解耦是这里的关键取舍。
    const PET_VIS_SCALE = 1.40;   // 旧值 1.2：孩子说"还不够大"，功夫熊猫式大头需要更夸张的体积
    ART.drawPet = function (id, g, x, y, s, flip, t, run, acc) {
      g.save();
      g.translate(x, y);
      // squash & stretch（挤压拉伸）：g.__sq 由调用方按运动状态设置。
      // 这是卡通动画 12 法则之首 —— 落地压扁、起跳拉伸，角色瞬间"有重量、有弹性"，
      // 比单纯放大尺寸更能传达可爱与活力。碰撞盒完全不受影响。
      const sq = g.__sq;
      if (sq) g.scale(sq[0], sq[1]);
      g.scale(flip * s * PET_VIS_SCALE, s * PET_VIS_SCALE);
      const fn = ART.pets[id] || ART.pets.cat;
      fn(g, t, run);
      if (acc) ART.drawAcc(g, acc, t);   // 意见②：帽子/眼镜/围巾（意见②的穿戴渲染）
      if (g.__mood) ART.drawMood(g, g.__mood, t);
      g.restore();
    };

    /* 头顶情绪符号：让角色"有反应"，是低成本高回报的可爱度投资 */
    ART.drawMood = function (g, mood, t) {
      g.save();
      if (mood === 'hurt') {
        // 汗滴（右上，带轻微晃动）
        const sw = Math.sin(t * 8) * 1.6;
        g.fillStyle = '#7fd4ff';
        g.beginPath();
        g.moveTo(20 + sw, -40);
        g.quadraticCurveTo(26 + sw, -32, 20 + sw, -28);
        g.quadraticCurveTo(14 + sw, -32, 20 + sw, -40);
        g.closePath(); g.fill();
      } else if (mood === 'happy') {
        // 上浮的小星星（两个交替闪）
        for (let i = 0; i < 2; i++) {
          const ph = (t * 1.6 + i * 0.5) % 1;
          g.globalAlpha = 1 - ph;
          ART.star(g, -18 + i * 36, -40 - ph * 20, 5.2, '#fff59a', '#f2b705');
        }
      } else if (mood === 'shield') {
        // 护盾泡泡（道具：护盾生效时）
        g.globalAlpha = 0.30 + Math.sin(t * 6) * 0.08;
        g.fillStyle = '#6fe3ff';
        g.beginPath(); g.arc(0, 6, 46, 0, 6.283); g.fill();
        g.globalAlpha = 0.85;
        g.strokeStyle = '#bff4ff'; g.lineWidth = 3;
        g.beginPath(); g.arc(0, 6, 46, 0, 6.283); g.stroke();
      }
      g.restore();
    };

    /* ---------- 装饰品（意见②）：画在宠物头中心坐标系里 ----------
     * 头 R≈21：帽 y≈-18，眼镜沿眼睛线 y≈-5，围巾/披风在头底 y≈18。
     * 各宠物头 R 有 ±3 差异，Q 版风格下统一偏移即可，不逐只校准。 */
    ART.drawAcc = function (g, eq, t) {

        g.beginPath(); g.roundRect ? g.roundRect(-12, -8, 10, 3, 1.5) : g.rect(-12, -8, 10, 3); g.fill();
      } else if (eq.glasses === 'starGlass') {
        g.fillStyle = '#ffd24a';
        ART.star(g, -8, -5, 6, '#ffd24a', '#d89a1e');
        ART.star(g, 8, -5, 6, '#ffd24a', '#d89a1e');
        g.strokeStyle = '#d89a1e'; g.lineWidth = 2;
        g.beginPath(); g.moveTo(-2, -5); g.lineTo(2, -5); g.stroke();
      }
      if (eq.hat === 'cap') {
        g.fillStyle = '#e5484d';
        g.beginPath(); g.arc(0, -15, 12, Math.PI, 0); g.fill();
        g.fillStyle = '#c0392b';
        g.beginPath(); g.roundRect ? g.roundRect(-15, -16, 30, 4.5, 2.2) : g.rect(-15, -16, 30, 4.5); g.fill();
        g.fillStyle = '#ffd24a';
        g.beginPath(); g.arc(0, -26, 2.6, 0, 6.283); g.fill();
      } else if (eq.hat === 'crown') {
        g.fillStyle = '#ffd24a';
        g.beginPath();
        g.moveTo(-11, -14); g.lineTo(-11, -24); g.lineTo(-5.5, -18); g.lineTo(0, -26);
        g.lineTo(5.5, -18); g.lineTo(11, -24); g.lineTo(11, -14);
        g.closePath(); g.fill();
        g.fillStyle = '#ff5e87';
        g.beginPath(); g.arc(0, -17.5, 1.8, 0, 6.283); g.fill();
      } else if (eq.hat === 'bowknot') {
        g.save();
        g.translate(8, -20);
        g.rotate(-0.25);
        g.fillStyle = '#ff7eb6';
        g.beginPath(); g.ellipse(-5.5, 0, 5.5, 3.8, -0.4, 0, 6.283); g.fill();
        g.beginPath(); g.ellipse(5.5, 0, 5.5, 3.8, 0.4, 0, 6.283); g.fill();
        g.fillStyle = '#e0508f';
        g.beginPath(); g.arc(0, 0, 2.6, 0, 6.283); g.fill();
        g.restore();
      }
      if (eq.neck === 'scarf') {
        g.fillStyle = '#e74c3c';
        g.beginPath(); g.roundRect ? g.roundRect(-11, 16, 22, 7, 3.5) : g.rect(-11, 16, 22, 7); g.fill();
        const sw = Math.sin(t * 5) * 2;
        g.beginPath();
        g.moveTo(9, 18); g.lineTo(17, 24 + sw); g.lineTo(15, 29 + sw); g.lineTo(7, 22);
        g.closePath(); g.fill();
      } else if (eq.neck === 'cape') {
        g.fillStyle = '#9b59b6';
        g.beginPath();
        g.moveTo(-11, 15); g.quadraticCurveTo(-18, 26, -13, 36);
        g.lineTo(13, 36); g.quadraticCurveTo(18, 26, 11, 15);
        g.closePath(); g.fill();
        g.fillStyle = 'rgba(255,255,255,0.25)';
        g.beginPath(); g.arc(0, 24, 6, 0, 6.283); g.fill();
      }
    };

    /* ---------- 零件等级 → 载具外观成长（借鉴《合成竞速之王》） ---------- */
    function drawPartGlow(g, t) {
      const power = garagePower();
      if (!power) return;            // 素车：一点装饰都不加
      const lv = {};
      for (const s of PART_SLOTS) lv[s.id] = partBestLv(s.id);

      /* ① 氮气：尾部火焰（车尾，即 -x 侧 —— 放大截图确认宠物脸朝 +x，
       * 所以"后方"是 -x。方向搞反会变成车头喷火）。长度随等级增长。 */
      const nlv = lv.nitro || 0;
      if (nlv > 0) {
        const len = 9 + nlv * 5.2;
        const fl = 0.72 + Math.sin(t * 26) * 0.28;
        const layers = [
          ['rgba(255,225,110,0.95)', 1.00],
          ['rgba(255,150,50,0.82)',  0.70],
          ['rgba(255,80,45,0.55)',   0.44],
        ];
        for (const L of layers) {
          const col = L[0], k = L[1];
          g.fillStyle = col;
          g.beginPath();
          g.moveTo(-16, -13);
          g.quadraticCurveTo(-16 - len * k * fl, -13 - 5 * k, -16 - len * k * fl * 1.2, -9);
          g.quadraticCurveTo(-16 - len * k * fl, -5 + 5 * k, -16, -5);
          g.closePath(); g.fill();
        }
      }

      // ② 发动机：排气管，挂在车尾（-x），每 2 级多一根（最多 3 根）
      const elv = lv.engine || 0;
      if (elv > 0) {
        const pipes = Math.min(3, Math.ceil(elv / 2));
        for (let i = 0; i < pipes; i++) {
          const px = -22 - i * 2.5, py = -21 - i * 2.4;
          g.fillStyle = '#8a9099';
          g.beginPath();
          if (g.roundRect) g.roundRect(px, py, 11, 3.4, 1.7); else g.rect(px, py, 11, 3.4);
          g.fill();
          g.fillStyle = '#dfe6ee';
          g.beginPath(); g.arc(px - 0.4, py + 1.7, 1.9, 0, 6.283); g.fill();
        }
      }

      // ③ 车架：底盘装甲板，2 级起出现，宽度随等级增加
      const clv = lv.chassis || 0;
      if (clv >= 2) {
        const w = 18 + clv * 3.4;
        g.fillStyle = 'rgba(46,52,62,0.92)';
        g.beginPath();
        if (g.roundRect) g.roundRect(-w / 2, -3.4, w, 5, 2.5); else g.rect(-w / 2, -3.4, w, 5);
        g.fill();
        g.strokeStyle = 'rgba(255,210,74,0.5)'; g.lineWidth = 1;
        g.beginPath(); g.moveTo(-w / 2 + 3, -1); g.lineTo(w / 2 - 3, -1); g.stroke();
      }

      // ④ 轮胎：轮毂反光圈，2 级起出现，亮度随等级提升
      const tlv = lv.tires || 0;
      if (tlv >= 2) {
        g.strokeStyle = 'rgba(255,255,255,' + Math.min(0.9, 0.22 + tlv * 0.13).toFixed(2) + ')';
        g.lineWidth = 1.9;
        for (const wx of [-15, 15]) { g.beginPath(); g.arc(wx, -7, 3.5, 0, 6.283); g.stroke(); }
      }

      // ⑤ 悬挂：轮上弹簧，2 级起出现（黄色小折线）
      const slv = lv.suspension || 0;
      if (slv >= 2) {
        g.strokeStyle = '#ffd24a'; g.lineWidth = 1.5;
        for (const wx of [-15, 15]) {
          g.beginPath();
          for (let i = 0; i <= 4; i++) {
            const yy = -21 + i * 2.1;
            const xx = wx + (i % 2 ? 2.6 : -2.6);
            if (i === 0) g.moveTo(xx, yy); else g.lineTo(xx, yy);
          }
          g.stroke();
        }
      }

      // ⑥ 总强度光晕：车库越强，车身外圈越亮 —— 一眼看出"这辆车改装过"
      if (power >= 6) {
        g.strokeStyle = 'rgba(255,210,74,' + Math.min(0.46, 0.055 * power).toFixed(2) + ')';
        g.lineWidth = 2.6;
        g.beginPath(); g.ellipse(0, -14, 29, 17.5, 0, 0, 6.283); g.stroke();
      }
    }

    /* ---------- 5 种载具画师（translate 到车底中心 (0,0) 上表面向上） ---------- */
    function drawVehicleShape(g, vid, accent) {
      // 零件装饰先画 → 火焰/装甲/光晕都在车身下层，不会糊住车体轮廓
      drawPartGlow(g, g.__vt || 0);
      const runL = Math.sin(g.__vt * 22) * 0.9;
      if (vid === 'escooter') {
        // 前后轮
        g.fillStyle = '#2e2622';
        g.beginPath(); g.arc(14, -7, 6.5, 0, 6.283); g.fill();
        g.beginPath(); g.arc(-15, -7, 6.5, 0, 6.283); g.fill();
        g.fillStyle = '#fff'; g.beginPath(); g.arc(14, -7, 2.4, 0, 6.283); g.fill();
        g.beginPath(); g.arc(-15, -7, 2.4, 0, 6.283); g.fill();
        // 踏板车身
        g.fillStyle = '#fff';
        g.beginPath(); g.roundRect ? g.roundRect(-16, -17, 34, 12, 6) : g.rect(-16, -17, 34, 12); g.fill();
        g.fillStyle = accent;
        g.beginPath(); g.roundRect ? g.roundRect(-14, -16, 30, 9, 5) : g.rect(-14, -16, 30, 9); g.fill();
        // 车头立杆
        g.strokeStyle = '#8a9099'; g.lineWidth = 4; g.lineCap = 'round';
        g.beginPath(); g.moveTo(-12, -15); g.quadraticCurveTo(-22, -22, -26, -34); g.stroke();
        // 车把 + 反光镜
        g.strokeStyle = '#5a6068'; g.lineWidth = 3.5;
        g.beginPath(); g.moveTo(-24, -36); g.lineTo(-30, -35); g.stroke();
        g.strokeStyle = '#f6a800'; g.lineWidth = 3.5;
